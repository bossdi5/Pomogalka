иться, тот ничего не боится.\n\n    Грамоте учиться — всегда пригодится.\n\n    Не надо хвалиться, если не знаешь, как хлеб родится.\n\nПодчёркнутые глаголы на -ться:\nвеселиться, разговориться, напиться, добиться, учиться, хвалиться.\nКакая пословица нравится и когда её употребить\n\nМне особенно нравится пословица: «Грамоте учиться — всегда пригодится».\n\nСитуации и цель:\n\n    Когда одноклассник не хочет делать домашнее задание или считает, что какой-то предмет ему не пригодится.\n\n    Когда младший брат или сестра ленятся читать, учить правила.\n\n    Цель: убедить человека, что знания и умение грамотно писать и говорить пригодятся в любой профессии и в жизни вообще.\n\nМорфологический разбор\n\nТого³\n\n    Того — местоимение (указывает на предмет, но не называет его).\n\n    Н. ф. — тот.\n\n    Пост. признаки: указательное.\n\n    Непост. признаки: ед. ч., ср. р., Р. п.\n\n    Синтаксическая роль: дополнение (боится кого? — того).\n\nНичего³\n\n    Ничего — местоимение (указывает на предмет, но не называет его).\n\n    Н. ф. — ничто.\n\n    Пост. признаки: отрицательное.\n\n    Непост. признаки: ед. ч., ср. р., Р. п.\n\n    Синтаксическая роль: дополнение (не боится чего? — ничего).\n\nФонетический разбор\n\nДобиться¹ [даб’и́ца] — 3 слога.\n\n    д [д] — согласный, звонкий парный, твёрдый парный;\n\n    о [а] — гласный, безударный;\n\n    б [б’] — согласный, звонкий парный, мягкий парный;\n\n    и [и́] — гласный, ударный;\n\n    т [ц] — согласный, глухой непарный, твёрдый непарный (сливается с с);\n\n    с — (сливается с т в звук [ц]);\n\n    я [а] — гласный, безударный.\n\n8 букв, 6 звуков.\n","45":"Ответ\n\nВыписанные слова с обозначением условий выбора орфограмм:\nСлово\tОрфограмма\nзнаешь\tбезударное личное окончание глагола, I спр.\nобильем\tразделительный ь перед е\nдышит\tбезударное личное окончание глагола, II спр.\nльются\tразделительный ь перед ю\nветерок\tбезударная гласная в корне (словарное слово)\nстепной\tбезударная гласная в корне (проверочное — степь)\nковыль\tбезударная гласная в корне (словарное слово)\nколышет\tбезударное личное окончание глагола, I спр.\nвишнёвых\tбезударная гласная в корне (проверочное — вишня)\nтростник\tнепроизносимая согласная (проверочное — трость)\nтрепещет\tбезударное личное окончание глагола, I спр.\nзвенит\tчередующаяся гласная в корне (-звен-/-звон-)\nблещет\tбезударное личное окончание глагола, I спр.\nстоит\tбезударная гласная в корне (проверочное — стоя)\nтает\tбезударное личное окончание глагола, I спр.\nвосходит\tбезударное личное окончание глагола, II спр.\nрасцветает\tприставка на з/с (рас- перед глухим ц); безударное окончание глагола, I спр.\nзовут\tбезударная гласная в корне (проверочное — зов)\nпенится\tбезударное личное окончание глагола, II спр.; -тся (что делает?)\nплещет\tбезударное личное окончание глагола, I спр.\nдеревья\tразделительный ь перед я\nпрозрачной\tсочетание чн пишется без ь\n\nСинтаксический разбор четвёртого предложения⁴:\n\n    Не пенится море, не плещет волна, деревья листами не двинут, на глади прозрачной царит тишина.\n\nХарактеристика: Повествовательное, невосклицательное, сложное (4 грамматические основы), бессоюзное .\n\nГрамматические основы:\n\n    море не пенится\n\n    волна не плещет\n\n    деревья не двинут\n\n    тишина царит\n\nСхема: [— =], [— =], [— =], [= —] .","46":"Лексическое значение выделенных глаголов\n\nПожелтели — стали жёлтыми (прямое значение).\nСеребрит — придаёт серебряный цвет, покрывает серебристым светом (прямое значение, но с оттенком метафоры) .\nСписанный текст с вставленными буквами\n\nЛистья в поле пожелтели,\nИ кружатся, и летят;\nЛишь в бору, поникши, ели\nЗелень мрачную хранят.\nПод нависшею скалою\nУж не любит меж цветов\nПахарь отдыхать порою\nОт полуденных трудов.\nЗверь отважный поневоле\nСкрыться где-нибудь спешит.\nНочью месяц тускл и поле\nСквозь туман лишь серебрит.\nТропы (лексические средства выразительности)\n\n    Эпитеты: мрачную (зелень), нависшею (скалою), полуденных (трудов), отважный (зверь), тускл (месяц) .\n\n    Олицетворения: ели хранят (зелень), месяц серебрит (поле) .\n\nПереходные и непереходные глаголы\nГлагол\tПереходность\nпожелтели\tн. (непереходный)\nкружатся\tн. (непереходный)\nлетят\tн. (непереходный)\nхранят\tп. (переходный, хранят что? — зелень)\nне любит\tп. (переходный, не любит что? — отдыхать)\nотдыхать\tн. (непереходный)\nскрыться\tн. (непереходный)\nспешит\tн. (непереходный)\nсеребрит\tп. (переходный, серебрит что? — поле)\nВиды орфограмм\nОрфограмма\tПримеры\n-тся / -ться в глаголах\tкружатся (что делают?), скрыться (что сделать?)\nСочетание чн без ь\tмрачную\nПроверяемая безударная гласная в корне\tхранят (хра́на), скалою (ска́лы)\nРаздельное написание не с глаголами\tне любит\nБезударные личные окончания глаголов\tлюбит (II спр.)\nН/НН в прилагательных\tполуденных (суффикс -енн-)\nДефис в наречиях с постфиксами -то, -либо, -нибудь\tгде-нибудь\nФонетический разбор\n\nНочью¹ [но́ч'й'у] — 2 слога.\n\n    н [н] — согласный, звонкий непарный (сонорный), твёрдый парный;\n\n    о [о́] — гласный, ударный;\n\n    ч [ч'] — согласный, глухой непарный, мягкий непарный;\n\n    ь — не обозначает звука;\n\n    ю [й'] — согласный, звонкий непарный (сонорный), мягкий непарный;\n\n    [у] — гласный, безударный.\n\n5 букв, 5 звуков .\nМорфологический разбор\n\nОтдыхать³\n\n    Отдыхать — глагол (обозначает действие, отвечает на вопрос что делать?).\n\n    Н. ф. — отдыхать.\n\n    Пост. признаки: несовершенный вид, непереходный, невозвратный, I спряжение.\n\n    Непост. признаки: инфинитив (неопределённая форма).\n\n    Синтаксическая роль: часть составного глагольного сказуемого (не любит отдыхать) .\n\nСинтаксический разбор\n\n    Ночью месяц тускл и поле сквозь туман лишь серебрит.⁴\n\nХарактеристика: Повествовательное, невосклицательное, сложное (две грамматические основы), союзное (союз и), сложносочинённое.\n\nГрамматические основы:\n\n    месяц тускл (составное именное сказуемое с нулевой связкой);\n\n    поле серебрит.\n\nСхема: [— =], и [— =].","47":"Ответ к заданию\n\n1. Функциональная разновидность языка:\nТекст относится к научному стилю (научно-учебному подстилю).\n\n2. Вопросный план:\n\n    От скольких основ образуются глагольные формы?\n    Как получить основу неопределённой формы (инфинитива)?\n    Как выделить основу настоящего (или простого будущего) времени?\n\nОбъяснение\n\n    Определение стиля речи:\n    Данный фрагмент содержит научное сообщение и лингвистические термины (формы глагола, основа, неопределённая форма, настоящее время, 3-е лицо множественного числа), мысль изложена точно, логично и беспристрастно. Это признаки научного стиля речи (в частности, учебно-научного, так как текст взят из школьного правила).\n\n    Составление вопросного плана:\n    Вопросный план предполагает, что каждый пункт формулируется в виде вопроса к микротеме (смысловой части) текста:\n        Первое предложение рассказывает о том, что глаголы образуются от двух разных основ.\n        (Вопрос: От скольких основ образуются формы глагола?)\n        Второе предложение объясняет способ выделения основы инфинитива.\n        (Вопрос: Как получить основу неопределённой формы?)\n        Третье предложение объясняет способ выделения основы настоящего времени.\n        (Вопрос: Как выделить основу настоящего времени?)\n","48":"Итоговый ответ\n\n1. Заглавие текста:\n«Древнерусское искусство» (вариант: «Искусство Древней Руси IX—XIII веков»).\n\n2. Объекты древнерусского искусства, отмеченные автором:\n\n    Архитектурные сооружения: храмы, монастыри, дворцы.\n    Изобразительное искусство: иконопись (иконы), мозаика, фрески.\n    Декоративно-прикладное искусство: предметы быта, оружие, украшения, декоративные изделия.\n\n3. Сложный план текста:\nI. Формирование искусства Руси в доордынский период.\n\n    Влияние Византии и Крещение Руси.\n    Строительство первых храмов и монастырей.\n    II. Самобытность и многообразие древнерусского искусства.\n    Сочетание византийских традиций и славянских мотивов в иконописи и предметах быта.\n    Виды искусства: архитектура, живопись и декоративные изделия.\n    Древнерусские города — хранители шедевров.\n    III. Жизнеутверждающий характер и основные идеи искусства Древней Руси.\n\n4. Функциональная разновидность языка:\nТекст относится к научно-популярному стилю (разновидность научного стиля с элементами публицистики).\n\n5. Схема последнего предложения:\n\n    «В целом все образцы древнерусского искусства проникнуты светлым чувством оптимизма, содержат жизнеутверждающее начало, говорят о глубокой религиозности русского народа и его любви к природе».\n\nСхема с однородными сказуемыми:\nОбъяснение и комментарии к решению\n\n    Определение темы и заглавия: Текст рассказывает об истории зарождения, видах и особенностях искусства Руси IX—XIII веков, поэтому заглавие должно отражать эту общую тему.\n    Анализ стиля (функциональной разновидности): В тексте излагаются исторические факты, используются искусствоведческие термины (иконопись, мозаика, фрески, доордынский период), однако язык понятен широкому кругу читателей и несёт эмоционально-оценочные элементы («светлым чувством оптимизма», «замечательные произведения»), что указывает на научно-популярный подстиль.\n    Синтаксический разбор последнего предложения:\n        Предложение простое, повествовательное, невосклицательное, двусоставное, распространённое, осложнено рядом однородных сказуемых.\n        Грамматическая основа: подлежащее — образцы (выражено существительным), сказуемые — проникнуты (краткое причастие), содержат (глагол), говорят (глагол).\n        Между однородными сказуемыми без союзов ставятся запятые.\n","49":"Задание\n\nРабота в группах. Подготовьте сообщение о каком-либо произведении древнерусского искусства (архитектурном сооружении, иконе, предмете быта). Сделайте вывод о том, какие общие черты произведений древнерусского искусства можно выявить на примере рассмотренных вами объектов. Обсудите в группах, как ваши одноклассники справились с заданием, что лучше всего удалось, каковы были недоработки. Оцените результаты деятельности друг друга.\nПример сообщения (икона «Богоматерь Владимирская»)\n\nИскусство Древней Руси разнообразно. Одно из выдающихся произведений древнерусского искусства — икона «Богоматерь Владимирская». Она написана в XII веке и является одной из самых почитаемых чудотворных икон на Руси. На иконе изображена Святая Дева Мария, обнявшая младенца Иисуса, который смотрит на неё с нежностью и любовью.\n\nИзначально икона была привезена из Византии в Киев, но Андрей Боголюбский перевез её во Владимир (откуда и пошло название), украсил богатым убором и возил с собой в военные походы. Тяжела была судьба иконы после смерти Андрея Боголюбского: она попадала из одних рук в другие, лишилась дорогого оклада. Только в 1480 году она оказалась в Москве, где находится и доныне.\n\nИстория иконы связана с легендой о том, как она защищала Владимир и Москву от врагов. Её образ стал символом надежды, милосердия и заступничества. С ней связаны судьбы многих русских царей.\n\n«Богоматерь Владимирская» — важный памятник культуры и искусства, который продолжает восхищать людей своей красотой.\nОбщие черты произведений древнерусского искусства\n\n    Религиозное содержание — большинство произведений создавалось для церкви и отражает христианские идеи.\n\n    Следование канону — художники и зодчие следовали установленным образцам, не стремились к самовыражению.\n\n    Символичность — каждый элемент имел глубокий смысл, понятный верующим.\n\n    Связь с историей — многие произведения связаны с важными событиями в жизни Руси.\n\n    Коллективность творчества — часто авторство не указано, работа велась артелями мастеров.\n\nОбсуждение в группе\n\nПри обсуждении можно оценить:\n\n    Что удалось — полнота раскрытия темы, выразительность сообщения, использование наглядности.\n\n    Недоработки — недостаточная аргументация, слабая связь с общими чертами древнерусского искусства.\n\n    Оценка результатов — насколько каждый участник внёс вклад в общее дело.","50":"Ответ\n\nГлаголы несовершенного вида (что делать?):\nГлагол\t3-е лицо, мн. ч., наст. вр.\tОснова\nгореть\tгорят\tгор-\nсчитать\tсчитают\tсчита-\nрассчитывать\tрассчитывают\tрассчитыва-\nзамирать\tзамирают\tзамира-\nприкасаться\tприкасаются\tприкаса-\nблистать\tблистают\tблиста-\nпредлагать\tпредлагают\tпредлага-\nразжигать\tразжигают\tразжига-\n\nГлаголы совершенного вида (что сделать?):\nГлагол\tОснова неопределённой формы\nзамереть\tзамере-\nпоклониться\tпоклони-\nвырасти\tвырас-\nпредложить\tпредложи-\nсоприкоснуться\tсоприкосну-\nопереться\tопере-\nизложить\tизложи-\nпримирить\tпримири-\nприме́рить\tпримере-\nвзрастить\tвзрасти-\nПроверочные слова для вставленных орфограмм\n\n    Горе́ть, поклони́ться — без ударения пишется о (чередование -гар-/-гор-, -клон-/-клан-)\n\n    Счита́ть, рассчи́тывать, замира́ть, прикаса́ться, блиста́ть, предлага́ть, разжига́ть — наличие суффикса -а- после корня\n\n    Замере́ть, соприкосну́ться, опере́ться — отсутствие суффикса -а-\n\n    Вы́расти — наличие ст в корне\n\n    Примири́ть — проверочное мир; приме́рить — проверочное ме́рка \n\n","51":"Упражнение 51 (новое издание, 2022–2026, стр. 28)\n\nЗадание: Спишите, оставляя в скобках инфинитив соответствующего вида; укажите вид и спряжение глаголов.\n\nОбразец: Брос..т (бросить, бросать) — сов. в., II спр. — бросит (бросить).\n\nВыполнение:\n\n    Разыщем (разыскивать, разыскать) — сов. в., II спр. — разыскать.\n\n    Включаем (включить, включать) — несов. в., I спр. — включать.\n\n    Гонишь (гнать, гонять) — несов. в., II спр. — гнать.\n\n    Распишешь (расписывать, расписать) — сов. в., I спр. — расписать.\n\n    Украсим (украшать, украсить) — сов. в., II спр. — украсить.\n\n    Исправляем (исправить, исправлять) — несов. в., I спр. — исправлять.\n\n    Выметем (выметать, вымести) — сов. в., I спр. — вымести.\n\n    Вытрешь (вытирать, вытереть) — сов. в., I спр. — вытереть.\n\n    Рассыплешь (рассыпа́ть, рассы́пать) — сов. в., I спр. — рассы́пать.\n\nОбъяснение выбора спряжения:\n\n    Разыскать, расписать, вымести, вытереть, рассы́пать — глаголы I спряжения (не на -ить, кроме исключений).\n\n    Разыскать, украсить, вымести, вытереть, рассы́пать — совершенный вид (что сделать?).\n\n    Включать, гнать, исправлять — несовершенный вид (что делать?).\n\n    Гнать — глагол-исключение II спряжения (хотя не на -ить).","52":"Ответ\n\nЗаписанные пары глаголов в форме 1-го лица множественного числа (мы):\n\n    Вы́пустим, выпуска́ем;\n    вы́стрижем, выстрига́ем;\n    дове́рим, доверя́ем;\n    вы́печем, выпека́ем;\n    вы́ступим, выступа́ем;\n    зале́зем, залеза́ем;\n    вы́растем, вы́растим;\n    распу́стим, распуска́ем;\n    сложим, слагаем;\n    сотрём (в инфинитиве стереть), стираем;\n    озарим, озаряем;\n    загорим, загораем.\n\n(Корни с чередованием гласных выделены полужирным шрифтом).\nОбъяснение\n1. Как образуется форма 1-го лица множественного числа\n\nФорма 1-го лица множественного числа отвечает на вопрос «что сделаем?» (для совершенного вида) или «что делаем?» (для несовершенного вида) и имеет личные окончания:\n\n    -ем / -ём — у глаголов I спряжения (выстригать выстрига́ем, залезть зале́зем, стереть сотрём);\n    -им — у глаголов II спряжения (выпустить вы́пустим, доверить дове́рим, сложить сло́жим).\n\n2. Корни с чередованием гласных и правила их написания\n\n    -раст- / -ращ- / -рос- (вырастем, вырастим): перед ст и щ пишется буква а, перед с — буква о (исключения: росток, отрасль, Ростов и др.).\n    -лаг- / -лож- (сложим, слагаем): перед г пишется а, перед ж — о (также выбор гласной зависит от суффикса -а-).\n    -тер- / -тир- (стереть / сотрём, стираем): пишется буква и, если после корня стоит суффикс -а-; если суффикса нет — пишется е (или гласная выпадает).\n    -зар- / -зор- (озарим, озаряем): в безударном положении пишется буква а, под ударением — то, что слышится (зо́ри, заре́во).\n    -гор- / -гар- (загорим, загораем): в безударном положении пишется буква о, под ударением — а (зага́р).\n\n","53":"Ответ к упражнению 53\n1. Характеристика текста\n\n    Функциональная разновидность языка (стиль речи): художественный стиль.\n    Функционально-смысловой тип речи: описание (пейзажное, динамическое описание состояния природы).\n\n2. Языковые средства художественного стиля в тексте\n\n    Эпитеты: прозрачен, словно стеклянный; мягкий пар; алый блеск; жидкого золота; длинные тени; в огнистом море.\n    Метафоры: заря запылала пожаром; потоками жидкого золота; в огнистом море заката; воздух наливается мглою.\n    Сравнение: словно стеклянный.\n    Олицетворения: побежали тени; звезда дрожит.\n\n3. Списанный текст с раскрытыми скобками и знаками препинания\n\n    Но вот наступает вечер. Заря запылала пожаром и обхватила полнеба. Солнце садится. Воздух вблизи как**-то особенно прозрачен, словно стеклянный; вдали ложится** мягкий пар, тёплый на вид; вместе с росой падает алый блеск на поляны, ещё недавно облитые потоками жидкого золота; от деревьев**,** от кустов**,** от высоких стогов сена побежали длинные тени... Солнце село; звезда зажглась и дрожит в огнистом море заката... Вот оно бледнеет; синеет небо; отдельные тени исчезают**,** воздух наливается мглою.\n\n4. Разбор по составу выделенных слов\n\n    Запыла́ла:\n        приставка: за-\n        корень: -пыл-\n        суффиксы: -а-, -л- (формообразующий суффикс прошедшего времени)\n        окончание: -а\n        основа слова: запыла-\n\n    Побежа́ли:\n        приставка: по-\n        корень: -беж-\n        суффиксы: -а-, -л-\n        окончание: -и\n        основа слова: побежа-\n\n    Зажгла́сь:\n        приставка: за-\n        корень: -жг-\n        суффикс: -л-\n        окончание: нулевое\n        постфикс: -сь\n        основа слова: зажг...сь\n\n    Бледне́ет:\n        корень: -бледн-\n        суффикс: -е-\n        окончание: -ет\n        основа слова: бледне-\n\n    Сине́ет:\n        корень: -син-\n        суффикс: -е-\n        окончание: -ет\n        основа слова: сине-\n\n    Налива́ется:\n        приставка: на-\n        корень: -ли-\n        суффикс: -ва-\n        окончание: -ет\n        постфикс: -ся\n        основа слова: налива...ся\n\n5. Морфологический разбор слов с цифрой ³ (из текста задания)\n\n    Ложится³ — глагол.\n        Начальная форма: ложиться.\n        Постоянные признаки: II спряжение, несовершенный вид, непереходный, возвратный.\n        Непостоянные признаки: изъявительное наклонение, настоящее время, единственное число, 3-е лицо.\n        Синтаксическая роль: сказуемое (ложится).\n\n    Село³ — глагол.\n        Начальная форма: сесть.\n        Постоянные признаки: I спряжение, совершенный вид, непереходный, невозвратный.\n        Непостоянные признаки: изъявительное наклонение, прошедшее время, единственное число, средний род.\n        Синтаксическая роль: сказуемое (село).\n\nОбъяснение орфограмм и пунктограмм\n\n    Заря́ — чередующийся корень -зар-/-зор-. В безударном положении пишется буква а.\n    Обхвати́ла — безударная проверяемая гласная в корне: обхва́т.\n    Полнеба — приставка пол- пишется слитно, так как корень начинается с согласной буквы (кроме л).\n    Садится, ложится, наливается — правописание -тся без мягкого знака, так как глаголы отвечают на вопрос что делает? (форма 3-го лица).\n    Как-то — суффикс -то пишется через дефис.\n    Стеклянный — исключение из правила правописания суффикса -ян- (деревянный, оловянный, стеклянный).\n    Вдали́ — безударная проверяемая гласная в корне: даль.\n    Па́дает, бледне́ет, сине́ет — глаголы I спряжения (падать, бледнеть, синеть), в окончаниях 3-го лица ед. ч. пишется буква е (-ет).\n    Длинные — удвоенная н на стыке корня на -н- (длин-) и суффикса -н-.\n    В огнистом — безударное окончание прилагательного: в море (каком?) огнистом.\n    Запятые при однородных членах: «от деревьев, от кустов, от высоких стогов...» — однородные обстоятельства разделяются запятыми.\n    Запятая в бессоюзном сложном предложении: «...тени исчезают, воздух наливается...» — разделяет две грамматические основы.\n","54":"Итоговый ответ\nТаблица «Буква Ь на конце глаголов после шипящих»\nВид орфограммы (грамматическая форма) \tПравило \tПримеры\n1. Неопределённая форма глагола (инфинитив) \tМягкий знак пишется на конце инфинитива после буквы ч (в том числе перед суффиксом -ся). \tБеречь, стеречь, увлечься, зажечь, подстричь.\n2. Форма 2-го лица единственного числа (настоящего и будущего времени) \tМягкий знак пишется на конце окончания после буквы ш (в том числе перед суффиксом -ся). \tПишешь, читаешь, думаешь, смеёшься, научишь.\n3. Форма повелительного наклонения \tМягкий знак пишется после шипящих в единственном числе и сохраняется перед -те, -ся. \tОтрежь, отрежьте, спрячь, спрячься, намажь.\nОбъяснение\n\nВ русском языке после шипящих (ж, ш, ч, щ) в глагольных формах всегда пишется мягкий знак (Ь).\n\nВыделяют три основные формы глаголов с этой орфограммой:\n\n    Инфинитив (начальная форма): отвечает на вопросы что делать? что сделать? Буква ь пишется на конце после ч (сохраняется и перед возвратным суффиксом -ся): печь — печься.\n    2-е лицо единственного числа: формы, к которым можно подставить местоимение ты (ты делаешь, ты поможешь). Окончания -ешь, -ишь, -ёшь всегда пишутся с ь на конце (сохраняется и перед -ся): учишь — учишься.\n    Повелительное наклонение: выражает просьбу или приказ (что делай? что сделайте?). Мягкий знак пишется на конце слова после шипящих (режь, спрячь) и сохраняется перед суффиксами -ся (спрячься) и окончанием множественного числа -те (режьте).\n","55":"Итоговый ответ\n1. Выписанные слова с объяснением орфограмм\n\n1) Гласные е и и в личных окончаниях глаголов:\n\n    Бре́зжит — глагол II спряжения (глагол-исключение, инфинитив — брезжить), 3-е лицо, ед. ч. окончание -ит.\n    Румя́нит — глагол II спряжения (инфинитив на -ить — румянить), 3-е лицо, ед. ч. окончание -ит.\n    Тума́нится — глагол II спряжения (инфинитив на -ить — туманиться), 3-е лицо, ед. ч. окончание -ит (+ постфикс -ся).\n    Сви́щет — глагол I спряжения (инфинитив на -ать — свистать), 3-е лицо, ед. ч. окончание -ет.\n    Пря́чется — глагол I спряжения (инфинитив на -ать — прятаться), 3-е лицо, ед. ч. окончание -ет (+ постфикс -ся).\n    Дре́млет — глагол I спряжения (инфинитив на -ать — дремать), 3-е лицо, ед. ч. окончание -ет.\n\n2) Остальные орфограммы:\n\n    На заводи — раздельное написание предлога с существительным (между предлогом и словом можно вставить вопрос или определение: на (тихой) заводи); в окончании существительного 3-го склонения в предложном падеже (на чём?) пишется буква -и.\n    Речны́е — буквосочетание чн пишется без мягкого знака (ь).\n    Заря́ — безударная гласная в корне с чередованием зар- / зор- (без ударения пишется буква а).\n    Под крутым — раздельное написание предлога с прилагательным (под самым крутым).\n\n2. Предложения с однородными членами\n\n    Предложение 1: «Брезжит свет на заводи речные и румянит сетку небосклона».\n    (Однородные сказуемые: брезжит и румянит, соединены одиночным союзом и).\n    Предложение 3: «Свищет ветер под крутым забором, прячется в траву».\n    (Однородные сказуемые: свищет, прячется, соединены интонационно, разделяются запятой).\n\n3. Однокоренные слова к выделенному слову (заводи)\n\n    За́водь (исходная форма), за́водный, заводи́нка, заводю́шка, заводи́стый.\n\n(Если в вашем издании выделено слово «румянит»: румя́ный, румя́нец, подрумя́нить, румя́на).\nОбъяснение правил\n\n    Безударные личные окончания глаголов:\n    Спряжение определяется по неопределённой форме (инфинитиву):\n        Ко II спряжению относятся все глаголы на -ить (кроме брить, стелить, зиждиться, зыбиться), 11 глаголов-исключений (на -еть, -ать), а также глагол брезжить. В их личных окончаниях пишутся буквы и, а/я (-ит, -ат/-ят).\n        К I спряжению относятся остальные глаголы (на -ать, -еть, -оть, -уть, -ть). В их окончаниях пишутся буквы е, у/ю (-ет, -ут/-ют).\n\n    Чередование в корне зар- / зор-:\n    В этом корне под ударением пишется то, что слышится (зо́ри, заре́во), а в безударном положении — всегда буква а (заря́, зарни́ца).\n\n    Правописание предлогов:\n    Предлоги со словами пишутся раздельно. Проверить можно постановкой вопроса или другого слова: под (каким?) забором, на (речной) заводи.\n\n","56":"Ответ к заданию\n1. Жизненные ситуации для применения пословиц в качестве аргумента\n\n    «Правдой мир держится» — в споре о важности честности; когда кто-то пытается схитрить или солгать ради сиюминутной выгоды (аргумент: ложь всё разрушает, а на доверии и правде строятся отношения).\n    «Без ветра и трава не колышется» — когда обсуждают причины какого-либо происшествия, новости или слуха (аргумент: у любого события или следствия всегда есть реальная причина).\n    «Мягко стелет, да жёстко спать» — когда предостерегают от общения с льстивым, лицемерным человеком, чьи речи кажутся приятными, но намерения корыстны.\n    «Где строят, там и роют» — когда оправдывают неизбежные трудности, беспорядок или шум при масштабном созидательном деле (аргумент: большие изменения требуют подготовительной и тяжёлой работы).\n    «Сердце видит раньше глаз» — когда объясняют интуитивное предчувствие опасности, радости или истинного отношения человека ещё до появления явных фактов.\n    «Доброе дело само себя хвалит» — когда призывают не хвастаться своими хорошими поступками (аргумент: достойные дела говорят сами за себя и заметны без лишних слов).\n    «За ветром в поле не угонишься» — когда убеждают перестать жалеть об упущенном времени, возможности или пытаться угнаться за недостижимым.\n    «Пустая мельница без ветра мелет» — при оценке человека, который говорит попусту, распускает сплетни или спорит без реального повода.\n\n2. В чём заключается выразительная сила пословиц?\n\nВыразительная сила пословиц заключается в их:\n\n    краткости и ёмкости (в одном небольшом предложении заключён глубокий жизненный опыт поколений);\n    образной метафоричности (сложные явления объясняются через понятные бытовые и природные образы);\n    ритмичности и антитезе (часто используется противопоставление: мягко — жёстко, правда — ложь, что делает фразу запоминающейся).\n\n3. Правописание безударных личных окончаний глаголов\n\n    Держится — от глагола держаться (на -ать, глагол-исключение II спряжения), 3-е л., ед. ч. окончание -ит.\n    Колышется — от глагола колыхаться (на -ать, I спряжение), 3-е л., ед. ч. окончание -ет.\n    Стелет — от глагола стелить (глагол-исключение I спряжения), 3-е л., ед. ч. окончание -ет. (Глагол «спать» имеет ударное окончание: спи́т).\n    Строят — от глагола строить (на -ить, II спряжение), 3-е л., мн. ч. окончание -ят.\n    Роют — от глагола рыть (на -ыть, I спряжение), 3-е л., мн. ч. окончание -ют.\n    Видит — от глагола видеть (на -еть, глагол-исключение II спряжения), 3-е л., ед. ч. окончание -ит.\n    Хвалит — от глагола хвалить (на -ить, II спряжение), 3-е л., ед. ч. окончание -ит.\n    (Не) угонишься — от глагола угнаться (приставочный от гнать, на -ать, глагол-исключение II спряжения), 2-е л., ед. ч. окончание -ишь.\n    Мелет — от глагола молоть (на -оть, I спряжение), 3-е л., ед. ч. окончание -ет.\n\nПамятка по правилу\n\nЧтобы правильно написать безударное личное окончание глагола:\n\n    Поставьте глагол в неопределённую форму (инфинитив): что делать? что сделать?\n    Определите спряжение:\n        Ко II спряжению относятся все глаголы на -ить (кроме брить, стелить, зиждиться, зыбиться), а также 11 глаголов-исключений: 4 на -ать (гнать, дышать, держать, обидеть — с производными) и 7 на -еть (видеть, слышать, смотреть, зависеть, ненавидеть, терпеть, вертеть).\n        Личные окончания II спряжения: -ишь, -ит, -им, -ите, -ат / -ят.\n        К I спряжению относятся все остальные глаголы (на -ать, -еть, -оть, -уть, -ыть, -ти и др.) + исключения брить, стелить.\n        Личные окончания I спряжения: -ешь, -ет, -ем, -ете, -ут / -ют.\n","57":"Письмо другу «Впечатления от Летнего сада»\n\nЗдравствуй, Максим!\n\nНедавно на уроке русского языка мы рассматривали репродукцию картины Алексея Грицая «Летний сад» и современную фотографию этого знаменитого парка в Санкт-Петербурге. Мне так захотелось поделиться с тобой своими мыслями и впечатлениями!\n\nТы знаешь, что Летний сад — один из самых старых парков Петербурга? Его заложили по указу Петра I ещё в 1704 году как царскую летнюю резиденцию. Именно поэтому сад назвали «Летним»: изначально в нём высаживали преимущественно однолетние цветы («летники»), а царская семья проводила там тёплое время года. Сад украсили мраморными скульптурами, фонтанами и строгими аллеями. Летний сад часто упоминается в русской классической литературе. Например, А. С. Пушкин в романе «Евгений Онегин» писал, что гувернёр главного героя «…в Летний сад гулять водил», а Анна Ахматова посвятила этому удивительному месту трогательное стихотворение: «Я к лопухам склоняюсь в тишине…».\n\nЯ ещё ни разу не был в Санкт-Петербурге, но после знакомства с этими иллюстрациями очень мечтаю побывать в Летнем саду и пройтись по его тенистым дорожкам.\n\nМне было очень интересно сравнить картину А. Грицая и современную фотографию. Разница между ними огромная! Художник на своей картине передал поэтичное, задумчивое настроение сада ранней весной или поздней осенью. На полотне преобладают нежные, размытые пастельные тона, ветви деревьев кажутся почти прозрачными, а мраморные статуи в деревянных футлярах словно дремлют в тишине. Фотография же показывает Летний сад в ясный, солнечный день: она яркая, чёткая, детализированная. На фото мы отчётливо видим знаменитую узорчатую решётку, зелёные кроны деревьев и строгую геометрию аллей. Картина передаёт чувства и настроение автора, а фотография — реальную, современную красоту этого места.\n\nБывал ли ты когда-нибудь в Летнем саду? Обязательно напиши, какие места в Петербурге тебе нравятся больше всего!\n\nДо скорой встречи!\nТвой друг Артём.\n15 октября 2023 г.\nПамятка и разбор структуры письма\n\nСочинение-письмо составлено строго по всем требованиям задания:\n\n    Композиция письма:\n        Начало: вежливое обращение и приветствие («Здравствуй, Максим!»).\n        Основная часть: впечатления, историческая и литературная справка, сравнение картины и фотографии, личный опыт.\n        Концовка: вопросы к адресату, формула прощания («До скорой встречи!»), подпись автора и дата.\n\n    Обязательные содержательные элементы:\n        История и название: основан Петром I в 1704 году; назван так из-за летней резиденции и высадки однолетних цветов («летников»).\n        Упоминание в литературе: А. С. Пушкин («Евгений Онегин»), А. А. Ахматова.\n        Личный опыт: указано отношение (желание посетить или воспоминания о визите).\n        Сравнение репродукции и фото: сопоставлены художественное восприятие (картина: настроение, мягкие цвета, обобщённость) и документальная точность (фотография: реалистичность, чёткость деталей, яркое освещение).\n","58":"Ответ к упражнению 58\n1. Заглавие текста\n\n«Древнерусские летописи» (вариант: «Летописное наследие Древней Руси»).\n2. Вид чтения\n\nПри работе с текстом использовалось изучающее (углублённое) чтение, так как требовалось не только понять общий смысл, но и запомнить подробности, составить план и выполнить грамматический разбор.\n3. Что нового узнали?\n\nИз текста мы узнали, что:\n\n    вся литература Древней Руси была рукописной;\n    первую редакцию «Повести временных лет» составил монах Нестор около 1113 года в Киеве;\n    Лаврентьевская летопись была переписана монахом Лаврентием и его помощниками всего за два месяца в 1377 году;\n    в состав Лаврентьевской летописи входит «Поучение Владимира Мономаха».\n\n4. Функциональная разновидность языка\n\nТекст относится к научному стилю (его разновидности — научно-популярному / учебно-научному подстилю).\n5. Сложный план текста\n\nI. Рукописная литература и труд летописцев на Руси.\nII. «Повесть временных лет» — древнейшая русская летопись:\n\n    Создание первой редакции монахом Нестором в 1113 году.\n    Источники летописца (предания, песни, рассказы, документы).\n    Художественная и историческая ценность произведения.\n    III. Лаврентьевская летопись:\n    Быстрота создания летописи в 1377 году монахом Лаврентием.\n    Включение «Поучения Владимира Мономаха» в состав свода.\n\n6. Вид создаваемого монолога\n\nПри пересказе по плану создаётся монолог-сообщение (учебно-научный монолог) с элементами повествования.\n7. Выписанные числительные с существительными\n\n    (Её) перв[ую] (порядковое) редакцию — Винительный падеж (В. п.);\n    (около) тысяча сто тринадцат[ого] / 1113 (порядковое) года — Родительный падеж (Р. п.);\n    (до) шестнадцат[ого] / XVI (порядковое) века — Родительный падеж (Р. п.);\n    (в) тысяча триста семьдесят седьм[ом] / 1377 (порядковое) году — Предложный падеж (П. п.);\n    дв[а] (количественное) месяца — Винительный падеж (В. п.);\n    двенадцат[ого] / XII (порядковое) века — Родительный падеж (Р. п.).\n\n(Окончания в словах выделены квадратными скобками: [ ]).\nОбъяснение\n\n    Сложный план включает в себя главные пункты, обозначенные римскими цифрами, и подпункты (арабские цифры), которые раскрывают содержание каждой части текста.\n    Определение падежей числительных:\n        В составных порядковых числительных (тысяча сто тринадцатого, тысяча триста семьдесят седьмом) склоняется и имеет падежное окончание только последнее слово: около (какого?) года — Р. п., окончание -ого; в (каком?) году — П. п., окончание -ом.\n        Числительные, записанные римскими цифрами (XVI века, XII века), читаются как порядковые (шестнадцатого, двенадцатого) и согласуются со словами века в родительном падеже.\n        Сочетание два месяца выступает в предложении обстоятельством времени («написана за сколько? за два месяца») и стоит в форме винительного падежа.\n\n","59":"Итоговый ответ\nМысли Владимира Мономаха, которые звучат современно:\n\n    Непрерывное саморазвитие и учеба: «Что умеете хорошего, то не забывайте, а чего не умеете, тому учитесь».\n    Борьба с ленью и важность труда: лень — мать всему дурному.\n    Уважительное и доброе отношение к людям: «Не пропустите человека, не поприветствовав его, и доброе слово ему молвите», а также уважение к старшим и забота о младших.\n    Милосердие и защита слабых: помогать нуждающимся, не допускать несправедливости.\n    Честность и контроль за своими поступками: остерегаться лжи, беречь доброе имя.\n\nПример монолога-рассуждения\n\n    «Поучение» Владимира Мономаха было написано много веков назад, однако многие мысли древнерусского князя звучат удивительно современно и сегодня.\n\n    Во-первых, князь призывал никогда не лениться и постоянно учиться новому. Он говорил: «Что умеете хорошего, то не забывайте, а чего не умеете, тому учитесь». В наш век информационных технологий этот совет актуален как никогда: чтобы быть успешным человеком, необходимо непрерывно развиваться, читать книги и приобретать полезные навыки. Сам Мономах приводил в пример своего отца, который, сидя дома, выучил пять языков.\n\n    Во-вторых, Мономах оставил нам важнейшие правила общения и человечности. Он учил уважать старших, защищать слабых, быть гостеприимным и говорить добрые слова каждому встречному: «Не пропустите человека, не поприветствовав его». Сегодня, когда люди часто погружены в гаджеты и забывают о простом вежливом общении, эти слова напоминают о ценности искренней доброты, честности и взаимовыручки.\n\n    Таким образом, наставления Владимира Мономаха — это не просто исторический памятник, а вечный нравственный ориентир. Они учат нас быть трудолюбивыми, честными и внимательными к окружающим.\n\nОбъяснение и структура монолога-рассуждения\n\nМонолог-рассуждение строится по классической трехчастной схеме:\n\n    Вступление (Тезис): формулируется главная мысль о том, что советы князя из «Поучения» не устарели и важны для современного человека.\n    Основная часть (Доказательства и аргументы):\n        Приводятся 2–3 конкретные мысли Мономаха с краткими цитатами или пересказом (об учёбе, о труде, о вежливости и доброте).\n        Даётся пояснение, почему эти мысли актуальны в XXI веке.\n    Заключение (Вывод): подведение итогов (правила Мономаха — это общечеловеческие нравственные ценности, актуальные во все времена).\n\nСовет для устного ответа: говорите выразительно, делайте логические паузы между частями рассуждения и используйте вводные слова (во-первых, во-вторых, таким образом, я считаю), чтобы речь звучала связно и убедительно.","60":"Пример монолога-описания животного\n\nТема: Величие и красота снежного барса (ирбиса)\n\n    Среди всех обитателей нашей планеты меня больше всего восхищает снежный барс, или ирбис. Это настоящее воплощение грации, силы и суровой красоты дикой природы.\n\n    Снежный барс обитает высоко в заснеженных горах. Природа подарила ему великолепный наряд, идеально подходящий для жизни среди скал и льдов. Его шерсть — густая, пушистая и невероятно мягкая. Она имеет дымчато-серый, почти серебристый оттенок с красивыми темными пятнами-розетками, которые создают неповторимый узор.\n\n    Особенно поражает взгляд ирбиса. Его большие глаза цвета дымчатого янтаря смотрят спокойно, внимательно и гордо. Широкие лапы животного снабжены мягкими подушечками, благодаря которым этот крупный хищник может неслышно ступать даже по рыхлому снегу и скользким камням. Но главное украшение барса — его длинный, роскошный хвост. Он составляет почти три четверти длины тела. С помощью этого хвоста барс удерживает равновесие, совершая невероятные прыжки над глубокими горными пропастями, а в морозные ночи укутывает им морду, словно теплым шарфом.\n\n    Повадки снежного барса полны скрытого достоинства. Он движется легко, бесшумно и плавно, напоминая ожившую горную тень.\n\n    Ирбис — редкое и загадочное животное, которое невозможно не уважать. Я искренне восхищаюсь его совершенством и надеюсь, что люди сделают всё возможное, чтобы сохранить этого прекрасного властелина заснеженных вершин.\n\nПамятка и объяснение структуры монолога-описания\n\nТип речи текста — описание. Чтобы устное высказывание получилось связным и выразительным, придерживайтесь следующей композиции:\n\n    Вступление (зачин):\n        Назовите животное.\n        Сформулируйте главную мысль (почему именно оно вызывает у вас восхищение).\n    Основная часть (описание признаков):\n        Общий вид и среда обитания (размер, осанка, где живёт).\n        Детали внешности (окрас и фактура шерсти, глаза, форма головы, лапы, хвост).\n        Особенности движений и повадок (походка, прыгучесть, грация, ловкость).\n    Заключение:\n        Обобщающая мысль, итоговая оценка и личное отношение к животному.\n\nСоветы для произнесения:\n\n    Используйте выразительные средства языка: эпитеты (дымчато-серый, серебристый, роскошный), сравнения (словно теплым шарфом, как горная тень).\n    Говорите не торопясь, делайте логические паузы между смысловыми частями и выделяйте голосом самые яркие эпитеты.\n\n","61":"Ответ на задание\n\n    Соблюдена ли этика речевого поведения в полилоге?\n    Да, этика речевого поведения полностью соблюдена. Участники полилога общаются вежливо, доброжелательно, не перебивают друг друга, обращаются к учителю на «Вы» и по имени и отчеству (Дарья Семёновна), а в конце благодарят за советы («Спасибо, Дарья Семёновна...»).\n\n    Какова тема полилога?\n    Тема полилога: «Правила оформления и написания электронных писем» (этикет электронного письма).\n\n    Какие синонимы к слову сказал вы услышали?\n    В тексте использованы следующие глаголы и глагольные сочетания речи (синонимы к слову сказал):\n        спросила / спросил;\n        ответила;\n        задала вопрос;\n        проговорил;\n        подтвердил;\n        произнесла;\n        сообщила;\n        заключил.\n\nОбъяснение\n\n    Полилог — это разговор между несколькими собеседниками (в данном случае учительницы и учеников).\n    Речевой этикет в полилоге выражается в уважительном тоне, умении слушать, корректных формулировках вопросов и ответов, а также в использовании этикетных слов (спасибо, обращение по имени и отчеству).\n    Использование разнообразных глаголов говорения (вместо постоянного повторения слова сказал) обогащает речь, помогает избежать лексических повторов (тавтологии) и точнее передаёт оттенок высказывания: вопрос, подтверждение мысли, краткий вывод или сообщение новой информации.\n","62":"Ответ на задание\n\n    Согласие с советами учительницы:\n    Да, я полностью согласен(-на) с советами учительницы. Электронная почта и мессенджеры требуют соблюдения норм сетевого этикета (сетикета). Грамотное, вежливое и структурированное письмо экономит время адресата и показывает уважение к нему.\n\n    Оформление переписки с учителями по электронной почте:\n    При переписке с учителями я придерживаюсь правил официального общения:\n        Тема письма: обязательно заполняю поле «Тема», кратко указывая суть обращения (например: «Домашнее задание по русскому языку. Иванов Иван, 7 \"А\"»).\n        Приветствие: обращаюсь вежливо по имени и отчеству (например: «Здравствуйте, уважаемая Анна Сергеевна!»).\n        Основная часть: чётко и кратко излагаю вопрос, просьбу или прикрепляю выполненную работу. Если отправляю файл, даю ему понятное название (например: «Сочинение_Иванов_7А.docx»).\n        Заключение и подпись: прощаюсь и указываю свои данные (например: «С уважением, ученик 7 \"А\" класса Иван Иванов»).\n\n    Сообщения, получаемые от учителей:\n    От учителей обычно приходят:\n        комментарии и оценки за проверенные домашние или творческие работы;\n        объявления о расписании, экскурсиях, олимпиадах или родительских собраниях;\n        ссылки на учебные материалы, онлайн-тесты и видеоуроки.\n\n    Тексты, создаваемые в Интернете, и их адресаты:\n        Одноклассникам и друзьям: неформальные текстовые и голосовые сообщения в мессенджерах и социальных сетях (обсуждение совместных планов, игр, домашнего задания).\n        Учителям и администрации школы: официальные письма, рефераты, доклады, презентации, выполненные домашние задания.\n        Участникам тематических сообществ/форумов: комментарии, отзывы, вопросы по интересам (хобби, спорт, книги, программирование).\n\nОбъяснение и памятка по культуре переписки\n\nПри общении в Интернете важно учитывать стиль речи и статус собеседника:\n\n    Официально-деловой / учебно-деловой стиль (с учителями, преподавателями курсов):\n        недопустимо использовать сленг, сокращения слов («спс», «пжлст»), смайлики в большом количестве;\n        обязательно соблюдаются правила пунктуации и орфографии;\n        важна точность и корректность формулировок.\n\n    Разговорный стиль (с друзьями и сверстниками):\n        допускает свободную форму общения, использование эмодзи и разговорных выражений, но требует сохранения взаимного уважения и вежливости.\n\n","63":"Ответ на вопросы к тексту\n\n    Тема полилога:\n    Выбор будущей профессии и планы выпускников на дальнейшую жизнь.\n\n    Что объединяет планы молодых людей:\n    Всех ребят объединяет искренняя увлечённость, стремление найти своё призвание и реализовать свои мечты. Каждый из них думает о будущем и выбирает дело, которое ему по-настоящему интересно или полезно для общества (помощь людям, созидание, научные открытия, новые технологии).\n\n    Убедительные объяснения выбора будущей профессии:\n    Наиболее убедительными кажутся следующие обоснования:\n        План Гены (строитель): у него есть чёткий поэтапный план (поработать с бригадой, набраться опыта, заработать денег и построить дом мечты).\n        Позиция Тани (врач): её выбор продиктован благородной и важной целью — помогать людям и спасать их от болезней.\n        Предложение Дарьи (наладчик роботов/станков с ЧПУ): она ориентируется на современные технологии и прогресс, понимая, какие специальности будут востребованы в будущем.\n        Решение Кирилла (военный): он действует разумно и хочет проверить свои силы на практике в армии, прежде чем окончательно связать жизнь с военной службой.\n\nОбъяснение и комментарий\n\n    Полилог — это разговор трёх и более участников. В данном тексте общаются выпускники школы, которые делятся своими планами.\n    Тема текста — это то, о чём или о ком в нём говорится. Поскольку все реплики посвящены выбору специальностей после окончания школы, темой является профессиональное самоопределение.\n    Убедительность аргументации строится на логике, практичности, ориентации на будущее или социальной значимости:\n        Практичный подход показан у Гены и Кирилла.\n        Гуманистический (служение людям) — у Тани.\n        Взгляд в будущее и техническая актуальность — у Дарьи.\n        Творческий интерес и романтика — у Семёна и Лизы.\n","64":"Итоговый ответ\nI. Монолог на тему «Какая мне нравится профессия и почему»\n\n    В современном мире появляется множество новых и интересных специальностей. Анализируя информацию в Интернете, можно заметить, что сейчас особенно актуальны профессии, связанные с высокими технологиями, биотехнологиями и искусственным интеллектом. Однако мне больше всего нравится профессия программиста (разработчика программного обеспечения).\n\n    Почему именно она?\n\n    Во-первых, программирование — это творческий процесс. Программист не просто пишет строки кода, он создает что-то полезное с нуля: удобные мобильные приложения, обучающие платформы, игры или сложные системы для медицины и науки.\n\n    Во-вторых, эта специальность невероятно востребована и открывает большие возможности для саморазвития. В сфере информационных технологий постоянно появляется что-то новое, поэтому специалист всегда учится и совершенствует свои навыки.\n\n    В-третьих, эта профессия позволяет работать дистанционно и решать задачи, приносящие пользу миллионам людей по всему миру.\n\n    Я считаю, что за цифровыми технологиями будущее, и поэтому хочу связать свою жизнь именно с этой сферой.\n\n    Вид реализованного монолога: монолог-рассуждение (выдвинут тезис, приведены доказательства/аргументы с использованием вводных слов во-первых, во-вторых, сформулирован итоговый вывод).\n\nII. Выступление в роли школьного психолога: «Последствия вредных привычек»\n\n    Здравствуйте, ребята!\n\n    Как школьный психолог, я часто общаюсь с подростками и вижу, как незаметно привычки формируют нашу жизнь. Сегодня на классном часе мы поговорим о последствиях вредных привычек.\n\n    Часто кажется, что курение, увлечение электронными сигаретами, энергетиками или многочасовое «залипание» в гаджетах — это безобидный способ расслабиться или показаться взрослее. Но с точки зрения психологии и физиологии любая вредная привычка — это ловушка зависимости.\n\n    Каковы же её реальные последствия?\n\n        Влияние на мозг и учёбу: ухудшается память, снижается концентрация внимания, появляется постоянная усталость и раздражительность.\n        Эмоциональные проблемы: человек теряет способность самостоятельно справляться со стрессом и начинает зависеть от временного «допинга».\n        Потеря времени и целей: вредные привычки крадут ресурсы, которые можно было бы направить на спорт, творчество, дружбу и подготовку к будущей профессии.\n\n    Помните: взрослость заключается не в том, чтобы следовать за чужими слабостями, а в умении делать осознанный выбор. Если вы чувствуете тревогу или стресс, всегда можно найти полезную замену: спорт, хобби или разговор со специалистом. Берегите себя и своё будущее!\n\nОбъяснение и методические пояснения\n\n    Типы монологической речи:\n        Монолог-описание — раскрывает признаки предмета или явления.\n        Монолог-повествование — сообщает о последовательности действий или событий.\n        Монолог-рассуждение — объясняет причины, доказывает правильность мысли, отвечает на вопрос «почему?».\n        В части I используется именно рассуждение, так как формулируется тезис («мне нравится профессия программиста»), приводятся логические доводы с помощью вводных слов (во-первых, во-вторых, в-третьих) и делается заключение.\n\n    Особенности монолога психолога (часть II):\n        Выступление сочетает в себе элементы публицистического и научного (популярного) стилей: обращение к аудитории, призыв задуматься, логичность, аргументированность и доброжелательный тон.\n        Структура включает: вступление (приветствие, тема), основную часть (суть проблемы и её последствия) и заключение (вывод, поддержка и конструктивный совет).\n\n","65":"Итоговый ответ: материалы и план презентации\n1. Ответы на вопросы задания\n\n    Телепередачи, предполагающие диалог или полилог:\n        Диалог (общение двух участников: ведущий — гость): авторские интервью («Белая студия», «Познер», «Судьба человека»), спортивные и научно-популярные интервью.\n        Полилог (общение трёх и более участников): ток-шоу («Пусть говорят», «Мужское / Женское»), общественно-политические дискуссии и дебаты («60 минут», «Вечер с Владимиром Соловьёвым»), интеллектуальные викторины («Что? Где? Когда?», «Своя игра», «Умницы и умники»), детские и образовательные программы («Правила жизни», «Сто к одному»).\n\n    Темы, которые они затрагивают:\n        Общественные и социальные проблемы (семья, воспитание, моральный выбор, помощь людям).\n        Культура, наука и искусство (новинки литературы и кино, биографии известных людей, научные открытия).\n        Политика и экономика (события в стране и мире).\n        Спорт, здоровый образ жизни, путешествия, технологии.\n\n    Характеристика общения собеседников:\n        В интервью и интеллектуальных передачах: общение сдержанное, тактичное, аргументированное, доброжелательное; участники соблюдают культуру речи, внимательно слушают друг друга.\n        В общественно-политических ток-шоу и дискуссиях: общение часто экспрессивное, эмоциональное, порой напряжённое или конфликтное; участники могут перебивать друг друга, отстаивая противоположные точки зрения.\n\n2. План и содержание школьной презентации\n\nНазвание презентации: «Диалог и полилог на современном телевидении»\n\n    Слайд 1. Титульный\n        Заголовок: Диалог и полилог в телепередачах.\n        Подзаголовок: Формы общения, темы и речевая культура.\n        Автор: ученик 7 класса.\n\n    Слайд 2. Что такое диалог и полилог?\n        Текст:\n            Диалог — это разговор двух лиц.\n            Полилог — это разговор трёх и более участников.\n        Фото / иллюстрация: Сравнение двух кадров — портретное интервью один на один и круглый стол с несколькими участниками.\n\n    Слайд 3. Телепередачи-диалоги: искусство интервью\n        Примеры программ: «Белая студия», «Судьба человека».\n        Темы: творческий путь, личность человека, морально-этические ценности, искусство.\n        Характер общения: вдумчивое, спокойное, доверительное, вежливое.\n        Фото: Ведущий и гость сидят друг напротив друга, взгляд направлен на собеседника (акцент на внимательном слушании).\n\n    Слайд 4. Телепередачи-полилоги: дискуссии и командная работа\n        Примеры программ: «Что? Где? Когда?», «Умницы и умники», «Сто к одному».\n        Темы: интеллектуальный поиск, эрудиция, наука, литература.\n        Характер общения: командный, динамичный, конструктивный; участники дополняют мысли друг друга, вместе ищут ответ.\n        Фото: Знатоки за круглым столом в момент минутного обсуждения вопроса.\n\n    Слайд 5. Ток-шоу: эмоциональный полилог и споры\n        Примеры программ: социально-бытовые и политические передачи.\n        Темы: острые жизненные ситуации, семейные конфликты, мировые события.\n        Характер общения: высокая эмоциональность, столкновение позиций, использование полемических приёмов, жестикуляции.\n        Фото: Участники ток-шоу с выразительной мимикой и жестами в процессе спора.\n\n    Слайд 6. Культура телевизионного общения (Выводы)\n        Текст:\n            Телевидение даёт примеры как эталонного речевого этикета, так и ситуаций речевой агрессии.\n            Успешный диалог и полилог зависят от умения слушать собеседника, не перебивать и уважать чужое мнение.\n        Фото: Ведущий программы, жестом приглашающий гостя к высказыванию.\n\nОбъяснение и методические рекомендации\n\n    Речевые понятия:\n        Диалог (от греч. dialogos — беседа, разговор двоих) строится из реплик-стимулов (вопросов, предложений) и реплик-реакций (ответов, согласия/несогласия).\n        Полилог (от греч. polys — многий + logos — слово, речь) — многостороннее общение, где инициатива постоянно переходит от одного участника к другому.\n\n    Советы по подбору фотографий для слайдов:\n        Выбирайте кадры крупного и среднего плана, где хорошо видны невербальные средства общения: мимика, зрительный контакт, жесты согласия, удивления или спора.\n        Для диалога лучше всего подойдут стоп-кадры из программ телеканала «Культура» (уважительный тон, выразительные лица).\n        Для полилога отлично подходят кадры игры «Что? Где? Когда?», где запечатлён яркий момент мозгового штурма.\n","66":"Диалог на тему «Планы на выходные дни»\n\n— Привет, Максим! Ты уже решил, чем займёшься в эти выходные?\n— Привет, Данил! В субботу утром я планирую пойти на тренировку по баскетболу, а во второй половине дня хочу отдохнуть.\n— А у меня есть отличное предложение: давай сходим в кино на новый приключенческий фильм!\n— Звучит здорово. Во сколько начинается сеанс?\n— В четыре часа дня в кинотеатре «Космос». После фильма можем ещё зайти в парк покататься на самокатах.\n— Отличная идея! Я как раз освобожусь к трём часам.\n— Договорились, тогда я куплю билеты через интернет, а встретимся у входа в кинотеатр в 15:45.\n— Хорошо, до субботы!\nПамятка и правила оформления диалога\n\n    Количество реплик: В приведённом диалоге представлено 8 реплик (выполнено требование «не менее 6–7 реплик»).\n    Правила пунктуации при записи диалога:\n        Каждая новая реплика диалога начинается с новой (красной) строки.\n        Перед началом каждой реплики обязательно ставится тире.\n        Кавычки при таком оформлении диалога не используются.\n        В конце реплик ставятся соответствующие знаки препинания (точка, вопросительный или восклицательный знак, многоточие).\n","67":"Итоговый ответ\n\n    Соответствие признакам текста:\n    Да, данный текст полностью соответствует требованиям цельности (все предложения подчинены одной общей теме), связности (предложения логически и грамматически соединены друг с другом) и законченности (мысль логически завершена выводом).\n\n    О чём этот текст (тема):\n    Текст рассказывает об истории происхождения и значении фразеологизма «достать из-под земли».\n\n    Указательные местоимения, служащие для связи предложений:\n        Такие (во 2-м предложении связывает его с 1-м предложением: банковскими карточками такие карточки);\n        (Об) этом (в 4-м предложении отсылает к смыслу 3-го предложения: хранили деньги... в земле знали об этом);\n        Это (в 5-м предложении: это выражение указывает на приведённую выше фразу помещиков).\n\n    Местоимения других разрядов, содержащиеся в тексте:\n        Личные: мне, мы;\n        Притяжательные: своими;\n        Неопределённые: некоторые, что-то;\n        Относительные: которые;\n        Определительные: многие.\n\nОбъяснение и разбор\n\n    Признаки текста:\n        Цельность проявляется в наличии единой темы — раскрытии этимологии фразеологизма.\n        Связность обеспечивается последовательным переходом от современности к истории и обратно, а также специальными средствами связи (союзами, местоимениями, лексическими повторами).\n        Законченность выражается в том, что автор даёт толкование фразеологизма, подводя итог высказыванию.\n\n    Роль указательных местоимений:\n    Указательные местоимения (тот, этот, такой, таков, столько) помогают избежать неоправданного повторения одних и тех же слов и сцепляют соседние мысли:\n        1-е и 2-е предложения: карточками «Такие карточки...»\n        3-е и 4-е предложения: факт хранения денег в земле «...знали об этом...»\n        4-е и 5-е предложения: реплика «Из-под земли достань...» «...употребляем это выражение».\n\n    Разряды остальных местоимений:\n        Своими (чьими?) — указывает на принадлежность предмета лицу, притяжательное.\n        Некоторые, что-то — указывают на неизвестные, неопределённые предметы, неопределённые.\n        Которые — служит союзным словом для связи частей сложноподчинённого предложения, относительное.\n        Мне, мы — указывают на участников речи, личные.\n","68":"Ответ на задание\n1. Признаки текста\n\nДанный фрагмент является текстом, так как обладает следующими признаками:\n\n    Тематическое единство: все предложения объединены одной темой — историей о пропаже вещей и ручной галке.\n    Смысловая цельность и завершённость: в рассказе выражена законченная мысль, есть чёткая сюжетная линия.\n    Грамматическая и логическая связь предложений: предложения выстроены в строгой временной и причинно-следственной последовательности и связаны между собой специальными языковыми средствами.\n    Возможность озаглавить текст.\n\n2. Заголовок\n\n    «Галка-воровка» (варианты: «Тайник на крыше», «Невиновный брат», авторское — «Галка»).\n\n3. Главная мысль текста\n\nАвтор хотел донести до читателя мысль о том, что нельзя спешить обвинять близких людей в проступках, не разобравшись в ситуации и не имея доказательств. Обидеть невиновного легко, поэтому важно быть внимательными, доверять друг другу и уметь вовремя признать свою ошибку и попросить прощения.\n4. Средства связи предложений в тексте\n\n    Местоимения (личные и указательные): галка она, у ней; очки их; мальчик он; к брату с ним; Твои это дела.\n    Лексические повторы и однокоренные слова: колечко — кольцо, очки — очков, потом вытащил — а потом достал.\n    Союзы в начале предложений (для связи мыслей): «А когда она мыло сполоснула...», «И закричала на мальчика...», «А галка села на крышу...».\n    Наречия со значением времени и последовательности: «Вот раз...», «Только что...», «Потом...», «А потом...».\n\n5. Элементы композиции рассказа\n\n    Начало (экспозиция): Знакомство с ручной птицей.\n\n        «У брата с сестрой была ручная галка. Она ела из рук, давалась гладить, улетала на волю и назад прилетала».\n\n    Завязка: Пропажа колечка у сестры и первая ссора.\n\n        «Вот раз сестра стала умываться. Она сняла с руки колечко... А колечка нет... Сестра поссорилась с ним и заплакала».\n\n    Развитие действия: Пропажа бабушкиных очков, несправедливые обвинения в адрес мальчика и его уход из дома.\n\n        «Бросились искать очки — нет очков... И закричала на мальчика: — Твои это дела!... Обиделся мальчик, выбежал из дому».\n\n    Кульминация (наивысшая точка напряжения): Мальчик выслеживает галку и раскрывает её тайну.\n\n        «Глядит — а над крышей галка летает, и что-то у ней под клювом блестит. Пригляделся — да это очки! Спрятался мальчик за дерево и стал глядеть. А галка села на крышу, огляделась... и стала очки на крыше клювом в щель запихивать».\n\n    Спад действия: Мальчик достаёт спрятанные сокровища из птичьего тайника.\n\n        «А мальчик полез на крышу и вытащил из щели бабушкины очки. Потом вытащил оттуда и колечко. А потом достал стёклышек, а потом разных денежек много штук».\n\n    Развязка: Примирение, признание сестрой своей неправоты.\n\n        «Обрадовалась бабушка очкам, а сестра колечку и сказала брату: — Ты меня прости, я ведь на тебя подумала, а это галка-воровка. И помирились с братом».\n\n    Окончание (концовка/эпилог): Вывод бабушки о природных повадках птиц.\n\n        «Бабушка сказала: — Это всё они, галки да сороки. Что блестит, всё тащат».\n\n6. Краткий пересказ\n\nУ брата и сестры жила ручная галка. Однажды во время умывания у девочки пропало кольцо, а следом у бабушки исчезли очки. Обе несправедливо обвинили в пропаже мальчика. Обиженный брат выбежал на улицу и случайно увидел, как галка прячет бабушкины очки в щель на крыше. Мальчик залез на крышу и достал из тайника очки, колечко и множество других блестящих предметов. Семья обрадовалась находкам, сестра попросила у брата прощения, и они помирились.\nПояснение для ученика\n\n    Текст — это два или несколько предложений, связанных по смыслу и грамматически, имеющих общую тему и главную мысль.\n    Композиция повествования строится по классической схеме:\n        Экспозиция (начало) — исходная обстановка.\n        Завязка — событие, с которого начинается конфликт.\n        Развитие действия — ход событий.\n        Кульминация — решающий, самый напряжённый момент.\n        Спад действия — преодоление трудностей после кульминации.\n        Развязка — исход конфликта.\n        Окончание — итог и заключительный вывод.\n","69":"Ответ к заданию\n\n1. Тема предложений:\nПредложения объединены темой «Древнерусский язык и возникновение письменности на Руси» (или просто «Древнерусский язык»).\n\n2. Можно ли из данных предложений составить текст?\nДа, можно.\n\n3. Что для этого нужно сделать?\nДля этого необходимо восстановить логическую последовательность мыслей и расположить предложения так, чтобы они были связаны между собой по смыслу и грамматически.\nТекст в правильном порядке (3, 1, 5, 4, 2)\n\n    Древнерусский язык — это язык жителей государства Русь. Этот язык был прародителем трёх близкородственных славянских языков — русского, украинского, белорусского. Азбуку наши предки получили после того, как в 988 году произошло Крещение Руси и потребовалось перевести богослужебные книги на славянский язык. Азбука эта называлась кириллицей по имени славянского первоучителя IX века Константина (Кирилла) Философа. Старейшие памятники письменности древнерусского языка, дошедшие до нас, датируются концом X — серединой XI века.\n\nОбъяснение\n\nТекст строится по принципу последовательного развития мысли («данное» и «новое»):\n\n    Предложение 3 является зачином (вступлением), так как впервые вводит предмет речи — древнерусский язык.\n    Предложение 1 логически продолжает мысль: местоимение «Этот язык» связывает его с предыдущим предложением и рассказывает о его роли как прародителя восточнославянских языков.\n    Предложение 5 вводит новую подтему — появление азбуки и письменности после Крещения Руси.\n    Предложение 4 подхватывает слово «азбука» («Азбука эта называлась...») и поясняет её название и происхождение.\n    Предложение 2 служит логическим завершением текста, рассказывая о дошедших до нашего времени древнейших памятниках письменности.\n","70":"Заголовок\n\n«Тихая осень за Доном»\nКлючевые слова\n\nосень, лес, листья, шиповник, ягоды, запах, ежевика, роса, паутина, дятел, дрозды, тишина\nСлова в переносном значении\n\n    прижилась (осень)\n\n    ласковая (осень)\n\n    объятые пламенем (кусты шиповника)\n\n    пылали (ягоды)\n\n    огненные язычки\n\n    всепобеждающий (запах)\n\n    заполнил (запах заполнил лес)\n\n    хваткий (ежевичник)\n\n    опутывал (ежевичник опутывал землю)\n\n    мёртвой (траве)\n\n    посеребрённая (паутина)\n\n    деловитое (постукивание) \n\nСписанный текст с вставленными буквами и раскрытыми скобками\n\nЗа Доном в лесу прижилась тихая, ласковая осень. С шелестом падали (падение) с тополей сухие листья. Кусты шиповника (шип) стояли (стоя), будто объятые (разделительный ъ перед я) пламенем (сущ. на -мя, Т. п.), и красные ягоды в редкой (редок) листве их пылали, как огненные (суффикс -енн-) язычки (сочетание чк без ь). Горький, всепобеждающий запах (И. п.) сопревшей дубовой коры (Р. п.) заполнил лес (В. п.). Ежевичник (сочетание чн без ь) — густой и хваткий (хваток) — опутывал (опутываю) землю (В. п.); под сплетением (сплёл) ползучих ветвей его искусно (искусен) прятались от солнца дымчато-сизые (оттенок цвета, дефис), зрелые кисти ежевики. На мёртвой траве (травы) в тени до полудня (словар.) лежала роса, блестела (блеск) посеребрённая ею паутина. Только деловитое постукивание дятла (Р. п.) да щебетание (щебет) дроздов-рябинников нарушали тишину.\nПадежи выделенных слов\nСлово\tПадеж\nзапах\tИменительный\nкоры\tРодительный\nлес\tВинительный\nземлю\tВинительный\nдятла\tРодительный\nпламенем\tТворительный\t\nМорфологический разбор: тишину³\n\n    Тишину — имя существительное (обозначает предмет, отвечает на вопрос что?).\n\n    Начальная форма — тишина.\n\n    Постоянные признаки: нарицательное, неодушевлённое, женский род, 1-е склонение.\n\n    Непостоянные признаки: единственное число, винительный падеж.\n\n    Синтаксическая роль: дополнение (нарушали что? — тишину). \n\nСинтаксический разбор: С шелестом падали с тополей сухие листья.⁴\n\nХарактеристика: Повествовательное, невосклицательное, простое, двусоставное, распространённое, неосложнённое, полное.\n\nГрамматическая основа: листья падали.\n\nВторостепенные члены: падали (с чем?) с шелестом; падали (откуда?) с тополей; листья (какие?) сухие.","71":"Итоговый ответ\n1. Типы речи в тексте\n\n    Использованные типы речи: в тексте присутствуют элементы повествования, описания и рассуждения.\n    Ведущий тип речи: повествование.\n    Объяснение: основу текста составляет сюжетный рассказ о событиях, сменяющих друг друга во времени (набрёл собирал сел стал посвистывать вылез оторвал побежал).\n        Элементы описания передают состояние поляны (выгорела, чёрная земля, блестящие листики, заросли малины) и облик зверька (чёрный нос и два глаза).\n        Элементы рассуждения передают мысли и мотивы автора в финале (Вдруг медведица услышит... подумает... медведице разве объяснишь...).\n\n2. Заглавие и текст, разделённый на абзацы (с вставленными буквами)\n\nВстреча с медвежонком\n\nНабрёл я на поля́ну в тайге́. От лесно́го (ле́с) пожа́ра она выгоре́ла, но на чёрной (черне́ть) земле́ (зе́мли) уже росли́ блестя́щие листики брусники и кивал головками иван-чай.⁴ На краю были заросли мали́ны. Я собира́л мали́ну, а впереди какой-то зверь шёл, шуршал в листьях.\n\nЯ реши́л узнать, что это за зверь. Сел на пенёк (пе́нь) и стал тихонько посвистывать. Зверь сначала останови́лся (встать / остано́вка) и замер, а потом стал ко мне подкрадываться (что делать?). Он думал, что я его не вижу, а верху́шки (ве́рх) мали́новых кустов шеве́лятся (шеве́лится) и его выдаю́т (выда́ть). Потом из куста высунулся чёрный нос и два глаза. Ну, тут я его сразу узнал — это медвежо́нок.\n\nТогда я щепкой стал поскрипывать о пенёк, и нос у медвежонка всё вытягивался, вытягивался, как будто его тянули из куста за нос. Наконец весь вылез и стал меня обнюхивать. Обнюхал, облизал ботинок, нашёл пуговицу и стал её сосать.\n\nИ тут я услышал, как в малиннике сучья трещат. Это медведица ищет медвежонка. Хотел встать, а медвежонок в пуговицу зубами вцепился, рычит и не пускает. Вдруг медведица услышит, как он рычит, подумает, что его обижают, и прибежит. А у меня даже ружья нет! Я скорее пуговицу оторвал и отдал медвежонку, а сам бегом: медведице разве объяснишь, что я только поиграть с ним хотел.\nОбъяснение и разборы\nОрфографический комментарий:\n\n    Чередование гласных в корнях слов:\n        выгоре́ла — корень гар- / гор-, без ударения пишется о;\n        росли́, заросли — корень рос- / раст- / ращ-, перед с пишется о;\n        собира́л — корень бер- / бир-, пишется и, так как за корнем следует суффикс -а-;\n        замер — корень мер- / мир-, пишется е, так как нет суффикса -а-;\n        блестя́щие — корень блест- / блист-, пишется е, так как нет суффикса -а-.\n    Гласные после шипящих:\n        чёрной, чёрный — в корне под ударением пишется ё, проверочное слово: черне́ть;\n        медвежо́нок — в суффиксе существительного -онок после шипящего под ударением пишется о.\n    Буква Ь в глаголах:\n        подкрадываться — инфинитив (начальная форма), отвечает на вопрос что делать?.\n\nСинтаксический разбор предложения (знак ⁴)\n\nОтлесногопожараонавыгореланоначёрнойземлеужерослиблестящиелистикибрусникиикивалголовкамииванчай\n\n    Характеристика предложения: по цели высказывания — повествовательное; по интонации — невосклицательное; сложное, союзное, сложносочинённое (ССП), состоит из трёх предикативных частей, связанных союзами но и и.\n    Разбор по членам предложения:\n        1-я часть:\n            она — подлежащее, выражено местоимением (она);\n            выгорела — простое глагольное сказуемое (выгорела);\n            от пожара — косвенное дополнение или обстоятельство причины ( или ), выражено существительным с предлогом;\n            лесного — согласованное определение (), выражено прилагательным.\n        2-я часть:\n            листики — подлежащее, выражено существительным (листики);\n            росли — простое глагольное сказуемое (росли);\n            блестящие — согласованное определение (), выражено причастием;\n            брусники — несогласованное определение или дополнение ( или ), выражено существительным;\n            на земле — обстоятельство места (), выражено существительным с предлогом;\n            чёрной — согласованное определение (), выражено прилагательным;\n            уже — обстоятельство времени (), выражено наречием.\n        3-я часть:\n            иван-чай — подлежащее, выражено существительным (иванчай);\n            кивал — простое глагольное сказуемое (кивал);\n            головками — косвенное дополнение (), выражено существительным.\n\n(Запятая перед союзом и между 2-й и 3-й частями не ставится, так как у них есть общее обстоятельство места — «на чёрной земле»).\n","72":"Итоговый ответ\n1. Заглавие\n\n    «История привычных слов» (варианты: «Откуда пришли слова \"карандаш\" и \"альбом\"», «Тайна школьных слов»).\n\n2. Тема текста\n\n    Происхождение (этимология) и история заимствования слов карандаш и альбом в русском языке, а также изменение их значений со временем.\n\n3. Ключевые слова и словосочетания\n\n    Происхождение слов, появились в русском языке;\n    карандаш, заимствовано в XVIII веке, тюркские языки, стержень из графита;\n    альбом, XIX век, французский язык (из латинского), белые сшитые листы бумаги;\n    современное значение.\n\nКраткий пересказ по опорным словам:\n\n    Мы часто пользуемся словами карандаш и альбом, но редко задумываемся об их происхождении.\n\n    Слово карандаш пришло в русский язык в XVIII веке из тюркских языков, где обозначало тростниковую трубочку с графитовым стержнем. Сегодня оправа карандаша может быть деревянной, пластмассовой или металлической, но название осталось прежним.\n\n    Слово альбом было заимствовано в XIX веке из французского языка (восходит к латинскому) со значением «сшитые белые листы бумаги для стихов и рисунков». Сейчас альбомы делают из разной бумаги и используют не только для рисования, но и для коллекционирования марок, открыток или монет.\n\n4. Основная и второстепенная информация\n\n    Основная информация: история заимствования слов карандаш и альбом — когда (в XVIII и XIX веках), из каких языков (тюркских, французского/латинского) они пришли в русский язык и каково было их первоначальное лексическое значение.\n    Второстепенная информация: указание на то, где мы ими пользуемся (в школе на уроках ИЗО), а также описание того, из каких материалов эти предметы делают сейчас и как именно их используют в современной жизни.\n\n5. Языковой разбор (обозначен цифрой ¹)\n\nФонетический разбор слова:\n\n    ведь¹ — [в’эт’] (1 слог).\n\n    в — [в’] — согласный, звонкий парный, мягкий парный.\n    е — [э] — гласный, ударный.\n    д — [т’] — согласный, глухой парный, мягкий парный.\n    ь — [—] — звука не обозначает.\n\n    4 буквы, 3 звука.\n\nОбъяснение\n\n    Определение темы и заглавия: Тема — это то, о чём или о ком говорится в тексте. В данном тексте автор рассказывает об этимологии двух конкретных заимствованных слов, поэтому заголовок должен отражать эту мысль кратко и ёмко.\n    Ключевые слова: Это опорные слова, которые несут главную смысловую нагрузку. Выписав их, можно легко восстановить и пересказать логику текста.\n    Разграничение информации: Главная цель познавательного текста — передать научный/исторический факт (происхождение слов). Примеры из нашего быта служат лишь иллюстрацией и пояснением, поэтому они являются второстепенными.\n\n","73":"Ответ к упражнению 73\n\n1. Что главное вы поняли из текста?\nГородецкая роспись — это уникальный традиционный русский художественный промысел с богатой полуторавековой историей. Сегодня мастера фабрики «Городецкая роспись» бережно сохраняют старинные традиции, создавая высокохудожественные изделия, детскую мебель и игрушки, которые известны по всему миру.\n\n2. Какая информация показалась вам второстепенной?\nВторостепенной является детальная информация и перечисления:\n\n    Цитата французского искусствоведа о Лувре;\n    Подробный перечень изготавливаемых предметов быта (хлебницы, солонки, ларцы, вешалки и т. д.);\n    Конкретные названия отдельных сюжетов росписи («На волжском откосе», «У самовара я и моя Маша»).\n\n3. Какова задача создателей текста?\nЗадача текста — познакомить читателя с историей и особенностями городецкого промысла, показать его культурную значимость, а также привлечь интерес туристов и покупателей к современной продукции фабрики и её мастер-классам (текст носит научно-популярный и рекламно-информационный характер).\n\n4. Какие фрагменты текста могут подтвердить вашу точку зрения?\n\n    О культурной значимости и традициях:\n        «Городецкая роспись является уникальным явлением русской национальной культуры, одним из самых знаменитых художественных промыслов России»;\n        «Здесь работают художники фабрики — мастера высокого класса»;\n        «За поддержанием традиций старинной росписи наблюдает художественный совет».\n    О привлечении покупателей и туристов:\n        «В магазине фабрики представлен огромный ассортимент продукции...»;\n        «Эти изделия — прекрасный подарок для ценителей искусства и обладателей тонкого чувства юмора»;\n        «Туристам непременно рекомендуют принять участие в мастер-классе городецкой росписи».\n\n5. Ключевые слова:\nГородецкая роспись, художественный промысел, русская национальная культура, традиции, мастера (художники), сюжеты росписи, фабрика «Городецкая роспись», изделия, музей, выставки.\nОбъяснение\n\n    Главная мысль отражает основное содержание и замысел всего текста: промысел ценен, имеет глубокие корни и успешно развивается в наши дни.\n    Главная информация vs. второстепенная: главная информация передаёт суть (что это за промысел, кто его развивает и почему он ценен), а второстепенная служит иллюстрацией и конкретизацией (длинные списки предметов и частные примеры).\n    Цель текста определяется по его содержанию: начало текста носит просветительский характер (рассказ об искусстве), а концовка ориентирована на гостей и туристов (информация о магазине, подарках и мастер-классах).\n    Ключевые слова — это слова и словосочетания, которые несут основную смысловую нагрузку и помогают кратко пересказать текст без потери смысла.\n\n","74":"Итоговый ответ\n1. Пример устного высказывания (монолога)\n\nВыбранная ситуация: Выступление на радио Нижнего Новгорода с целью привлечь туристов в музей городецкой росписи.\n\n    «Дорогие друзья! Как часто мы ищем что-то необыкновенное, замечательное вдали от дома. А между тем оно находится совсем рядом с нами. В нашем старинном Городце есть уникальный музей, посвящённый всемирно известной городецкой росписи.\n\n    Переступив его порог, вы словно попадаете в русскую народную сказку! Вы увидите диковинные деревянные панно, расписные прялки, шкатулки и яркие детские игрушки, украшенные пышными розанами, купавками и гордыми вороными конями. Каждое изделие хранит тепло рук талантливых мастеров и вековые традиции народных промыслов. Приезжайте в Городец на выходные всей семьёй — откройте для себя живую красоту родного края!»\n\n2. Анализ и ответ на вопрос задания\n\nЧем различаются устные выступления, адресованные разным людям и решающие разные задачи?\n\nВыступления различаются по следующим признакам:\n\n    Стиль речи и выбор языковых средств:\n        Другу (разговорный стиль): используются простые предложения, обращения на «ты», эмоционально окрашенные и разговорные слова («глянь», «классно», «представь себе»).\n        Бизнесмену (деловой/публицистический стиль): используются аргументы, цифры, термины делового общения («выгодные инвестиции», «развитие производства», «спрос на продукцию»), обращение строго на «Вы».\n        Слушателям радио (публицистический стиль): используется торжественная и выразительная лексика, эпитеты, риторические восклицания и призывы («дорогие друзья», «вековые традиции», «приезжайте»).\n\n    Цель высказывания (задача):\n        Для друга — поделиться впечатлениями, увлечь и заинтересовать.\n        Для инвестора — убедить, доказать финансовую перспективность и необходимость вложений.\n        Для радиослушателей — прорекламировать музей, создать яркий образ и побудить к поездке.\n\n    Форма обращения к адресату: выбор вежливой формы (ты / Вы / дорогие радиослушатели) зависит от степени знакомства, возраста и статуса слушателя.\n\nПояснение к выполнению задания\n\nЛюбое высказывание строится с учётом трёх главных факторов речевой ситуации:\n\n    Кто говорит и кому? (Адресант и адресат: сверстник, взрослый деловой человек, широкая аудитория).\n    Зачем говорит? (Цель: дружеский совет, деловое предложение, реклама/призыв).\n    Где происходит общение? (Обстановка: непринуждённая беседа на прогулке, деловые переговоры, радиоэфир).\n\nВ зависимости от этих факторов говорящий сознательно выбирает тон речи, темп, лексику и грамматические конструкции.\n","75":"Ответ\n\n1. Доказательство, что это текст:\nДанная словарная статья является текстом, так как все предложения в ней объединены общей темой, связаны друг с другом по смыслу и грамматически, а также образуют смысловую и композиционную целостность (раскрывают значение и употребление одного слова).\n\n2. Тема текста:\nЗначения и примеры употребления глагола «касаться».\n\n3. Функциональная разновидность языка:\nНаучный стиль (научно-справочный подстиль / язык справочной литературы).\n\n4. Слова с пропущенными буквами (орфограмма «Чередующиеся гласные А — О в корнях -кас- / -кос-»):\n\n    косну́ться — корень -кос- (после корня нет суффикса -а-);\n    косну́лся — корень -кос- (после корня нет суффикса -а-);\n    каса́йся — корень -кас- (после корня есть суффикс -а-);\n    коснётся — корень -кос- (после корня нет суффикса -а-);\n    косну́лся — корень -кос- (после корня нет суффикса -а-);\n    каса́ется — корень -кас- (после корня есть суффикс -а-);\n    каса́нья — корень -кас- (после корня есть суффикс -а-);\n    каса́тельная — корень -кас- (после корня есть суффикс -а-).\n\n(В тетради выделите корень -кас- / -кос- и подчеркните гласную в корне, а также суффикс -а-, если он есть).\n\n5. Значение слова «касаться»:\nСлово касаться является многозначным. В статье В. Даля и в современных толковых словарях (например, С. И. Ожегова) у него выделяется несколько значений:\n\n    Дотрагиваться до чего-либо, прикасаться.\n    Иметь отношение к кому-либо или чему-либо, затрагивать чьи-то интересы.\n    Затрагивать какую-либо тему в разговоре, речи.\n    В геометрии: иметь общую точку (о кривой и прямой).\n\nОбъяснение правила\n\nВ корнях с чередованием -кас- / -кос-:\n\n    пишется буква а, если сразу за корнем следует суффикс -а- (кас-а-ться, кас-а-тельная);\n    пишется буква о, если суффикса -а- за корнем нет (кос-нуться, при-кос-новение).\n","76":"Ответы на вопросы к басне\n\n    В чём особенность этого текста?\n    Особенность этого текста заключается в том, что по жанру это басня. Она имеет традиционную двучастную композицию: сюжетную часть (небольшая поучительная история в стихах) и нравоучительную часть — мораль. Также тексту свойственна аллегоричность (иносказание): через поведение собак показано поведение завистливых и пустых людей.\n\n    В каких строчках поэт выражает главную мысль?\n    Главная мысль (мораль басни) заключена в последних четырёх строках:\n\n        Завистники, на что ни взглянут,\n        Подымут вечно лай;\n        А ты себе своей дорогою ступай:\n        Полают, да отстанут.\n\n    Какой пример приводит автор, чтобы её подтвердить?\n    Для подтверждения мысли автор рассказывает случай из жизни: когда на двух прохожих из подворотен с лаем бросилась целая стая собак, один из путников хотел отогнать их камнем, но второй предложил просто спокойно идти своей дорогой. В итоге через несколько деся
