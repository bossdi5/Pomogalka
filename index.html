ждения:\n        Тезис (формулировка проблемы или главного вопроса).\n        Аргументы (факты, примеры и разные точки зрения: позитивные и негативные аспекты).\n        Вывод (итог размышлений, ответ на исходный вопрос).\n\n    Языковые средства связи мыслей:\n        Для сопоставления мнений: «с одной стороны..., с другой стороны...», «однако», «в то же время», «наряду с этим».\n        Для введения аргументов: «во-первых», «во-вторых», «например», «ярким примером служит...».\n        Для формулирования вывода: «таким образом», «обобщая сказанное», «мы пришли к выводу, что...».\n","105":"Ответ к упражнению 105\n\n1. Функциональная разновидность языка:\nТекст относится к публицистическому стилю (информационная заметка / репортаж о праздничном событии).\n\n2. Оценочные языковые средства:\n\n    Оценочные слова: незабываемым, красочный, эффектное, мастерством, восхищение, умные, красивые, поразили, необыкновенными.\n    Оценочные словосочетания: незабываемым показательным выступлением, красочный парад, эффектное боевое искусство, с большим мастерством, вызвало восхищение, умные и красивые лошади, поразили всех зрителей, необыкновенными номерами.\n    Оценочные предложения:\n        «Продолжился парад незабываемым показательным выступлением».\n        «Это эффектное боевое искусство было показано с большим мастерством и вызвало восхищение у всех присутствующих».\n        «Умные и красивые лошади поразили всех зрителей, особенно детей, своими необыкновенными номерами и выучкой».\n\n3. Содержание микротем:\n\n    1-я микротема (предложения 1–2): Время, место проведения Кавалерийского парада Победы (9 мая на Поклонной горе в Москве) и его главные участники — всадники Кремлёвской школы верховой езды.\n    2-я микротема (предложения 3–4): Начало показательного выступления и красочный парад флагов городов-героев.\n    3-я микротема (предложения 5–6): Знакомство зрителей с искусством фланкировки (владением холодным оружием) и мастерство его исполнения.\n    4-я микротема (предложение 7): Выступление умных и красивых лошадей, поразившее публику своими номерами.\n\n4. Варианты предложений для завершения текста:\n\n    «Этот праздник надолго останется в памяти москвичей и гостей столицы как одно из самых ярких событий Дня Победы».\n    «Зрители ещё долго и восторженно аплодировали всадникам за подаренное великолепное зрелище».\n    «Кавалерийский парад стал настоящим украшением торжеств на Поклонной горе».\n\nОбъяснение\n\n    Публицистический стиль призван не только сообщить факты (где, когда и что произошло), но и эмоционально воздействовать на читателя или слушателя, передать атмосферу праздника и торжества.\n    Оценочная лексика — это слова и выражения, которые выражают отношение автора к происходящему (одобрение, восторг, восхищение). Прилагательные в переносном и качественном значении (красочный, эффектный, необыкновенный) и эмоциональные глаголы (поразили) делают текст выразительным и живым.\n    Микротема — это часть общей темы текста, сгруппированная вокруг одной мысли. В данном тексте каждая микротема последовательно раскрывает ход праздничного мероприятия.\n    Заключение в публицистическом тексте обычно подводит итог всему сказанному, обобщает впечатления участников и зрителей события.\n","106":"Итоговый ответ\n\n    Только факты содержит текст I. В нём сообщается сухая информация: дата, время, место, повод и перечень участников без авторских оценок и эмоций.\n    Факты и отношение к ним (заметка) представлены в тексте II. Автор не только сообщает о прошедшем концерте, но и даёт оценку увиденному, передаёт праздничную атмосферу и настроение зрителей.\n    Репортажем с места события является текст III. События описываются в настоящем времени («находимся», «выходит», «слышим», «видим»), автор находится непосредственно на Красной площади и создаёт эффект присутствия для читателя/слушателя.\n\nОценочные слова, словосочетания и предложения, выражающие отношение к празднику:\n\n    В тексте II:\n        Оценочные слова и словосочетания: праздничный (концерт), замечательных (хоров), потрясли всех, прекрасными (песнями), зажигательным (исполнением), знаменитых (солистов), доставило огромное удовольствие, чувством восторга, благодарные (зрители), любимым (артистам).\n        Оценочные предложения:\n            «Они потрясли всех своими прекрасными песнями и зажигательным исполнением».\n            «Выступление знаменитых солистов ведущих оперных театров доставило огромное удовольствие любителям оперного искусства».\n            «Все зрители были охвачены чувством восторга».\n\n    В тексте III:\n        Оценочные слова и словосочетания: потрясающее (событие), прославленных (хоров), восхищаемся, любимых (артистов), одна из лучших певиц, любимца публики, великолепный (концерт), потрясающей (певицы), необыкновенной (энергией), наслаждаемся, прекрасным (пением), знаменитых (солистов), в восторге, восторженных (зрителей).\n        Оценочные предложения (в том числе восклицательные):\n            «Это потрясающее событие!»\n            «Мы, как всегда, восхищаемся песнями наших любимых артистов».\n            «Любители оперы в восторге!»\n            «У них слёзы на глазах!»\n            «Вы слышите долгие аплодисменты восторженных зрителей!»\n\nОбъяснение и признаки жанров\n\n    Информационное сообщение (хроника, текст I): его задача — предельно точно и кратко передать суть события (что, где, когда произошло). Здесь используются только нейтральные слова, глаголы прошедшего времени, отсутствуют средства выразительности и эмоции.\n    Заметка (текст II): пишется после завершения события. Автор совмещает изложение фактов с собственными впечатлениями, используя качественные прилагательные и эмоционально окрашенные глаголы (потрясли, доставило удовольствие).\n    Репортаж (текст III): отличается эффектом «прямого эфира». Признаки репортажа:\n        использование местоимений я, мы, вы;\n        глаголы настоящего времени (находимся, поют, выходит, видим);\n        наречия времени и места (сегодня, сейчас, только что, здесь);\n        восклицательные предложения и эмоциональные оценки, передающие накал чувств репортёра.\n\n","107":"Функциональная разновидность языка\n\nПублицистический стиль .\n\nПризнаки: оценочность, эмоциональность, призывность (заголовок «Спектакль, который следует посмотреть!»), использование оценочных прилагательных и глаголов.\nЧто мы узнали о событии\n\n    Спектакль «Вредные советы» прошёл 7 декабря 2019 года в Московском театре «Школа современной пьесы» .\n\n    В основе постановки — стихотворения Г. Остера (соавтор пьесы А. Андерсен) .\n\n    Режиссёр — А. Андреев .\n\n    Спектакль идёт не один год и пользуется успехом у зрителей .\n\nКакие чувства старается вызвать автор\n\nАвтор стремится вызвать у читателей интерес к постановке и желание её посетить . Для этого он создаёт положительный, привлекательный образ спектакля.\nЯзыковые средства\n\n    Оценочные прилагательные (эпитеты): искромётный, весёлый, замечательная, талантливого, блестящую, живое, озорное .\n\n    Оценочные глаголы и словосочетания: «с успехом идёт», «вызвал улыбки, смех», «хочется отметить» .\n\n    Эмоциональные конструкции: «Хочется отметить…», «с удовольствием смотрели» .\n\n    Восклицательный заголовок: «Спектакль, который следует посмотреть!» — побуждает к действию .\n\nМикротемы (смысловые части)\n\n    Дата и место показа (7 декабря 2019 года, Московский театр «Школа современной пьесы») .\n\n    Основа спектакля (стихотворения Г. Остера, соавтор А. Андерсен) .\n\n    Реакция зрителей (улыбки, смех, добрые воспоминания) .\n\n    Игра актёров и общая оценка (блестящая игра молодых актёров, спектакль для детей и взрослых) .\n\nМорфологический разбор\n\nПривести³\n\n    Привести — глагол (обозначает действие, отвечает на вопрос что сделать?).\n\n    Начальная форма — привести.\n\n    Постоянные признаки: совершенный вид, переходный, невозвратный, I спряжение.\n\n    Непостоянные признаки: инфинитив (неопределённая форма).\n\n    Синтаксическая роль: часть составного сказуемого (может привести) .\n\nСинтаксический разбор\n\nИскромётный, весёлый спектакль вызвал у зрителей улыбки, смех, добрые воспоминания о своём детстве.⁴\n\n    Повествовательное, невосклицательное, простое, двусоставное, полное, распространённое, осложнено однородными определениями и дополнениями .\n\n    Грамматическая основа: спектакль вызвал.\n\n    Схема: [~, ~ — = --, --, --] .","108":"Ответ\n\n    Место проведения репортажа: плавательный бассейн.\n    Событие: финальный заплыв соревнований по плаванию между мальчиками 6 «А» и 6 «Б» классов (соперничество Пети Смирнова и Вани Михайлова).\n    Местоимения: автор использует личное местоимение 1-го лица «я» и притяжательное местоимение «свой» («я веду», «свой репортаж», «я вижу», «я заканчиваю»).\n    Время большинства глаголов: настоящее время.\n\nОбъяснение\n\n    Определение темы и места: автор прямо указывает локацию в начале текста: «Я веду свой репортаж из бассейна…», а также описывает происходящее состязание: «…соревнования по плаванию среди мальчиков 6 «А» и 6 «Б».\n    Роль автора (репортёра): чтобы подчеркнуть своё непосредственное присутствие на месте событий и личное наблюдение за происходящим, говорящий использует формы 1-го лица: местоимение я и притяжательное местоимение свой.\n    Грамматическое время глаголов: репортаж ведётся в прямом эфире, с места событий, поэтому большинство глаголов употреблено в форме настоящего времени (веду, проводятся, участвуют, видите, разминаются, дают, плывут, вырывается, вижу, старается, не уступает, догоняет, заканчиваю). Такое употребление называется «настоящим репортажным» (или настоящим времени действия) — оно создаёт эффект присутствия и позволяет читателю/слушателю наблюдать за событиями так, будто они происходят прямо сейчас.\n\n","109":"Ответ на вопросы к упражнению\n\n    Темп произнесения:\n    Стихотворение следует читать в быстром, энергичном и нарастающем темпе, передавая накал борьбы на трассе. В кульминационных моментах темп становится прерывистым, взволнованным, с акцентом на эмоциональные восклицания.\n\n    Признаки репортажа в тексте:\n        Эффект присутствия («здесь и сейчас»): события разворачиваются на глазах у комментатора и зрителей.\n        Динамичность и оперативность: фиксация конкретных деталей гонки («полсекунды», «катит швед»).\n        Использование специальной спортивной лексики: «тягун» (затяжной подъём), «подъёмище».\n        Высокая эмоциональность и экспрессия: обилие восклицательных предложений, риторических вопросов, обращений («родной»), междометий («Вот!», «Ну, ещё!», «Ох»).\n        Диалогичность и контакт со спортсменом: прямое обращение во 2-м лице («ты», «за твоей спиною»).\n\n    Грамматические формы глаголов:\n        Настоящее время изъявительного наклонения: катит, выигрываешь, хочешь.\n        Повелительное наклонение (формы 2-го лица единственного числа): прибавь, нажми, возьми, добеги, дотерпи, дотяни, достони, дохрипи, смоги, продержись.\n        Прошедшее время: стала, встали.\n        Встречаются также особые формы глагола — деепричастия: прильнув, припав.\n\n    Цель употребления таких форм:\n        Глаголы настоящего времени создают ощущение сиюминутности происходящего, динамику гонки в реальном времени.\n        Глаголы повелительного наклонения передают предельную эмоциональную включённость комментатора, горячую поддержку, требование и мольбу собраться с последними силами ради победы.\n\nПодробное объяснение\n\n    Жанр репортажа требует передачи живой картины событий. В радио- и телерепортажах комментатор всегда говорит эмоционально, быстро реагируя на малейшие изменения обстановки.\n    Чередование глаголов настоящего времени («ты выигрываешь», «катит швед») с целым рядом глаголов повелительного наклонения с приставкой до- («добеги», «дотерпи», «дотяни», «достони», «дохрипи») подчёркивает преодоление предела человеческих возможностей, когда спортсмен доводит действие до самого конца.\n\n","110":"Ответ к упражнению 110\n\n1. Функциональная разновидность языка:\nТекст относится к публицистическому стилю (информационная заметка / новостное сообщение в СМИ).\n\n2. Событие, о котором повествуется в тексте:\nТоржественная церемония открытия четвёртого автомобильного моста через реку Енисей в Красноярске.\n\n3. Фактические данные, приведённые в тексте:\n\n    Дата открытия: 29 сентября 2015 года.\n    Место события: город Красноярск, река Енисей.\n    Объект строительства: четвёртый автомобильный мост.\n    Дата начала строительства: 27 октября 2011 года.\n    Технические характеристики: длина моста — 1273 метра.\n    Участники события: Президент России, министр транспорта РФ, губернатор, официальные лица и сотни жителей города.\n\n4. Краткое изложение содержания текста (в 3 предложениях):\n\n    29 сентября 2015 года в Красноярске состоялось торжественное открытие четвёртого автомобильного моста через Енисей длиной 1273 метра. В церемонии запуска движения приняли участие первые лица государства, руководство региона и сотни местных жителей. Красноярцы с большой радостью встретили открытие новой важной транспортной артерии, приветствуя первые проехавшие автомобили.\n\nОбъяснение\n\n    Публицистический стиль выбран автором, так как главная цель текста — оперативно сообщить широкой аудитории о важном общественно-социальном событии, проинформировать читателей и передать атмосферу праздника. Для этого стиля характерны точность дат, упоминание официальных лиц, использование речевых оборотов новостной журналистики («напомним», «отметим», «по наблюдениям очевидцев»), а также образных выражений («долгожданная транспортная артерия»).\n    Фактические данные в тексте включают в себя конкретные даты, числа, географические названия и должности, что делает информацию достоверной и проверяемой.\n\n","111":".","112":".","113":".","114":".","115":".","116":".","117":".","118":".","119":".","120":".","121":".","122":".","123":".","124":".","125":".","126":".","127":".","128":".","129":".","130":".","131":".","132":".","133":".","134":".","135":".","136":".","137":".","138":".","139":".","140":".","141":".","142":".","143":".","144":".","145":".","146":".","147":".","148":".","149":".","150":".","151":".","152":".","153":".","154":".","155":".","156":".","157":".","158":".","159":".","160":".","161":".","162":".","163":".","164":".","165":".","166":".","167":".","168":".","169":".","170":".","171":".","172":".","173":".","174":".","175":".","176":".","177":".","178":".","179":".","180":".","181":".","182":".","183":".","184":".","185":".","186":".","187":".","188":".","189":".","190":".","191":".","192":".","193":".","194":".","195":".","196":".","197":".","198":".","199":".","200":".","201":".","202":".","203":".","204":".","205":".","206":".","207":".","208":".","209":".","210":".","211":".","212":".","213":".","214":".","215":".","216":".","217":".","218":".","219":".","220":".","221":".","222":".","223":".","224":".","225":".","226":".","227":".","228":".","229":".","230":".","231":".","232":".","233":".","234":".","235":".","236":".","237":".","238":".","239":".","240":".","241":".","242":".","243":".","244":".","245":".","246":".","247":".","248":".","249":".","250":".","251":".","252":".","253":".","254":".","255":".","256":".","257":".","258":".","259":".","260":".","261":".","262":".","263":".","264":".","265":".","266":".","267":".","268":".","269":".","270":".","271":".","272":".","273":".","274":".","275":".","276":".","277":".","278":".","279":".","280":".","281":".","282":".","283":".","284":".","285":".","286":".","287":".","288":".","289":".","290":".","291":".","292":".","293":".","294":".","295":".","296":".","297":".","298":".","299":".","300":".","301":".","302":".","303":".","304":".","305":".","306":".","307":".","308":".","309":".","310":".","311":".","312":".","313":".","314":".","315":".","316":".","317":".","318":".","319":".","320":".","321":".","322":".","323":".","324":".","325":".","326":".","327":".","328":".","329":".","330":".","331":".","332":".","333":".","334":".","335":".","336":".","337":".","338":".","339":".","340":".","341":".","342":".","343":".","344":".","345":".","346":".","347":".","348":".","349":".","350":".","351":".","352":".","353":".","354":".","355":".","356":".","357":".","358":".","359":".","360":".","361":".","362":".","363":".","364":".","365":".","366":".","367":".","368":".","369":".","370":".","371":".","372":".","373":".","374":".","375":".","376":".","377":".","378":".","379":".","380":".","381":".","382":".","383":".","384":".","385":".","386":".","387":".","388":".","389":".","390":".","391":".","392":".","393":".","394":".","395":".","396":".","397":".","398":".","399":".","400":".","401":".","402":".","403":".","404":".","405":".","406":".","407":".","408":".","409":".","410":".","411":".","412":".","413":".","414":".","415":".","416":".","417":".","418":".","419":".","420":".","421":".","422":".","423":".","424":".","425":".","426":".","427":".","428":".","429":".","430":".","431":".","432":".","433":".","434":".","435":".","436":".","437":".","438":".","439":".","440":".","441":".","442":".","443":".","444":".","445":".","446":".","447":".","448":".","449":".","450":".","451":".","452":".","453":".","454":".","455":".","456":".","457":".","458":".","459":".","460":".","461":".","462":".","463":".","464":".","465":".","466":".","467":".","468":".","469":".","470":".","471":".","472":".","473":".","474":".","475":".","476":".","477":".","478":".","479":".","480":".","481":".","482":".","483":".","484":".","485":".","486":".","487":".","488":".","489":".","490":".","491":".","492":".","493":".","494":".","495":".","496":".","497":".","498":".","499":".","500":".","501":".","502":".","503":".","504":".","505":".","506":".","507":".","508":".","509":".","510":".","511":".","512":".","513":".","514":".","515":".","516":".","517":".","518":".","519":".","520":".","521":".","522":".","523":".","524":".","525":".","526":".","527":".","528":".","529":".","530":".","531":".","532":".","533":".","534":".","535":".","536":".","537":".","538":".","539":".","540":".","541":".","542":".","543":".","544":".","545":".","546":".","547":".","548":".","549":".","550":".","551":".","552":".","553":".","554":".","555":".","556":".","557":".","558":".","559":".","560":".","561":".","562":".","563":".","564":".","565":".","566":".","567":".","568":".","569":".","570":".","571":".","572":".","573":".","574":".","575":".","576":".","577":".","578":".","579":".","580":".","581":".","582":".","583":".","584":".","585":".","586":".","587":".","588":".","589":".","590":".","591":".","592":".","593":".","594":".","595":".","596":".","597":".","598":".","599":".","600":".","601":".","602":".","603":".","604":".","605":".","606":".","607":".","608":".","609":".","610":".","611":".","612":".","613":".","614":".","615":".","616":".","617":".","618":".","619":".","620":".","621":".","622":".","623":".","624":".","625":".","626":".","627":".","628":".","629":".","630":".","631":".","632":".","633":".","634":".","635":".","636":".","637":".","638":".","639":".","640":".","641":".","642":".","643":".","644":"."}};</script>
<script>
(function(){
  const app = document.getElementById('app');
  const DATA = window.APPDATA;

  function el(html){
    const d = document.createElement('div');
    d.innerHTML = html.trim();
    return d.firstElementChild;
  }

  function render(node){
    node.classList.add('screen');
    app.innerHTML = '';
    app.appendChild(node);
    window.scrollTo({top:0, behavior:'smooth'});
  }

  function header(icon, title){
    return `<div class="header"><span class="icon">${icon}</span><h1>${title}</h1></div>`;
  }

  function backBtn(label, onClick){
    const b = document.createElement('button');
    b.className = 'back';
    b.innerHTML = '← ' + label;
    b.onclick = onClick;
    return b;
  }

  function escapeHtml(str){
    return String(str)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;');
  }

  // ---------- Screen: password ----------
  function screenPassword(){
    const wrap = el(`
      <div>
        ${header('🔐','Помогалка')}
        <div class="card">
          <div class="muted" style="margin-bottom:14px;">Введи пароль, чтобы открыть доступ</div>
          <input type="password" id="pwd" placeholder="Пароль">
          <div class="error" id="pwdErr"></div>
          <button class="btn primary" id="pwdBtn">Войти ✨</button>
          <div class="muted" style="text-align:center; margin-top:14px;">получить пароль: @bossdi5</div>
        </div>
      </div>
    `);
    render(wrap);
    const input = wrap.querySelector('#pwd');
    const err = wrap.querySelector('#pwdErr');
    const check = () => {
      if(input.value === 'b_2026'){
        screenMenu();
      } else {
        err.textContent = 'Неверный пароль';
        err.classList.remove('shake'); void err.offsetWidth; err.classList.add('shake');
      }
    };
    wrap.querySelector('#pwdBtn').onclick = check;
    input.addEventListener('keydown', e => { if(e.key === 'Enter') check(); });
    input.focus();
  }

  // ---------- Screen: main menu ----------
  function screenMenu(){
    const wrap = el(`
      <div>
        ${header('🚀','С чем помочь?')}
        <div class="card">
          <button class="btn" id="mAlg"><span class="emoji">📐</span> Алгебра</button>
          <button class="btn" id="mHist"><span class="emoji">🏛</span> История</button>
          <button class="btn last" id="mRus"><span class="emoji">✍️</span> Русский язык</button>
        </div>
      </div>
    `);
    render(wrap);
    wrap.querySelector('#mAlg').onclick = screenAlgebraDev;
    wrap.querySelector('#mHist').onclick = screenHistoryMenu;
    wrap.querySelector('#mRus').onclick = () => screenNumberLookup({
      icon:'✍️', title: 'Русский язык',
      dict: DATA.russian,
      placeholder: 'Номер упражнения',
      onBack: screenMenu
    });
  }

  // ---------- Algebra: in development ----------
  function screenAlgebraDev(){
    const wrap = document.createElement('div');
    wrap.appendChild(backBtn('Назад', screenMenu));
    wrap.appendChild(el(header('📐','Алгебра')));
    wrap.appendChild(el(`
      <div class="card dev-box">
        <div class="dev-emoji">🛠️</div>
        <div class="dev-title">Раздел в разработке</div>
        <div class="muted">Алгебра появится здесь совсем скоро — уже готовим материалы</div>
        <div class="progress"><div class="progress-bar"></div></div>
        <div class="muted" style="font-size:12px;">Загрузка нового раздела…</div>
      </div>
    `));
    render(wrap);
  }

  // ---------- History submenu ----------
  function screenHistoryMenu(){
    const wrap = document.createElement('div');
    wrap.appendChild(backBtn('Назад', screenMenu));
    wrap.appendChild(el(header('🏛','История')));
    const card = el(`
      <div class="card">
        <button class="btn" id="hRetell"><span class="emoji">📖</span> Пересказ параграфа</button>
        <button class="btn last" id="hDates"><span class="emoji">📅</span> Даты и термины</button>
      </div>
    `);
    wrap.appendChild(card);
    render(wrap);
    card.querySelector('#hRetell').onclick = () => screenNumberLookup({
      icon:'📖', title: 'Пересказ параграфа',
      dict: DATA.pereskaz,
      placeholder: 'Номер параграфа',
      onBack: screenHistoryMenu
    });
    card.querySelector('#hDates').onclick = () => screenStaticContent({
      icon:'📅', title: 'Даты и термины',
      text: DATA.dates_terms,
      onBack: screenHistoryMenu
    });
  }

  // ---------- Generic number lookup screen ----------
  function screenNumberLookup(opts){
    const wrap = document.createElement('div');
    wrap.appendChild(backBtn('Назад', opts.onBack));
    wrap.appendChild(el(header(opts.icon, opts.title)));
    const card = el(`
      <div class="card">
        <input type="text" inputmode="numeric" id="lookupInput" placeholder="${opts.placeholder}">
        <div class="error" id="lookupErr"></div>
        <button class="btn primary" id="lookupBtn">Показать 🔎</button>
      </div>
    `);
    wrap.appendChild(card);
    const resultHolder = document.createElement('div');
    wrap.appendChild(resultHolder);
    render(wrap);

    const input = card.querySelector('#lookupInput');
    const err = card.querySelector('#lookupErr');

    const doLookup = () => {
      const key = input.value.trim();
      err.textContent = '';
      resultHolder.innerHTML = '';
      if(!key){ return; }
      const value = opts.dict[key];
      if(value === undefined){
        err.textContent = 'Нет такого номера';
        err.classList.remove('shake'); void err.offsetWidth; err.classList.add('shake');
        return;
      }
      const clean = (value || '').trim();
      const body = (clean === '' || clean === '.')
        ? '<span class="muted">Материал по этому номеру пока не добавлен.</span>'
        : escapeHtml(value);
      resultHolder.appendChild(el(`
        <div class="card">
          <div class="badge">№ ${escapeHtml(key)}</div>
          <div class="content">${body}</div>
        </div>
      `));
    };
    card.querySelector('#lookupBtn').onclick = doLookup;
    input.addEventListener('keydown', e => { if(e.key === 'Enter') doLookup(); });
    input.focus();
  }

  // ---------- Static content screen (dates & terms) ----------
  function screenStaticContent(opts){
    const wrap = document.createElement('div');
    wrap.appendChild(backBtn('Назад', opts.onBack));
    wrap.appendChild(el(header(opts.icon, opts.title)));
    wrap.appendChild(el(`
      <div class="card">
        <div class="content">${escapeHtml(opts.text)}</div>
      </div>
    `));
    render(wrap);
  }

  screenPassword();
})();
</script>
