<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Помогалка</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📘</text></svg>">
<style>
:root{
  --bg1:#eef1ff; --bg2:#f7f3ff; --card:#ffffffcc; --text:#1a1c20; --muted:#666b78;
  --accent1:#6a5bff; --accent2:#3ea0ff; --accent-text:#ffffff; --border:#e3e5f0; --danger:#e5484d;
  --shadow: 0 10px 30px rgba(90,70,220,0.12);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#141522; --bg2:#1b1730; --card:#20212fcc; --text:#eef0f6; --muted:#9aa0b4;
    --accent1:#8b7bff; --accent2:#5fb3ff; --accent-text:#0b0c12; --border:#2c2d3e; --danger:#ff6b70;
    --shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
}
:root[data-theme="dark"]{
  --bg1:#141522; --bg2:#1b1730; --card:#20212fcc; --text:#eef0f6; --muted:#9aa0b4;
  --accent1:#8b7bff; --accent2:#5fb3ff; --accent-text:#0b0c12; --border:#2c2d3e; --danger:#ff6b70;
  --shadow: 0 10px 30px rgba(0,0,0,0.4);
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{
  height:100%;
  margin:0;
  background:
    radial-gradient(1200px 600px at 15% -10%, var(--accent1) 0%, transparent 55%),
    radial-gradient(900px 500px at 100% 0%, var(--accent2) 0%, transparent 45%),
    linear-gradient(180deg, var(--bg1), var(--bg2));
  background-attachment:fixed;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow-x:hidden;
}
#app{
  width:100%;
  max-width:640px;
  padding:24px 16px 40px;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.screen{
  animation: slideIn .38s cubic-bezier(.2,.8,.2,1);
}
@keyframes slideIn{
  from{opacity:0; transform:translateY(14px) scale(.99);}
  to{opacity:1; transform:translateY(0) scale(1);}
}
@keyframes fadeIn{
  from{opacity:0;}
  to{opacity:1;}
}
@keyframes pop{
  0%{transform:scale(.9); opacity:0;}
  60%{transform:scale(1.03); opacity:1;}
  100%{transform:scale(1);}
}
@keyframes floaty{
  0%,100%{transform:translateY(0) rotate(-2deg);}
  50%{transform:translateY(-6px) rotate(2deg);}
}
@keyframes shake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-6px);}
  40%{transform:translateX(6px);}
  60%{transform:translateX(-4px);}
  80%{transform:translateX(4px);}
}
.header{
  display:flex; align-items:center; gap:12px; margin-bottom:2px;
}
.header .icon{
  font-size:26px;
  animation: floaty 3.5s ease-in-out infinite;
  display:inline-block;
}
.header h1{
  font-size:20px; margin:0; font-weight:800;
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.card{
  background:var(--card);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border:1px solid var(--border);
  border-radius:20px;
  padding:20px;
  box-shadow: var(--shadow);
  animation: pop .32s ease;
}
.muted{color:var(--muted); font-size:14px; line-height:1.5;}
.btn{
  position:relative;
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  padding:16px 18px;
  border-radius:14px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  font-size:15.5px;
  font-weight:650;
  text-align:left;
  cursor:pointer;
  margin-bottom:10px;
  transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  overflow:hidden;
}
.btn .emoji{font-size:19px;}
.btn::after{
  content:'›';
  margin-left:auto;
  color:var(--muted);
  font-size:20px;
  transition: transform .15s ease;
}
.btn:hover{ transform:translateY(-2px); box-shadow:0 6px 18px rgba(90,70,220,0.15); border-color:var(--accent1); }
.btn:active{ transform:scale(0.97); }
.btn:active::after{ transform:translateX(3px); }
.btn.primary{
  background:linear-gradient(135deg,var(--accent1),var(--accent2));
  color:var(--accent-text);
  border:none;
  justify-content:center;
  font-weight:800;
  letter-spacing:.2px;
}
.btn.primary::after{content:'';}
.btn.last{margin-bottom:0;}
.back{
  display:inline-flex;
  align-items:center;
  gap:6px;
  border:none;
  background:transparent;
  color:var(--accent1);
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  padding:8px 0;
  margin-bottom:2px;
  transition: transform .15s ease;
}
.back:active{ transform:translateX(-4px); }
input[type=password], input[type=text], input[type=number]{
  width:100%;
  padding:15px;
  border-radius:14px;
  border:1px solid var(--border);
  background:rgba(127,127,127,0.06);
  color:var(--text);
  font-size:16px;
  margin-bottom:10px;
  transition: border-color .15s ease, box-shadow .15s ease;
}
input:focus{
  outline:none;
  border-color:var(--accent1);
  box-shadow:0 0 0 3px rgba(106,91,255,0.18);
}
.error{color:var(--danger); font-size:14px; min-height:18px; margin:-4px 0 6px;}
.error.shake{animation: shake .4s ease;}
.content{
  white-space:pre-wrap;
  word-wrap:break-word;
  line-height:1.65;
  font-size:15px;
  max-height:60vh;
  overflow-y:auto;
  animation: fadeIn .3s ease;
}
.badge{
  display:inline-block;
  font-size:12px;
  color:var(--accent1);
  background:rgba(106,91,255,0.1);
  border:1px solid rgba(106,91,255,0.25);
  border-radius:20px;
  padding:4px 12px;
  margin-bottom:10px;
  font-weight:700;
}
.dev-box{
  text-align:center;
  padding:36px 10px 10px;
}
.dev-emoji{
  font-size:52px;
  display:inline-block;
  animation: floaty 2.4s ease-in-out infinite;
  margin-bottom:6px;
}
.dev-title{font-size:18px; font-weight:800; margin:6px 0 4px;}
.progress{
  width:100%;
  height:8px;
  border-radius:6px;
  background:rgba(127,127,127,0.15);
  overflow:hidden;
  margin:16px 0 6px;
}
.progress-bar{
  height:100%;
  width:38%;
  border-radius:6px;
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
  animation: barmove 1.8s ease-in-out infinite;
}
@keyframes barmove{
  0%{width:15%;}
  50%{width:55%;}
  100%{width:15%;}
}
.spinner{
  width:38px; height:38px;
  border-radius:50%;
  border:3px solid rgba(127,127,127,0.2);
  border-top-color:var(--accent1);
  animation: spin .8s linear infinite;
  margin:0 auto 14px;
}
@keyframes spin{ to{ transform:rotate(360deg); } }
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:3px;}
</style>
</head>

<script>window.APPDATA = {"algebra":{"1":"."},"pereskaz":{"1":"пересказ параграф 1: В конце XV века Китай при династии Мин был мощнейшей самодостаточной империей. В Центральной Азии на обломках державы Чингисхана крепли новые силы; Бабур в 1526 году основал в Индии империю Великих Моголов. Иран возродился при Сефевидах, став соперником Османской империи, которая после взятия Константинополя в 1453 году закрепилась в Европе и Азии. На севере усиливалось Московское государство, свергнувшее ордынское иго. Державы Востока активно внедряли артиллерию, становясь «пороховыми империями».\n\nНовая роль деловых людей.\nНа рубеже Средневековья и Нового времени в Европе начался переход к интенсивному развитию и товарно-денежному хозяйству. Сформировался слой влиятельных деловых людей (купцов, банкиров вроде Фуггеров и Датини), чьи капиталы стали необходимы монархам для ведения войн нового типа. Культура Возрождения и изобретение книгопечатания отражали рациональный и критический взгляд этого сословия на мир. Огнестрельное оружие обесценило рыцарскую конницу, что привело к росту налогов и изменению структуры государства.\n\nПричины взлёта Европы.\nЕвропа получила преимущество благодаря географии (климат, гавани) и защищенности от кочевников. Главным фактором стали экономические механизмы: свободное обращение денег, банковская система и защита частной собственности от произвола властей. Конкуренция между европейскими монархами заставляла их постоянно совершенствовать армию и искать финансовой поддержки у банкиров, что обеспечило высокую мобилизационную способность и технологический рывок.\n\nНа просторах океанов.\nВ XV веке жажда наживы и дух Возрождения толкнули европейцев к морским исследованиям. Португальцы под покровительством Энрике Мореплавателя создали маневренную каравеллу и начали освоение побережья Африки. В это же время Китай совершал масштабные экспедиции Чжэн Хэ, но добровольно отказался от них. В Европе же конкуренция держав сделала процесс открытий необратимым, подготовив почву для открытия Америки и столкновения со скрытыми до того цивилизациями майя, ацтеков и инков.\n\nТезисный конспект\nКитай, Османская империя, Иран и Индия Великих Моголов - доминирующие силы Востока в XV–XVI вв.\nПрименение пороха и артиллерии изменило характер войны, создав «пороховые империи».\nЗападная Европа обошла Восток за счет динамичных изменений в экономике и обществе, пока Восток сохранял традиции.\nПоявление сословия предпринимателей и банкиров сделало государственную власть зависимой от частного капитала.\nВоенная революция: огнестрельное оружие вытеснило рыцарство и потребовало создания постоянных наёмных армий.\nЕвропейская финансовая система (кредиты, банки) стала фундаментом для быстрого восстановления и расширения государств.\nТехнологический прогресс в навигации (каравелла) и книгопечатание ускорили наступление Эпохи великих географических открытий.\nКитайская самоизоляция контрастировала с агрессивной экспансией европейских держав в океане.\nКлючевые термины\nДинастия Мин - правящая династия в Китае, восстановившая независимость страны после монгольского владычества.\nИмперия Великих Моголов - государство на полуострове Индостан, основанное потомком Тимура Бабуром.\nСефевиды - династия правителей Ирана, утвердившая шиизм как государственную религию и создавшая мощную державу.\nОсманская империя - мощное государство турок-османов, захватившее Византию и контролировавшее торговые пути между Европой и Азией.\nАркебуза - одно из первых ручных огнестрельных ружей, заряжавшееся с дула.\nТоварно-денежное хозяйство - тип экономики, где продукты производятся для продажи, а обмен происходит при помощи денег.\nГуманисты - деятели культуры Возрождения, ставившие в центр внимания человека и его способности, а не божественные догмы.\nКаравелла - легкое и быстроходное морское судно с косыми парусами, способное идти против ветра.\nКиль - нижняя продольная балка на дне судна, обеспечивающая его прочность и устойчивость. ","2":"пересказ параграфа 2: Подробный пересказ\nПараграф объясняет, почему европейцы начали масштабные морские экспедиции в конце XV — середине XVII века. Главная причина — экономическая: в Европе очень ценились восточные пряности (перец, корица и др.), а традиционные сухопутные пути в Индию и Китай стали невыгодными — их контролировали посредники, а после завоеваний Османской империи некоторые маршруты и вовсе оказались перекрыты. Европейцы стали искать обходные морские пути на Восток.\n\nВажную роль сыграли технические новшества: появились более надёжные суда (например, каравелла), улучшились навигационные приборы (компас, астролябия), стали точнее карты. Всё это сделало дальние плавания возможными.\n\nПервой на путь масштабных открытий встала Португалия. Большую роль сыграл принц Энрике (Генрих) Мореплаватель: он организовывал экспедиции вдоль западного побережья Африки. Португальцы искали не только новые торговые возможности, но и золото, слоновую кость, а позже активно включились и в работорговлю. Важные вехи португальских плаваний: в 1488 году Бартоломеу Диаш достиг южной оконечности Африки — мыса Доброй Надежды, а в 1497–1499 годах Васко да Гама сумел обогнуть Африку и добраться морским путём до Индии. Это принесло Португалии огромные выгоды и изменило торговлю между Европой и Азией.\n\nВ это же время Испания пошла другим путём: Христофор Колумб предложил плыть на запад через Атлантику, чтобы достичь Востока. 12 октября 1492 года его экспедиция достигла Багамских островов; Колумб считал, что добрался до Индии, поэтому местных жителей назвал «индейцами». Позже стало ясно, что открыты совершенно новые земли.\n\nЕщё одно важнейшее событие эпохи — первое кругосветное путешествие под руководством Фернана Магеллана (1519–1522). Экспедиция нашла пролив (сейчас он называется Магеллановым) и пересекла огромный океан, который Магеллан назвал Тихим. Сам Магеллан погиб в пути, но часть команды завершила плавание. Это путешествие на практике доказало шарообразность Земли и показало, насколько велик Мировой океан.\n\nЗатем другие европейские страны тоже начали искать свои маршруты: англичане и французы пытались найти северные проходы в Азию, голландцы исследовали новые территории. Например, Абель Тасман доказал, что Австралия — отдельный континент. Параграф подчёркивает, что эпоха Великих географических открытий не только расширила представления людей о мире, но и запустила формирование колониальных империй и единого мирового рынка.\n\nПересказ в одну строку\nВо 2‑м параграфе рассказывается о Великих географических открытиях: причинах поиска новых морских путей, технических новшествах, экспедициях португальцев (Диаш, Васко да Гама), открытии Америки Колумбом, первом кругосветном плавании Магеллана и начале формирования колониальных империй","3":"пересказ параграфа 3:\nВ 3‑м параграфе учебника по истории для 7 класса (автор — Мединский) речь идёт о начале правления Ивана IV и реформах середины XVI века.\n\nОсновные моменты\nВенчание на царство в 1547 году. Иван IV стал первым русским царём — это укрепило авторитет верховной власти и подчеркнуло особый статус правителя. Церемонию провёл митрополит Макарий.\nМосковское восстание 1547 года. Пожар и волнения в Москве показали слабость управления и недовольство народа боярским правлением. Это подтолкнуло царя к переменам.\nИзбранная рада. Вокруг Ивана IV сложился круг приближённых (Алексей Адашев, Андрей Курбский, протопоп Сильвестр, митрополит Макарий и другие), который помогал проводить реформы (1549–1560 гг.).\nПервый Земский собор (1549). Стал началом формирования сословно‑представительной монархии: на соборе обсуждали важнейшие государственные вопросы, а власть царя опиралась на представителей разных слоёв общества.\nСудебник 1550 года. Новый свод законов ограничил произвол наместников, ввёл наказания за взятки, подтвердил право крестьян переходить в Юрьев день (но увеличил размер «пожилого» — платы за переход).\nСтоглавый собор (1551). Церковный собор унифицировал обряды, установил единые правила для духовенства и укрепил связь церкви с государством. Название «Стоглавый» связано с тем, что решения были записаны в сборнике из 100 глав.\nСоздание приказов. Появились центральные органы управления (Посольский, Разрядный, Поместный и др.) — они ведали разными сферами и территориями, делая управление страной более системным.\nГубная и земская реформы. На местах усилили выборное самоуправление: появились губные и земские избы, которые боролись с разбоем и управляли местными делами.\nНалоговая реформа. Ввели единую единицу налогообложения — «большую соху»: налог стали считать с земли, а не произвольно, при этом учитывали качество земли и статус владельца.\nНачало книгопечатания. Важное культурное событие эпохи: в 1564 году Иван Фёдоров и Пётр Мстиславец напечатали первую датированную русскую книгу — «Апостол». ","4":"пересказ параграфа 4: Параграф 4 учебника по истории для 7 класса (Мединский) называется «Сельский и городской мир в эпоху зарождения капитализма».\n\nОсновные моменты пересказа\nНаселение Европы и условия жизни. В раннее Новое время (XVI–XVII века) население Европы росло, но средняя продолжительность жизни оставалась низкой — 25–35 лет. На это сильно влияли высокая детская смертность, эпидемии (например, чума), войны, плохая гигиена и суровый климат из‑за «малого ледникового периода».\n«Революция цен». После Великих географических открытий в Европу хлынули золото и серебро из Нового Света. Из‑за роста денежной массы деньги обесценились, а цены на товары резко выросли — это и называют «революцией цен». Она подтолкнула развитие товарно‑денежной экономики.\nРазвитие капитализма и мануфактур. В этот период зарождается капитализм: капитал (деньги, оборудование, предприятия) оказывается в руках частных лиц, которые используют наёмный труд ради прибыли. Важной формой производства становятся мануфактуры — предприятия, где труд разделён между работниками. Они бывают двух видов:\nрассеянные — работники трудятся на дому из сырья заказчика;\nцентрализованные — все работники собраны в одном помещении.\nИзменения в деревне. Деньги всё сильнее проникают в сельскую жизнь. В Западной Европе крестьяне постепенно становятся лично свободными, а повинности переходят в денежную форму. В Центральной и Восточной Европе, наоборот, крепостное право усиливается: дворянам было выгодно получать доход от продажи зерна на Запад, поэтому они заставляли крестьян работать больше.\nАграрные перемены к западу от Эльбы. В регионах к западу от реки Эльбы начинается аграрная революция: хозяйство перестраивают ради прибыли. Яркий пример — огораживания в Англии, когда крестьян сгоняли с земель, чтобы превратить участки в пастбища или крупные фермы. Появляются специализация регионов и более доходное сельское хозяйство.\nРост и облик городов. Города быстро растут (особенно портовые — Лондон, Амстердам, Париж) и становятся центрами торговли, мануфактур и связей с колониями. При этом условия жизни в городах долго оставались тяжёлыми: узкие и грязные улицы, отсутствие канализации, частые пожары. Постепенно появляются элементы благоустройства — уличное освещение, транспорт, новая планировка площадей.\nЭкономическая политика. Распространяется меркантилизм — убеждение, что богатство страны — это прежде всего деньги (золото и серебро). В русле этой политики развивается протекционизм: государство поддерживает своих производителей, ограничивая импорт и стимулируя экспорт.","5":"пересказ параграфа 5: Параграф 5 учебника по истории для 7 класса (автор Мединский) называется «Человек, общество, государство» и посвящён жизни Европы в раннее Новое время.\n\nПро государство и власть\nВ этот период в Европе укрепляется абсолютизм — форма правления, при которой власть монарха почти не ограничена. Короли больше не полагались только на доходы со своих земель: они вводили постоянные налоги, создавали бюрократический аппарат (систему чиновников) и наёмную армию. Монархи забирали у крупных феодалов важные права — например, право чеканить монету и издавать законы. При этом власть короля нередко обосновывали идеей, что он — «проводник божьей воли». При этом короли обычно всё же учитывали традиции и не покушались на право собственности подданных.\n\nПро общество и сословия\nОбщество оставалось сословным и делилось на три большие группы:\n\nДуховенство («те, кто молится»): не платило налоги, занималось религиозными обрядами, благотворительностью и ведением записей (о рождениях, браках, смертях).\nДворянство («те, кто воюет»): владело землёй, имело привилегии (например, особый суд и право носить оружие). К XVII веку военная служба для дворян становилась уже не обязанностью, а почётным правом.\nТретье сословие (все остальные): от богатых купцов и банкиров до крестьян и городских бедняков. В нём выделялась буржуазия — состоятельные горожане (владельцы мануфактур, банкиры), для которых главной ценностью было богатство. Многие из них стремились получить дворянство — например, покупая должности или заключая браки с обедневшими дворянами.\nПро быт и повседневную жизнь\nПовседневность заметно менялась:\n\nДома и планировка. Вместо проходных залов (анфилад) стали строить дома с коридорами и отдельными комнатами, появилась идея личного пространства. Появился даже специальный тип комнаты — кабинет для уединённой работы. Мебель становилась разнообразнее: вместо сундуков ставили шкафы, кровати делали с балдахинами (они защищали от холода).\nЕда и посуда. Благодаря Великим географическим открытиям на столах европейцев появились новые продукты: картофель, кукуруза, рис, а также чай, кофе, шоколад и более доступные специи. В обиход постепенно входила вилка, стали использовать индивидуальные тарелки.\nМода и внешний вид. Мода менялась быстро, а одежда чётко указывала на статус: простолюдинам запрещалось одеваться как дворяне. Лидерами моды сначала была Испания (XVI век), потом — Франция (XVII век). В обиход вошли перчатки, парики, косметика. При этом мылись редко: чистоту оценивали по белизне воротника и манжет.\nСемья и образование. Браки часто заключали по экономическим соображениям. Детство как особый этап жизни почти не выделялось: детей одевали как маленьких взрослых и рано приучали к труду. Зато росла грамотность, и именно в это время педагог Ян Амос Коменский заложил основы современной системы обучения (классы, уроки). ","6":"пересказ параграфа 6: В 6‑м параграфе учебника по истории (7 класс, Мединский) речь идёт о Реформации и Контрреформации.\n\nОсновные моменты\nПричины Реформации. В конце XV — начале XVI века в Европе накопилось недовольство католической церковью. Среди главных причин — роскошь и коррупция духовенства, продажа индульгенций (грамот о прощении грехов), а также то, что церковь взимала большие поборы. Изобретение книгопечатания сделало Библию доступнее, и люди стали сами размышлять о вере.\nМартин Лютер и начало Реформации. Ключевым событием стало выступление Мартина Лютера в 1517 году: он выступил против продажи индульгенций и сформулировал идею «оправдания верой» — то есть спасения через личную веру, а не через обряды и посредничество церкви. Лютер признавал единственным авторитетом Священное Писание, перевёл Библию на немецкий язык и призывал к упрощению церкви и секуляризации (передаче церковного имущества государству).\nРазные течения в Реформации. Учение Лютера получило распространение, но в движении появились и другие направления. Например, радикальное крыло во главе с Томасом Мюнцером, которое связывало религиозные идеи с социальным протестом: это вылилось в Крестьянскую войну 1524–1525 годов. Другое важное направление — кальвинизм Жана Кальвина: его учение строилось вокруг идеи предопределения (Бог заранее определил, кто будет спасён), а успех в труде считался знаком «избранности».\nПоявление протестантов и религиозные конфликты. В 1529 году сторонников Реформации стали называть протестантами. Конфликт между католиками и протестантами привёл к религиозным войнам. Важным итогом стал Аугсбургский мир 1555 года с принципом «чья власть, того и вера»: каждый правитель мог выбирать религию для своих земель.\nКонтрреформация — ответ католической церкви. Чтобы остановить распространение протестантизма, церковь провела ряд мер: усилила инквизицию, ввела «Индекс запрещённых книг», провела Тридентский собор (1545–1563), который подтвердил католические догматы и реформировал внутреннюю жизнь церкви. Важную роль сыграл орден иезуитов, основанный Игнатием Лойолой в 1534 году: они занимались образованием, миссионерством и укреплением католицизма.\nРаспространение борьбы за веру. Противостояние католиков и протестантов вышло за пределы Европы и затронуло колонии в Америке, Азии и Африке, где миссионеры обеих сторон стремились обратить местное население в свою веру.","7":"пересказ параграфа 7: В 7‑м параграфе учебника по истории для 7 класса (Мединский) речь идёт о германских землях и державе австрийских Габсбургов в XVI–XVII веках.\n\nГлавное по темам параграфа\nПолитическая раздробленность Германии. В начале XVI века Германия входила в состав Священной Римской империи, но была сильно раздроблена: там насчитывалось около 300 мелких княжеств. Власть императора была слабой — он зависел от курфюрстов (семи влиятельных князей‑избирателей) и от рейхстага (собрания сословий). Князья сами собирали налоги, содержали войска и почти не считались с центральной властью.\nНедовольство церковью и Реформация. Все слои общества были недовольны влиянием католической церкви и Рима, что стало одной из предпосылок Реформации и крупных социальных потрясений.\nКрестьянская война 1524–1525 годов. Её причинами стали усиление феодального гнёта (барщина, ограничение свобод) и распространение идей равенства на основе Библии. У восставших было несколько программ: «12 статей» (умеренные требования, например, отмена личной зависимости), «Статейное письмо» (радикальные идеи о власти народа) и Хайльброннская программа (план централизации страны и ограничения власти князей). Восстание жестоко подавили, а в итоге раздробленность только укрепилась, а власть князей над крестьянами усилилась.\nДержава Габсбургов и угроза Османской империи. После битвы при Мохаче в 1526 году, где турки разгромили венгерское войско и погиб король Людовик II, земли Чехии и Венгрии перешли к Фердинанду I Габсбургу — так сложилась многонациональная Дунайская монархия. Габсбургам пришлось постоянно обороняться от османов (например, отражать осаду Вены в 1529 году), и это заставляло их укреплять центральную власть в своих владениях.\nДолгосрочные тенденции. В последующие десятилетия (вплоть до Тридцатилетней войны и позже) политическая разобщённость германских земель сохранялась, а Габсбурги оставались главной силой в Центральной Европе, одновременно сдерживая продвижение Османской империи.","8":"пересказ параграфа 8: В 8‑м параграфе учебника по истории для 7 класса (авторы — Мединский, Чубарьян) речь идёт об Испанской монархии в XVI–XVII веках.\n\nГлавное в параграфе\n«Империя, над которой никогда не заходит солнце». При Карле V Габсбурге Испания стала одной из крупнейших держав: под властью монарха находились земли в Европе (Испания, Нидерланды, часть Италии), а также обширные владения в Новом Свете. Огромные территории создавали сложности в управлении — например, вести из американских колоний могли идти до года.\nВосстание Комунерос (1520–1522). Жители Кастилии выступили против роста налогов и того, что король опирался на иностранных советников. Восстание подавили, и это укрепило личную власть монарха.\nПравление Филиппа II. После отречения Карла V в 1556 году испанские владения перешли к его сыну Филиппу II. Он сделал столицей Мадрид и построил дворец‑монастырь Эскориал. Филипп стремился лично контролировать все дела государства, из‑за чего решения часто принимались медленно.\nКрупные события и поражения. В 1580 году к Испании присоединилась Португалия, а в 1588 году испанская «Непобедимая армада» потерпела поражение в столкновении с Англией — это стало началом ослабления морского могущества Испании.\nЭкономические и социальные проблемы. Приток серебра из Америки вызвал «революцию цен» (резкий рост стоимости товаров). Богатства тратились на войны, а не на развитие хозяйства. Власти поддерживали организацию овцеводов (Места), из‑за чего страдало земледелие.\nКризис в XVII веке. Страна столкнулась с тяжёлым экономическим упадком: высокими налогами, сокращением населения, эпидемиями. В 1609 году из Испании изгнали морисков (потомков мусульман, принявших христианство), что нанесло урон ремеслу и сельскому хозяйству. Попытки реформ графа Оливареса привели к восстаниям, а Португалия в итоге вернула себе независимость","9":"пересказ параграфа 9: Параграф 9 учебника по истории для 7 класса (Мединский) посвящён наследникам Золотой Орды в середине XVI века.\n\nГлавное в пересказе\nРаспад Золотой Орды. К XV веку Золотая Орда распалась на ряд самостоятельных ханств. Важнейшими из них были Казанское, Астраханское, Крымское и Сибирское ханства, а также Ногайская Орда.\nКрымское ханство. Оно стало одним из самых сильных наследников Орды. С 1475 года находилось в зависимости от Османской империи: крымский хан признавал власть турецкого султана. Крымские татары активно совершали набеги на русские и соседние земли, захватывая пленников, которых затем продавали в рабство. Важную роль играла торговля, в том числе «живым товаром», а также скотоводство и земледелие.\nКазанское ханство. Основано в 1438 году ханом Улу‑Мухаммедом. Это было многонациональное государство: там жили татары, чуваши, марийцы, мордва, удмурты и башкиры. Казань стала крупным торговым и ремесленным центром благодаря выгодному положению на Волге. Власть хана опиралась на совет знати (карачей) и на курултай — съезд знати для решения важнейших вопросов.\nАстраханское ханство. Возникло в 1459 году, его столицей был город Хаджи‑Тархан (на месте современной Астрахани). Ханство было не очень сильным в военном отношении, но имело большое торговое значение: через него шли восточные товары (ткани, пряности, драгоценности) в русские земли.\nОтношения Москвы с ханствами. Они были напряжёнными. С одной стороны, Москва стремилась контролировать Поволжье и обезопасить свои южные и восточные рубежи. С другой — ханства сами боролись за влияние и нередко устраивали набеги на русские земли. Из‑за этого защита границ и установление контроля над ключевыми территориями стали одними из главных задач Русского государства, особенно в правление Ивана IV.\nПричины конфликтов. Основные противоречия касались контроля над Поволжьем, соперничества за влияние на ханства (например, за то, кто поставит своего ставленника на престол), а также постоянных набегов, которые мешали хозяйственному освоению земель и угрожали населению","10":"пересказ параграфа 10: В 10‑м параграфе учебника по истории для 7 класса (авторы — В. Р. Мединский, А. О. Чубарьян) речь идёт о становлении абсолютизма во Франции.\n\nО чём говорится в параграфе\nУкрепление королевской власти и идея абсолютизма. В XVI–XVII веках во Франции постепенно усиливалась власть монарха: король стремился к неограниченному управлению страной. При этом его власть опиралась на идею божественного происхождения: считалось, что монарх — помазанник Божий. Но существовали и ограничения: король должен был оставаться католиком и не мог менять порядок престолонаследия.\nРазделение дворянства. Дворянство разделилось на две группы: «дворянство шпаги» (старая аристократия, для которой главной ценностью была военная служба) и «дворянство мантии» (чиновники и судьи, получавшие дворянский титул за службу или покупку должностей). «Дворянство мантии» было более лояльно королю и помогало укреплять централизованную власть.\nРелигиозные войны и их последствия. Вторая половина XVI века во Франции прошла под знаком противостояния католиков и гугенотов (французских протестантов). Одним из самых трагических событий стала Варфоломеевская ночь (1572 год), когда в Париже и других городах массово убивали гугенотов. Войны сильно ослабили страну.\nПрекращение конфликтов и восстановление страны. Перелом наступил при Генрихе IV Бурбоне: чтобы прекратить войны, он принял католицизм и в 1598 году издал Нантский эдикт, который гарантировал гугенотам свободу вероисповедания и гражданские права. При поддержке министра Сюлли Генрих IV занялся восстановлением хозяйства и инфраструктуры.\nДальнейшее укрепление абсолютизма. Важную роль в усилении королевской власти сыграл кардинал Ришелье, первый министр при Людовике XIII: он боролся с заговорами знати, запретил дуэли, ослабил политическую самостоятельность гугенотов и ввёл систему интендантов — королевских чиновников, управлявших провинциями. Вершиной французского абсолютизма стало правление Людовика XIV («Короля‑солнце»), который стремился лично контролировать все стороны управления государством.","11":"пересказ параграфа 11: В 11‑м параграфе учебника по истории для 7 класса (авторы — В. Р. Мединский, А. В. Торкунов) речь идёт об Англии в XVI — начале XVII века: становлении абсолютизма при Тюдорах и переменах в экономике и обществе.\n\nГлавное по темам параграфа\nУкрепление королевской власти при Тюдорах. После Войны Алой и Белой розы к власти пришла династия Тюдоров (с 1485 года). Генрих VII и его сын Генрих VIII ослабили крупных феодалов и усилили центральную власть: опирались на новое дворянство (джентри), использовали суды (в том числе Звёздную палату для дел о госизмене) и наёмные отряды. Важным инструментом контроля стал парламент, который утверждал налоги и законы.\nКоролевская Реформация. Ключевым шагом стал Акт о супрематии 1534 года, по которому король (Генрих VIII) становился главой англиканской церкви. Причины были и политическими (независимость от папы римского), и экономическими (конфискация монастырских земель и пополнение казны). Противников реформы, например Томаса Мора, казнили. Библию начали переводить на английский, в стране постепенно укреплялся протестантизм.\nПравление Елизаветы I и рост могущества Англии. При Елизавете I (1558–1603) Англия стала сильной морской державой. Важное событие — разгром испанской «Непобедимой армады» в 1588 году. Внутри страны усиливался контроль над католиками, одновременно формировались течения пуритан, которые хотели «очистить» церковь от остатков католичества.\nЭкономические и социальные перемены. Из‑за спроса на шерсть началось огораживание: дворяне захватывали общинные земли под пастбища для овец и сгоняли крестьян. Это привело к росту числа обезземеленных людей и развитию наёмного труда. Появилось новое дворянство — джентри, активно занимавшееся предпринимательством, торговлей и мануфактурами. Развивались крупные торговые компании (например, Московская и Ост‑Индская), Англия стала крупным экспортёром тканей.\nПереход к династии Стюартов и нарастание кризиса. В 1603 году на престол взошёл Яков I, а затем его сын Карл I. Стюарты стремились править без опоры на парламент и вводить налоги в обход его согласия. Такая политика вызывала недовольство общества и подрывала авторитет короны, закладывая почву для будущих конфликтов","12":"пересказ параграфа 12: В Англии к началу XVII века обострился конфликт между королём и парламентом. Династия Стюартов (Яков I, а затем Карл I) стремилась к абсолютной власти и исходила из идеи «божественного права монарха». Короли вводили новые налоги без согласия парламента, поддерживали англиканскую церковь и преследовали пуритан, что вызывало недовольство разных слоёв общества.\n\nКлючевым моментом стало правление Карла I. В 1629 году он распустил парламент и следующие 11 лет правил единолично, усиливая недовольство. Чтобы подавить восстание в Шотландии, королю в 1640 году пришлось созвать парламент — его назвали «Долгим». Это стало началом революционного кризиса.\n\nВ 1642 году конфликт перерос в гражданскую войну. Сторонников короля называли «кавалерами», а сторонников парламента — «круглоголовыми». Важную роль в войне сыграл Оливер Кромвель, который создал «армию нового образца» (её солдат называли «железнобокими»). Армия парламента одержала верх.\n\nВ 1649 году Карла I казнили, монархию упразднили, и Англия была провозглашена республикой. Позже Кромвель фактически установил режим личной власти и в 1653 году стал лордом‑протектором. После его смерти в стране начались беспорядки, и в 1660 году произошла Реставрация: на престол вернулся Карл II из династии Стюартов.\n\nОднако противоречия не исчезли. При Якове II ситуация обострилась, и в 1688 году случилась «Славная революция»: парламент пригласил на трон Вильгельма III Оранского, а Яков II бежал из страны. Революция прошла почти без кровопролития. В 1689 году приняли Билль о правах, который закрепил верховенство парламента над королём. Так в Англии утвердилась конституционная монархия.\n\nКлючевые даты из параграфа\n1629 год — Карл I распускает парламент и начинает единоличное правление.\n1640 год — созыв Долгого парламента.\n1642 год — начало гражданской войны в Англии.\n1649 год — казнь Карла I и провозглашение республики.\n1653 год — Кромвель становится лордом‑протектором.\n1660 год — Реставрация монархии, возвращение Карла II.\n1688 год — «Славная революция».\n1689 год — принятие Билля о правах.\nВажные термины\nДолгий парламент — парламент, созванный в 1640 году и не распускавшийся долгое время; стал центром оппозиции королю.\nКавалеры — сторонники короля в гражданской войне.\nКруглоголовые — сторонники парламента.\n«Железнобокие» — солдаты армии Кромвеля, отличавшиеся дисциплиной и стойкостью.\nЛорд‑протектор — титул, который принял Оливер Кромвель, фактически возглавив государство.\nРеставрация — восстановление монархии в 1660 году.\n«Славная революция» — смена власти в 1688 году, которая закрепила ограничение королевской власти.\nБилль о правах — документ 1689 года, ограничивший власть монарха и закрепивший права парламента","13":"пересказ параграфа 13: В 13‑м параграфе учебника по истории для 7 класса под редакцией Мединского речь идёт о Речи Посполитой — о том, как она возникла и как была устроена.\n\nКак появилась Речь Посполитая\nКлючевое событие — Люблинская уния 1569 года. По ней Польское королевство и Великое княжество Литовское объединились в одно государство — Речь Посполитую (в переводе с польского это значит «общее дело»). Унии способствовала, в частности, необходимость вместе вести Ливонскую войну. При этом Польша и Литва сохранили отдельные армии, суды и некоторые органы управления, но у них стали общими король, сейм (собрание представителей), внешняя политика и деньги.\n\nОсобенности устройства государства\nВ Речи Посполитой сложилась необычная для Европы того времени политическая система, которую часто называют «шляхетской демократией»:\n\nВыборный король. Короля не наследовали, а избирали на специальном собрании шляхты (дворянства). При этом он сильно зависел от знати и должен был соблюдать особые договорённости (например, «Генриковы артикулы»), которые ограничивали его власть.\nОгромные права шляхты. Польское дворянство составляло примерно 10 % населения — это было очень много по меркам Европы. Шляхта имела множество привилегий и фактически управляла страной.\nСейм и «либерум вето». Важнейшие решения принимались на сейме. Действовал принцип «либерум вето»: если хотя бы один депутат был против, решение не принимали. Из‑за этого работа государства часто оказывалась парализована.\nМагнаты. Огромную роль играли богатейшие землевладельцы — магнаты. У некоторых из них были собственные войска, и они могли соперничать по влиянию даже с королём.\nСила и слабость государства\nС одной стороны, Речь Посполитая была крупным и влиятельным государством Восточной Европы, вела активные войны и участвовала в большой политике. С другой — из‑за чрезмерных привилегий шляхты центральная власть оставалась слабой, а внутренние разногласия мешали проводить единую политику. Именно эта особенность устройства со временем стала одной из причин ослабления страны.","14":"пересказ параграфа 14: О чём говорится в параграфе\nНовые принципы международных отношений. В раннее Новое время представления о единой христианской империи ушли в прошлое. На первый план вышел принцип национального суверенитета: монархи стали полновластными хозяевами в своих государствах и не зависели от папы римского или императора. Внешняя политика всё больше строилась на государственном интересе — главным становилась выгода страны, а не религиозные соображения. Например, католическая Франция могла вступать в союз с протестантами, если это помогало ослабить общего соперника.\n\nИдея баланса сил. Чтобы ни одно государство не стало слишком сильным, остальные объединялись против него. Так в Европе складывалась система баланса сил: она должна была сохранять равновесие и не допускать гегемонии одной державы.\n\n«Военная революция». В этот период сильно изменилось военное дело. Огнестрельное оружие (мушкеты, мобильная артиллерия) сделало рыцарскую конницу малоэффективной. Главную роль стали играть пехота и пушки. Вместо отрядов наёмников появились регулярные армии с единой формой, вооружением и дисциплиной. Армии сильно выросли в численности (например, французская армия увеличилась с 10–20 тысяч до 300 тысяч человек), а их содержание стоило очень дорого. Это заставляло государства повышать налоги и укреплять государственный аппарат.\n\nКрупные конфликты эпохи. Важной линией противостояния стала борьба Франции с династией Габсбургов: владения Габсбургов (Испания и Священная Римская империя) окружали Францию, и борьба за господство в Европе определяла многие войны. Одним из главных событий стала Тридцатилетняя война (1618–1648). Она началась как религиозное противостояние католиков и протестантов в Германии, но постепенно превратилась в общеевропейский конфликт. В итоге даже католическая Франция выступила против Габсбургов ради политических интересов. Война завершилась Вестфальским миром (1648), который закрепил новые правила международных отношений: признание суверенитета государств, право немецких князей самостоятельно решать религиозные вопросы в своих землях, а также независимость Нидерландов и Швейцарии.\n\nТурецкая угроза и борьба на южных рубежах. Османская империя оставалась важным фактором европейской политики: турки захватили значительную часть Венгрии и угрожали Австрии и Италии. Важной победой европейских сил стала битва при Лепанто (1571), где объединённый флот христианских государств разгромил турецкий флот. Позднее, в 1683 году, коалиция европейских держав (в том числе с участием польских войск) отразила осаду Вены и остановила продвижение Османской империи в Центральную Европу.","15":"пересказ параграфа 15: В учебнике по истории для 7 класса под редакцией В. Р. Мединского в 15‑м параграфе речь идёт о международных отношениях и «военной революции» в Европе в XVI–XVII веках.\n\nО чём говорится в параграфе\nСмена принципов международных отношений. В раннее Новое время на смену средневековым представлениям о «единой христианской империи» пришёл принцип национального суверенитета: монархи стали полновластными хозяевами в своих государствах и не зависели от папы римского или императора. Главным ориентиром внешней политики стал государственный интерес — выгода страны. Из‑за этого могли складываться неожиданные союзы: например, католическая Франция нередко выступала вместе с протестантами, чтобы ослабить своих главных соперников — Габсбургов. Важной идеей стала концепция баланса сил: если одно государство слишком усиливалось, остальные объединялись против него, чтобы сохранить равновесие в Европе.\n\nРазвитие дипломатии. Внешняя политика стала исключительным делом государства, а самостоятельные действия аристократов расценивались как измена. Стали появляться постоянные посольства, формировалась система регулярной дипломатии. Развивалось и международное право: например, голландский юрист Гуго Гроций в труде «О праве войны и мира» пытался разделить войны на справедливые и несправедливые и заложить общие правила.\n\n«Военная революция». В XVI–XVII веках военное дело сильно изменилось из‑за распространения огнестрельного оружия. Рыцарская конница утратила своё значение, главную роль стали играть пехота и артиллерия. Вместо наёмников государства начали создавать постоянные армии с единой формой, вооружением и строгой дисциплиной. Численность войск резко выросла: например, французская армия в эпоху Людовика XIV в военное время достигала 300 тысяч человек. Новые тактики (например, линейные построения и массированные залпы) и изобретения (вроде штыка) тоже меняли характер сражений.\n\nКрупные конфликты эпохи. Параграф уделяет внимание главным противостояниям того времени:\n\nИтальянские войны (1494–1559) — борьба Франции и Габсбургов за влияние в богатой, но раздробленной Италии. Важным событием стала битва при Павии (1525), где французский король Франциск I потерпел поражение и попал в плен.\nТридцатилетняя война (1618–1648) — сначала религиозный конфликт между католиками и протестантами в Германии, а затем общеевропейская борьба, где главную роль играли политические интересы. На разных этапах в войну вмешивались Швеция, Франция и другие державы. Война завершилась Вестфальским миром (1648), который закрепил новую систему международных отношений: признание суверенитета государств, право немецких князей самостоятельно решать религиозные вопросы, независимость Нидерландов и Швейцарии.\nПротивостояние с Османской империей. Турки были важным фактором европейской политики: они захватили значительную часть Венгрии и угрожали Австрии и Италии. Крупной победой христианских сил стала морская битва при Лепанто (1571), а кульминацией турецкой угрозы — осада Вены (1683), после которой началось постепенное вытеснение османов из Европы.\nПоследствия перемен. Большие постоянные армии требовали огромных расходов, поэтому государства усиливали налоговый аппарат и укрепляли центральную власть. «Военная революция» и новая дипломатия во многом сформировали основы той системы международных отношений, которая позже стала привычной для Европы.","16":"пересказ параграфа 16: Главное в пересказе\nПосле смерти Ивана Грозного в 1584 году на престол взошёл его сын Фёдор Иванович. Он не отличался крепким здоровьем и не стремился к активному управлению страной, поэтому фактически ведущую роль в управлении государством играл боярин Борис Годунов, шурин царя (брат его жены Ирины).\n\nВажные события и меры:\n\nУчреждение патриаршества (1589 год). Русская православная церковь стала полностью самостоятельной (автокефальной). Первым русским патриархом стал Иов. Это укрепило авторитет церкви и государства.\nБорьба с хозяйственным упадком. Страна долго страдала от последствий опричнины и Ливонской войны. Власти старались укрепить хозяйство и контроль над крестьянами. В 1597 году были введены урочные лета: устанавливался срок (5 лет), в течение которого помещики могли разыскивать и возвращать беглых крестьян. Это стало важным шагом на пути к дальнейшему закрепощению крестьян.\n«Угличское дело» (1591 год). В Угличе при загадочных обстоятельствах погиб младший сын Ивана Грозного, царевич Дмитрий. Официальная комиссия во главе с Василием Шуйским пришла к выводу, что это был несчастный случай, но в народе ходили слухи о причастности к гибели мальчика Бориса Годунова. Смерть Дмитрия стала одной из причин будущего династического кризиса.\nВнешняя политика и оборона. Россия укрепляла границы и возвращала территории, утраченные в Ливонской войне. По итогам войны со Швецией был заключён Тявзинский мир (1595 год), по которому к России вернулись города Ивангород, Ям, Копорье и Корела. Активно шло строительство крепостей и освоение новых земель, укреплялись позиции на южных рубежах и в Поволжье.\nИтоги правления\nПри Фёдоре Ивановиче страна немного оправилась от потрясений эпохи Ивана Грозного, укрепила церковный и международный авторитет, усилила контроль над крестьянством. Но смерть царевича Дмитрия и отсутствие у Фёдора наследника создали предпосылки для Смутного времени","17":"пересказ параграфа 17: \nПараграф 17 учебника по истории для 7 класса (авторы Мединский и Чубарьян) посвящён культуре эпохи Возрождения (Ренессанса).\n\nГлавная идея эпохи\nОснова культуры Возрождения — гуманизм. В центре внимания оказывается человек: его личность, свобода, разум, способности. Это был поворот от средневекового взгляда, где главным было божественное, к интересу к земной жизни и человеческим возможностям. Люди стали активно обращаться к античному наследию: изучать древнегреческие и римские тексты, искусство, архитектуру, искать в них образцы для подражания.\n\nИтальянское Возрождение\nВозрождение началось в Италии в XIV веке, а в конце XV — начале XVI века наступил период Высокого Возрождения. В это время творили величайшие мастера:\n\nЛеонардо да Винчи — художник («Мона Лиза», «Тайная вечеря») и учёный: он изучал анатомию, делал инженерные наброски (например, проекты летательных аппаратов), стремился соединить науку и искусство.\nМикеланджело Буонарроти — скульптор и живописец. Его статуя «Давид» воплощает идеал человека, а роспись потолка Сикстинской капеллы — грандиозный художественный проект.\nРафаэль Санти известен гармоничными и светлыми образами Мадонны (например, «Сикстинская мадонна»), в его работах особенно чувствуется мягкость и уравновешенность.\nАндреа Палладио развивал архитектуру, опираясь на античные образцы; его постройки (например, вилла Ротонда) стали эталоном классического стиля.\nВ искусстве Возрождения ценились реализм, внимание к пропорциям, анатомии, перспективе, светотени. Художники стремились показать мир максимально правдиво и красиво.\n\nСеверное Возрождение\nИдеи Возрождения распространились за пределы Италии — в Германию, Нидерланды, Францию, Англию. Это направление называют Северным Возрождением. Его особенности:\n\nбольший интерес к деталям, к повседневной жизни, к природе;\nсильное влияние религиозных и этических вопросов, в том числе из‑за начавшейся Реформации.\nЯркие представители:\n\nЭразм Роттердамский — крупнейший гуманист, автор сатирического произведения «Похвала глупости», в котором он высмеивал пороки общества и призывал к разумному взгляду на мир.\nАльбрехт Дюрер — немецкий мастер гравюры и живописи; он изучал пропорции человеческого тела и математические основы искусства.\nПитер Брейгель Старший изображал сцены из жизни крестьян и горожан, народные обычаи, пословицы, создавая глубокие и живые картины общества своего времени.\nМыслители и представления об обществе\nВ эпоху Возрождения активно обсуждали, каким должно быть идеальное общество и государство:\n\nНикколо Макиавелли в трактате «Государь» рассуждал о власти и политике, считая, что ради блага государства правитель может действовать жёстко. Отсюда пошла известная идея о том, что «цель оправдывает средства».\nТомас Мор в книге «Утопия» описал воображаемое идеальное общество, где нет частной собственности, а труд и блага распределяются справедливо. Так появился литературный жанр утопии.\nДругие стороны культуры\nПомимо живописи, скульптуры и архитектуры, развивались и другие формы культуры:\n\nТеатр: в Италии возникла комедия дель арте — театр масок с импровизацией, где использовались постоянные типажи (Арлекин, Панталоне и др.). Популярны были и фарсы — короткие сатирические сценки, высмеивающие человеческие слабости.\nКнигопечатание: изобретение печатного станка (Иоганн Гутенберг) сильно ускорило распространение знаний и сделало книги доступнее.\n","18":"пересказ параграфа 18: Параграф 18 учебника «Всеобщая история» для 7 класса (авторы В. Р. Мединский, А. О. Чубарьян) посвящён культуре XVII века — в первую очередь стилям барокко и классицизму.\n\nЧто в центре внимания параграфа\nНа рубеже XVI–XVII веков идеалы эпохи Возрождения переосмысляются: на фоне войн и кризисов меняется взгляд на человека — он уже не безусловный творец своей судьбы, а часто оказывается игрушкой в руках обстоятельств и высших сил. Это настроение сильно повлияло на искусство.\n\nБарокко\nСтиль зародился в конце XVI века в Италии и быстро распространился по Европе. Его суть — в передаче напряжения, драматизма, контрастов и пышной декоративности.\n\nХарактерные черты:\n\nторжественность, динамика, сложные формы;\nобилие декора, золота, контрасты света и тени;\nстремление поразить зрителя, вызвать сильные эмоции.\nЯркие представители и примеры:\n\nДжованни Лоренцо Бернини — главный мастер барокко, оформил ансамбль площади Святого Петра в Риме, создавал скульптуры, полные движения и страсти.\nПитер Пауль Рубенс — фламандский живописец, его полотна отличаются энергией, яркими красками и мощной пластикой (например, сцены охоты, мифологические сюжеты).\nДиего Веласкес — испанский мастер, умевший сочетать парадность с глубокой психологической правдой (знаменитая картина «Менины»).\nКлассицизм\nПараллельно с барокко во Франции укрепляется классицизм, который противопоставляет пышности и эмоциональности барокко порядок, ясность и рациональность.\n\nОсновные идеи:\n\nопора на античные образцы, строгие правила и симметрию;\nиерархия жанров: «высокие» (трагедия, историческая картина) и «низкие» (комедия, натюрморт);\nв театре действовал принцип «трёх единств» — времени, места и действия.\nПредставители:\n\nдраматурги Пьер Корнель и Жан Расин (трагедии о долге и страсти);\nкомедиограф Мольер, чьи пьесы высмеивали пороки общества;\nархитектурным символом классицизма стал Версальский дворец — образец порядка, симметрии и власти монарха.\nЛитература и театр XVII века\nВ параграфе также говорится о крупнейших писателях эпохи, чьи произведения отражали поиски смысла и противоречия времени:\n\nУильям Шекспир (Англия) — его трагедии («Гамлет», «Отелло») показывают столкновение личности с жестоким миром.\nМигель де Сервантес (Испания) — автор «Дон Кихота», романа, который одновременно пародирует рыцарские идеалы и размышляет о справедливости и мечте.\nЛопе де Вега (Испания) — плодовитый драматург, написавший более 1500 пьес; его комедии и драмы были популярны у широкой публики.\nЖивопись Голландии\nОтдельное внимание уделено «золотому веку» голландской живописи:\n\nРембрандт — мастер светотени и психологизма (например, «Возвращение блудного сына»);\nЯн Вермеер — известен тонкими бытовыми сценами и удивительной передачей света («Девушка с жемчужной серёжкой»).\nИтоги параграфа\nКультура XVII века отразила сложность эпохи:\n\nбарокко выражало драматизм, изменчивость и пышность времени;\nклассицизм предлагал идеал порядка, разума и гармонии;\nлитература и живопись искали новые способы показать внутренний мир человека и его место в меняющемся мире.","19":"пересказ параграфа 19: О чём идёт речь в параграфе\n\nПредпосылки Научной революции. В параграфе подчёркивается, что переворот в науке не случился внезапно: ему предшествовали важные сдвиги в мышлении и практике. На него повлияли:\n\n    Эпоха Возрождения, которая утвердила ценность человеческого разума и стремление к познанию.\n    Реформация, укрепившая идею самостоятельного поиска истины и критического отношения к авторитетам.\n    Великие географические открытия, которые буквально «расширили горизонты» и показали, что старые знания о мире неполны или ошибочны (например, представления о форме Земли и устройстве Вселенной).\n    Книгопечатание, позволившее быстрее распространять новые идеи и результаты исследований, а также сравнивать разные точки зрения.\n\nСмена научной картины мира. Ключевой конфликт параграфа — противостояние старой (средневековой) и новой науки. Раньше наука опиралась на авторитет древних мыслителей (прежде всего Аристотеля) и церковные догматы: считалось, что истину не нужно проверять опытом, она уже известна и записана в трудах признанных авторитетов. Научная революция утвердила новые методы познания — наблюдение, эксперимент, математический расчёт.\n\nГлавные учёные и их открытия. В параграфе разбираются достижения ключевых фигур эпохи:\n\n    Николай Коперник — предложил гелиоцентрическую систему мира (Солнце, а не Земля — центр Вселенной), что стало первым серьёзным ударом по устоявшимся представлениям.\n    Галилео Галилей — использовал телескоп для наблюдений за небесными телами, обнаружил пятна на Солнце, горы на Луне, спутники Юпитера; подтвердил идеи Коперника и сформулировал законы механики.\n    Иоганн Кеплер — математически описал движение планет, доказав, что они движутся по эллиптическим орбитам, а не по идеальным кругам.\n    Исаак Ньютон — создал единую картину мира, сформулировав законы механики и закон всемирного тяготения; он показал, что одни и те же законы действуют и на Земле, и в космосе.\n    Андреас Везалий и Уильям Гарвей — совершили прорыв в медицине: Везалий заложил основы современной анатомии, а Гарвей открыл систему кровообращения.\n\nНовые инструменты и формы организации науки. Параграф обращает внимание на то, что прогресс был связан не только с гениями, но и с техническими новшествами и новыми способами сотрудничества:\n\n    Появились научные приборы: телескоп, микроскоп, термометр, барометр — они позволили увидеть и измерить то, что раньше было недоступно.\n    Стали создаваться академии наук и научные общества, где учёные могли обмениваться результатами и проверять гипотезы друг друга.\n    Сформировались новые философские подходы к науке: Фрэнсис Бэкон отстаивал важность опыта и индукции (от частного к общему), а Рене Декарт — силу разума и дедукции (от общего к частному).\n\nЗначение и последствия. Научная революция изменила не только знания о природе, но и само отношение к познанию:\n\n    Мир стали воспринимать как упорядоченную систему, подчиняющуюся познаваемым законам.\n    Укрепилась вера в силу человеческого разума и прогресс: люди поверили, что с помощью науки можно улучшать жизнь и преобразовывать мир.\n    Наука постепенно становилась отдельной сферой деятельности, независимой от религии и опирающейся на рациональные методы.","20":"пересказ параграфа 20: Османская империя\n\nКак стала великой. Пик пришёлся на XVI век, прежде всего на правление Сулеймана I Великолепного (1520–1566). Ещё до него Селим I Грозный (1512–1520) разгромил Иран в битве при Чалдыране (1514) за счёт артиллерии, а затем присоединил Сирию, Палестину, Египет и Западную Аравию. Он взял под контроль Мекку и Медину и стал считаться защитником главных святынь ислама.\n\nПри Сулеймане империя расширилась и на запад: после битвы при Мохаче (1526) большая часть Венгрии попала под власть османов, а в 1529 году турки осадили Вену (но не взяли её). На море османы под началом адмирала Хайреддина Барбароссы держали в напряжении всё Средиземноморье.\n\nГосударственное устройство и опора власти. Султан был верховным правителем, а его опорой служили:\n\n    янычары — элита пехоты, которую формировали в том числе через «налог кровью» (набор мальчиков из христианских семей, их воспитывали как преданных султану воинов и чиновников);\n    сипахи — конница, получавшая земельные наделы (тимары) за службу;\n    великий везир и совет (диван) — управляли страной;\n    свод светских законов «Канун», который при Сулеймане сделал систему более предсказуемой.\n\nПочему начала слабеть. Упадок нарастал с конца XVI века:\n\n    Экономика. Из‑за Великих географических открытий главные торговые пути ушли из Средиземноморья в Атлантику и Индийский океан. Османы теряли доходы от транзитной торговли. Плюс европейские купцы получали льготы (низкие пошлины), и это подрывало местных ремесленников и торговцев.\n    Армия. Янычары со временем получили право жениться, заниматься ремеслом и торговлей, стали влиятельной городской силой и всё чаще диктовали условия, устраивали бунты и свергали неугодных султанов. Сипахи стремились сделать свои земельные наделы наследственными, что разрушало принцип «служба за землю».\n    Военные поражения. Битва при Лепанто (1571) — разгром турецкого флота объединёнными силами Европы. Осада Вены (1683) — крупное поражение, после которого Османская империя впервые не получила новых земель и контрибуций. Это показало, что Европа обогнала османов в военной организации.\n    Внутренние проблемы. Коррупция, борьба придворных группировок, рост автономии провинций и восстания покорённых народов (например, отряды хайдуков на Балканах) ослабляли центр.\n\nГосударство Сефевидов (Иран)\n\nСтановление и религиозный фактор. Династию основал Исмаил I (начало XVI века). Он сделал шиизм государственной религией, чем резко противопоставил Иран суннитской Османской империи. Это придало конфликту не только политический, но и религиозный характер: каждая сторона претендовала на лидерство в мусульманском мире.\n\nРасцвет при Аббасе I Великом (1587–1629). Шах Аббас провёл серьёзные реформы:\n\n    создал регулярную армию с мушкетёрами и артиллерией (раньше у Сефевидов не хватало огнестрельного оружия);\n    усилил центральную власть, заменив местную знать чиновниками;\n    перенёс столицу в Исфахан, который стал одним из красивейших городов Востока и крупным торговым центром;\n    снизил часть налогов, чтобы поддержать хозяйство.\n\nВо внешней политике Аббас сначала заключил тяжёлый мир с османами, чтобы освободить силы против узбеков на востоке, а потом отвоевал часть территорий у османов и укрепил позиции в Закавказье.\n\nУпадок после Аббаса. Преемники не смогли удержать созданный порядок:\n\n    центральная власть ослабла, начались династические распри;\n    экономика страдала от смещения торговых путей и роста налогов, разорявших крестьян и ремесленников;\n    на востоке усилились афганские племена (сунниты), недовольные шиитской политикой шахов. В 1722 году афганцы под предводительством Махмуд‑хана захватили Исфахан — это стало переломным ударом.\n\nКратковременное восстановление произошло при Надир‑шахе, который изгнал афганцев и турок, а позже даже разгромил империю Великих Моголов в Индии и вывез огромные богатства. Но после его убийства в результате заговора начались новые усобицы, и государство снова погрузилось в кризис.\nПротивостояние Османов и Сефевидов\n\nИх конфликт длился больше двух столетий и был одновременно:\n\n    территориальным — споры за Месопотамию (с важными шиитскими святынями) и Закавказье;\n    религиозным — суннизм против шиизма;\n    политическим — претензии на лидерство в исламском мире.\n\nПостоянные войны истощали обе державы: огромные траты на армию, разорение пограничных областей, необходимость держать крупные гарнизоны. В итоге соперничество мешало им вовремя перестроиться под новые экономические реалии и усилило общий упадок.","21":"пересказ параграфа 21: Как возникла империя\n\nИмперия Великих Моголов появилась в начале XVI века, когда полководец Бабур (потомок Тимура и Чингисхана) вторгся в Индию из Афганистана. В 1526 году в битве при Панипате он разгромил войска Делийского султаната и положил начало новой державе.\nРасцвет империи при Акбаре\n\nПодлинным создателем империи историки считают Акбара (правил в 1556–1605 годах). При нём Моголы подчинили себе большую часть Северной и Центральной Индии. Акбар провёл важные реформы:\n\n    Военная реформа: армия активно использовала огнестрельное оружие, была введена строгая система рангов и дисциплина. Индию той эпохи называют одной из «пороховых империй».\n    Налоговая реформа: упорядочили сбор налогов, чтобы доходы государства стали стабильнее.\n    Политика веротерпимости: Акбар стремился примирить мусульманское правление с индуистским большинством. Он отменил особый налог с немусульман, привлекал индусскую знать к управлению, поддерживал диалог между религиями.\n\nБлагодаря этим мерам в стране на время прекратились крупные восстания и усобицы, а экономика и торговля окрепли.\nОт расцвета к упадку\n\nПосле Акбара политика империи постепенно менялась:\n\n    При Шахе Джахане (1628–1658) страна оставалась сильной, а культура достигла новых высот — именно при нём построили знаменитый Тадж‑Махал в Агре как мавзолей для жены императора.\n    При Аурангзебе (1658–1707) курс резко изменился. Аурангзеб был убеждённым мусульманином и отказался от политики веротерпимости. Он снова ввёл налог на немусульман, разрушал индуистские храмы, ограничивал права индусов. Это вызвало волну восстаний, самое мощное из которых — движение маратхов под предводительством Шиваджи. Империя стала терять контроль над окраинами.\n\nК концу XVII века внутренние противоречия и постоянные войны серьёзно ослабили государство.\nКультура эпохи Моголов\n\nВ империи сложилась яркая художественная традиция, где смешались индийские, персидские и среднеазиатские мотивы:\n\n    Архитектура: кроме Тадж‑Махала, известны крепости в Агре и Дели, заброшенная столица Фатехпур‑Сикри.\n    Живопись: развивалась школа миниатюры — небольшие красочные иллюстрации к книгам, изображавшие придворную жизнь, битвы и охоту.\n    Предметы роскоши: прославился, например, «Павлиний трон» — богато украшенный трон могольских императоров.\n\nПроникновение европейцев\n\nВ это же время в Индии усиливалось влияние европейских держав:\n\n    Сначала доминировали португальцы, контролировавшие морские пути в Индийском океане.\n    Позже их потеснили голландцы, англичане и французы. Англичане создали Ост‑Индскую компанию и начали заключать договоры с местными правителями.\n    Из‑за слабости центральной власти Моголов и вражды между местными князьями европейцы постепенно наращивали своё влияние, закладывая основу будущей колонизации","22":"пересказ параграфа 22: Что происходит в Китае\n\n    Упадок династии Мин и приход династии Цин. При Мин сохранялись конфуцианские нормы и жёсткий контроль над чиновниками. Но рост населения, нехватка земли и высокие налоги привели к разорению крестьян и восстаниям. В 1628 году началась масштабная крестьянская война, а в 1644 году маньчжуры захватили Пекин и основали династию Цин (правила до 1911 года). Маньчжуры, будучи меньшинством, сохранили китайскую систему управления, но ключевые посты отдали своим представителям и ввели ограничения (например, запрет смешанных браков), чтобы сохранить свою идентичность.\n    Контакты с европейцами и контроль торговли. С XVI века в Китай проникают европейцы: португальцы получили доступ к торговле в Макао, а иезуитские миссионеры (самый известный — Маттео Риччи) знакомили Китай с западной наукой, а Европу — с достижениями Востока. При этом китайские власти воспринимали внешнюю торговлю как «данническую систему»: иностранцы формально приносили товары как дань императору («Сыну Неба»), а он отвечал подарками. Опасаясь иностранного влияния, власти постепенно ограничивали контакты.\n    Отношения с Россией. Важным событием стал Нерчинский договор 1689 года, который впервые официально определил границу между Россией и Китаем и установил правила торговли. К этому моменту относится и миссия казака Ивана Петлина 1618 года — одна из первых попыток наладить дипломатические связи.\n    Правление императора Канси. При Канси (1662–1722) в Китае наступили стабильность и расцвет: подавили мятежи, восстановили ирригацию, снизили налоги, открыли школы и упорядочили учёт земель и населения.\n\nЧто происходит в Японии\n\n    Объединение страны. В XVI веке Япония переживала эпоху «воюющих провинций», когда власть была раздроблена между князьями‑даймё. Процесс объединения начали Ода Нобунага и Тоётоми Хидэёси, а завершил Токугава Иэясу, который в 1603 году стал сёгуном и основал династию Токугава.\n    Новые технологии и религия. В 1543 году в Японию прибыли португальцы и привезли огнестрельное оружие (аркебузы), что изменило тактику сражений и снизило значение самурайской конницы. Вместе с торговцами в страну пришли католические миссионеры, и некоторое время к ним относились терпимо. Однако позже власти увидели в христианстве угрозу стабильности и начали преследования.\n    Политика самоизоляции. Чтобы сохранить контроль и традиционный уклад, сёгунат Токугава ввёл жёсткие ограничения: японцам запретили покидать страну, христианство было запрещено, а иностранцам (кроме голландцев и китайцев) — въезжать. Торговля с внешним миром велась только через порт Нагасаки и под строгим контролем государства.\n    Социальные меры. Ещё при Тоётоми Хидэёси был издан «Указ о сборе мечей» (1588), по которому у крестьян изымали оружие, чтобы предотвратить восстания и закрепить сословные границы.\n\nОбщий смысл параграфа\n\nИ Китай, и Япония в XVI–XVII веках стремились к внутренней стабильности: в Китае это выразилось в смене династии и укреплении централизованной власти, а в Японии — в завершении объединения страны и установлении жёсткого контроля сёгуната. Оба государства, столкнувшись с европейским влиянием и распространением христианства, выбрали путь ограничения внешних контактов, чтобы сохранить традиционный порядок. В долгосрочной перспективе такая политика привела к замедлению технологического развития по сравнению с Европой.","23":"пересказ параграфа 23: О чём идёт речь в параграфе\n\nСитуация в Северной Африке (Магрибе). В регионе столкнулись интересы Испании и Османской империи. Испанцы строили крепости на побережье, чтобы защититься от пиратов и укрепить свои позиции. В Алжире вспыхнуло восстание против испанского господства, которое возглавил Хайраддин Барбаросса. Чтобы получить поддержку в борьбе с Испанией, он признал верховенство турецкого султана — в результате восточная часть Магриба вошла в состав Османской империи, а на побережье укрепились пиратские государства под её покровительством.\n\nЗападная Африка: Бенин и Конго. С началом Великих географических открытий португальцы стали активно проникать на западное побережье Африки. Главным двигателем экономики региона стала работорговля: европейцы поставляли местным правителям огнестрельное оружие в обмен на рабов, что провоцировало постоянные войны между племенами за пленников.\n\n    В Бенине торговля с португальцами приносила выгоду, но попытки миссионеров распространить христианство не имели успеха: правителям хватало экономических выгод, и они не стремились менять традиционную систему власти.\n    В Конго ситуация развивалась иначе: король Афонсу I искренне принял христианство и пытался превратить своё государство в «европейскую» державу. Он даже обращался к португальскому королю с просьбами ограничить работорговлю, которая подрывала его власть (в том числе потому, что в рабство продавали знатных людей и родственников короля). Однако интересы португальцев были сосредоточены на прибыли от торговли людьми, и после смерти Афонсу I государство оказалось в глубоком кризисе; в 1665 году португальцы разгромили армию Конго, и королевство распалось.\n\nВосточная Африка: судьба Эфиопии. Эфиопия была древним христианским царством, которое в XVI веке оказалось под угрозой из‑за наступления мусульманских соседей, поддерживаемых Османской империей. Чтобы отбить натиск, эфиопские императоры (негусы) обратились за помощью к португальцам. Союз с европейцами помог отразить агрессию, но португальцы пытались навязать эфиопам католицизм. Это встретило сопротивление: народ защищал свою традиционную веру. Решающим моментом стало правление императора Фасилидаса (с 1632 года): он изгнал католических миссионеров и восстановил прежнюю религиозную традицию. При нём Эфиопия сохранила независимость и пережила период расцвета (так называемый «золотой век»), столицей стал город Гондэр.\nГлавные выводы параграфа\n\n    Разные регионы Африки по‑разному реагировали на европейское проникновение: где‑то оно привело к интеграции и попыткам реформ (Конго), где‑то ограничилось выгодной торговлей без серьёзных перемен (Бенин), а где‑то столкнулось с решительным сопротивлением и сохранением самостоятельности (Эфиопия).\n    Работорговля стала разрушительным фактором для многих обществ Западной Африки: она усилила внутренние конфликты, ослабила традиционные институты власти и сделала государства уязвимыми перед внешним вмешательством.\n    Религиозный фактор играл важную роль: христианство в одних случаях становилось инструментом сближения с Европой (Конго), в других — встречало сопротивление из‑за угрозы традиционным устоям (Бенин) или отвергалось как чуждая форма (Эфиопия, где уже существовала своя сильная христианская традиция).","24":"пересказ параграфа 24: ","25":"пересказ параграфа 25: ","26":"пересказ параграфа 26: ","27":"пересказ параграфа 27: ","28":"пересказ параграфа 28: ","29":"пересказ параграфа 29: ","30":"пересказ параграфа 30: ","31":"пересказ параграфа 31: ","32":"пересказ параграфа 32: ","33":"пересказ параграфа 33: ","34":"пересказ параграфа 34: ","35":"пересказ параграфа 35: ","36":"пересказ параграфа 36: ","37":"пересказ параграфа 37: ","38":"пересказ параграфа 38: ","39":"пересказ параграфа 39: ","40":"пересказ параграфа 40: ","41":"пересказ параграфа 41: ","42":"пересказ параграфа 42: "},"dates_terms":"даты и термины: Всеобщая история конец XV–XVII вв.\n\nДаты\n\n1492 г. — Открытие Америки Колумбом.\n1517 г. — Начало Реформации в Германии 95 тезисов Лютера.\n1524–1525 гг. — Крестьянская война в Германии.\n1526 г. — Битва при Мохаче поражение венгров от турок.\n1529 г. — Первая осада Вены турками.\n1555 г. — Аугсбургский религиозный мир.\n1571 г. — Битва при Лепанто.\n1588 г. — Гибель Непобедимой армады.\n1618–1648 гг. — Тридцатилетняя война.\n1648 г. — Вестфальский мир.\n\nТермины\n\nАбсолютизм — форма правления при которой власть монарха неограниченна.\nБуржуазия — класс собственников капитала купцы банкиры владельцы мануфактур.\nРеформация — религиозное движение XVI в. за обновление католической церкви.\nКонтрреформация — ответная политика католической церкви против Реформации.\nИндульгенция — грамота об отпущении грехов стала поводом к Реформации.\nСекуляризация — обращение церковной собственности в светскую.\nКортесы — сословно-представительные собрания в Испании.\nГранды и Идальго — высшая знать и мелкое дворянство в Испании.\nКонкиста — завоевание европейцами Центральной и Южной Америки.\nУтопия — идеальное но неосуществимое общество термин Т. Мора.\n\nИстория России XVI–XVII вв.\n\nДаты\n\n1547 г. — Венчание Ивана IV на царство.\n1549 г. — Первый Земский собор.\n1552 г. — Взятие Казани.\n1558–1583 гг. — Ливонская война.\n1565–1572 гг. — Опричнина.\n1581–1582 гг. — Поход Ермака в Сибирь.\n1584 г. — Смерть Ивана IV.\n1589 г. — Учреждение патриаршества в России.\n1598 г. — Пресечение династии Рюриковичей смерть Фёдора Ивановича.\n\nТермины\n\nИзбранная рада — круг советников Ивана IV проводивший реформы 1550-х гг.\nОпричнина — политика террора и раздела страны 1565–1572.\nЗаповедные лета — годы когда запрещался переход крестьян в Юрьев день.\nУрочные лета — срок сыска беглых крестьян введены в 1597 г.\nМестничество — порядок назначения на должности по знатности рода.\nЗемский собор — высший сословно-представительный орган с 1549 г.\nСемибоярщина — боярское правительство в период Смуты.\nСамозванство — выдача себя за царя или царевича.","russian":{"1":"Славянские языки\n│\n├── Восточнославянские\n│   ├── русский\n│   ├── украинский\n│   └── белорусский\n│\n├── Западнославянские\n│   ├── польский\n│   ├── чешский\n│   ├── словацкий\n│   └── лужицкий\n│\n└── Южнославянские\n    ├── болгарский\n    ├── сербскохорватский\n    ├── словенский\n    └── македонский ","2":"Вопросный план\n\n    Что общего между славянскими языками?\n\n    Какие слова в разных славянских языках имеют одно и то же значение, но различаются произношением?\n\n    Какие изменения произошли в славянских языках за столетия самостоятельного развития?\n\nОтвет на вопрос\n\nСлавянские языки называются родственными, потому что они произошли от одного общего языка (праславянского) и поэтому имеют множество схожих черт в лексике, фонетике и грамматике. В древности славяне составляли один народ .\nОбъяснение написания выделенных слов\n\n    Стоит — глагол 2-го спряжения (стоить) в форме 3-го лица единственного числа.\n\n    Совпадение — проверяемая безударная гласная в корне; проверочное слово — совпа́сть.\n\n    В лексике — существительное 1-го склонения в форме предложного падежа.\n\n    В фонетике — существительное 1-го склонения в форме предложного падежа.\n\n    В древности — существительное 3-го склонения в форме предложного падежа.\n\n    Составляли — проверяемая безударная гласная в корне; проверочное слово — соста́в.\n\n    Значительные — проверяемая безударная гласная в корне; проверочное слово — зна́чит.","3":"Ответ\n\n1. Важные мысли о значении языка\n\nД. С. Лихачёв утверждает, что язык — это самая большая ценность народа . Автор подчёркивает, что вся сознательная жизнь человека проходит через родной язык: на нём люди пишут, говорят и, что особенно важно, думают . Эмоции и ощущения лишь окрашивают мысли, но сами мысли и понятия формулируются именно языком . Кроме того, Лихачёв называет русский язык одним из совершеннейших языков мира .\n\n2. Значение выделенных слов\n\n    Думает — здесь подчёркивается, что язык — это не просто средство общения, а инструмент мышления. Человек осознаёт мир и себя через язык.\n\n    Сознательная жизнь — жизнь, которую человек осмысляет, понимает и направляет. Она невозможна без языка.\n\n    Формулируются — мысли и понятия обретают чёткую форму именно с помощью языка.\n\n3. Факты, доказывающие, что русский язык — один из совершеннейших языков мира\n\n    Богатство литературы: на русском языке созданы шедевры мировой литературы (Толстой, Достоевский, Чехов, Пушкин), признанные во всём мире .\n\n    Научная точность: русский язык способен точно и подробно описывать научные открытия, философские идеи и сложные теории .\n\n    Гибкость и выразительность: язык позволяет передавать тончайшие оттенки чувств, эмоций и мыслей .\n\n    Широта применения: русский язык используется во всех сферах — от бытового общения до законов и Конституции .","4":"лаголы в переносном значении:\n\nскачут, бегут, устилают, не унёс, не помнит, погребена\n\nЛистья не могут по-настоящему скакать или бежать — это создаёт образ стремительного движения. Сад не может «помнить» — это олицетворение. Весна не может быть «погребена» — метафора.\n\nГрамматические основы простых предложений:\nПредложение\tГрамматическая основа\nКак птицы, скачут и бегут, как мыши,\tлистья скачут и бегут\nСухие листья клёнов и берёз,\t(входит в состав предыдущего)\nС ветвей срываясь, устилают крыши,\tлистья устилают (подлежащее — листья, сказуемое — устилают)\nПока их ветер дальше не унёс.\tветер не унёс\nОсенний сад не помнит, увядая,\tсад не помнит\nЧто в огненной листве погребена\tвесна погребена\nТакая звонкая, такая молодая,\t(относится к «весна»)\nЕщё совсем недавняя весна.\t(подлежащее — «весна»)\n\nИтого простые предложения (грамматические основы):\n\n    листья скачут и бегут\n\n    листья устилают\n\n    ветер не унёс\n\n    сад не помнит\n\n    весна погребена ","5":"лова, появившиеся с освоением космоса\n\nКосмонавт, спутник, зонд, космический корабль, космодром, орбита, скафандр, астероид, метеорит, гравитация, луноход, астронавт, приземление, прилунение, стыковка, центрифуга .\nУстаревшие слова\n\nАэролит (вышло из употребления, его заменил термин «метеорит»), аэронавт (пилот летательных аппаратов, устаревшее), космический челнок (устарело после прекращения программы Space Shuttle), коллапсар (термин, который почти не используется широкой публикой) .\nНовые слова (неологизмы)\n\nКосмодром, искусственный спутник Земли, ракета-носитель, расстыковка, прилунение .\nДоказательство того, что язык живёт и развивается\n\nРусский язык, по словам Н. Гоголя, «живой, как жизнь». Это подтверждается тем, что одни слова устаревают и выходят из активного употребления (например, аэролит заменилось на метеорит, а инженер-испытатель — на космонавт-исследователь), а на их место приходят новые, отражающие современные реалии. Отмирание одних слов и рождение других происходит в языке незаметно, но именно это доказывает, что русский язык постоянно развивается .","6":"Заголовок\n\n«Язык и литература» или «Языковая память народа»\nОсновная мысль\n\nЯзык развивается не сам по себе, а опираясь на «языковую память» — тысячелетнюю литературную и письменную традицию. Писатели и поэты обогащают язык, делают его более гибким и выразительным. Язык и литература неразрывно связаны .\nС каким видом искусства связан язык\n\nВ тексте язык связан с литературой (художественным словом). Автор подчёркивает, что именно литература, особенно поэзия, оказывает наибольшее влияние на развитие языка .\nПроизведения, упомянутые в тексте\n\n    «Слово о полку Игореве» — памятник древнерусской литературы XII века.\n\n    Произведения А. С. Пушкина — поэта, создавшего современный русский литературный язык.\n\n    Летописи — древнерусские историческ
