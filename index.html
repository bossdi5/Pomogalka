ие записи.\n\n    Поучения Кирилла Туровского — церковного писателя и проповедника XII века.\n\n    «Киево-Печерский патерик» — сборник житий святых.\n\n    Произведения Ивана Грозного — письма и послания.\n\n    Произведения Симеона Полоцкого — поэта и просветителя XVII века.\n\n    «Житие протопопа Аввакума» — автобиографическое произведение XVII века.\n\n    Произведения М. В. Ломоносова, Г. Р. Державина, Д. И. Фонвизина, И. А. Крылова, Н. М. Карамзина, В. А. Жуковского — писателей XVIII — начала XIX века.\n\n    Произведения Н. С. Лескова и И. А. Бунина — русских писателей XIX–XX веков .\n\nЗнакомы ли вам эти произведения?\n\nДа, большинство из них изучаются в школе:\n\n    «Слово о полку Игореве» — на уроках литературы в 9 классе.\n\n    Сказки и стихи А. С. Пушкина — с начальной школы.\n\n    Басни И. А. Крылова — в начальных и средних классах.\n\n    Произведения Н. С. Лескова («Левша») и И. А. Бунина — в средних и старших классах.\n\nДополнительный вопрос из задания\n\nКак вы понимаете слова Д. Лихачёва: «Язык в такой же мере нуждается в литературе, как и литература в языке»?\nЯзык даёт литературе материал — слова, из которых создаются произведения. А литература, в свою очередь, обогащает язык новыми образами, выражениями и смыслами, делает его живым и развивающимся. Без литературы язык теряет гибкость, а без языка литература невозможна .","7":"тоговый ответ\n\n1. Примеры названий событий из истории России:\n\n    Куликовская битва, Невская битва, Бородинское сражение, Полтавская битва, Сталинградская битва, Курская битва, Ледовое побоище, Стояние на реке Угре, Русско-турецкая война, Русско-японская война, Ливонская война, Русско-шведская война, Отечественная война 1812 года, Великая Отечественная война.\n\n2. События, в названиях которых упоминаются названия местности (географические объекты):\n\n    Куликовская битва — Куликово поле;\n    Бородинское сражение — село Бородино;\n    Невская битва — река Нева;\n    Полтавская битва — город Полтава;\n    Сталинградская битва — город Сталинград;\n    Курская битва — город Курск;\n    Стояние на реке Угре — река Угра;\n    Крымская война — полуостров Крым;\n    Ледовое побоище — лёд Чудского озера.\n\n3. События, в названиях которых отразились наименования стран и народов — противников России:\n\n    Русско-турецкая война (противник — Турция / Османская империя);\n    Русско-японская война (противник — Япония);\n    Русско-шведская война (противник — Швеция);\n    Ливонская война (противник — Ливонская конфедерация / Ливонский орден);\n    Русско-польская война (противник — Речь Посполитая / Польша).\n\nОбъяснение\n\n    Язык и история: Язык сохраняет историческую память народа. В названиях битв, войн и походов часто закрепляется важнейшая информация: где именно происходило событие (топонимы) или с кем велась борьба (этнонимы и названия государств).\n    Правописание названий исторических событий:\n        В названиях исторических событий с прописной (большой) буквы пишется первое слово, а также входящие в состав имена собственные (Куликовская битва, Бородинское сражение, Отечественная война 1812 года).\n        В сложных прилагательных, обозначающих войны между государствами, части слова пишутся через дефис (русско-японская, русско-турецкая).\n\n","8":"Задание: Прочитайте и озаглавьте текст. Какие аргументы приводит автор, чтобы доказать связь языка с историческими изменениями в жизни людей? Какие слова вам непонятны? Найдите их толкования в словарях.\n\nЗаголовок: Изменения в области лексики. Неологизмы и устаревшие слова .\n\nАргументы автора:\n\n    С развитием новых технологий и отраслей науки появляются новые слова (неологизмы): ветродвигатель, андроид, электромобиль, экология, а также новые продукты и услуги — немолоко, мюсли, суши, йогурт .\n\n    Некоторые слова образуются путём сокращения: МЧС, МРОТ, ЦСО, а также сложением частей слов — избирком, сбербанк, аквапарк .\n\n    Другие неологизмы появляются путём транслитерации (английские буквы заменяются русскими): принтер, менеджер, спикер, мюзикл .\n\n    Устаревают слова, обозначающие должности и профессии прошлого: камергер, городовой, водовоз, старьёвщик; слова советского периода — райком, райсовет, комсомол, колхоз .\n\n    Некоторые устаревшие слова возвращаются в активное употребление: Дума, губернатор, сенатор .\n\nНепонятные слова и их толкования:\n\n    Камергер — придворный чин старшего ранга в царской России и некоторых монархических государствах .\n\n    Старьёвщик — человек, промышляющий старыми, подержанными вещами .\n\n    Райком — районный комитет .","9":"Слова, появившиеся в связи с освоением космоса:\nкосмонавт, космодром, астронавт, космонавтика, невесомость, орбита, спутник, скафандр, астероид, метеорит, луноход, гравитация, приземление, стыковка, центрифуга, звездолёт, чёрная дыра, шаттл, космический корабль, орбитальная станция .\n\nУстаревшие слова:\nзвездолёт, астролётчик, космолётчик, прилуниться, луноход, аэролит, космический челнок","10":"Задание: Докажите на примере устаревших слов и неологизмов, что русский язык живёт и развивается, что он, по словам Н. Гоголя, «живой, как сама жизнь».\n\nОтвет (доказательство):\n\nРусский язык действительно живой и постоянно меняется. Это видно на примере устаревших слов и неологизмов.\n\n1. Устаревшие слова (уходят из языка):\n\n    Историзмы — слова, обозначающие исчезнувшие предметы и явления: конка (лошадь, везущая повозку по рельсам), соха (орудие труда), дворовые (крепостные).\n\n    Архаизмы — слова, заменённые современными синонимами: очи — глаза, ланиты — щёки, чело — лоб, длань — ладонь.\n\n2. Неологизмы (появляются в языке):\n\n    Слова, связанные с новыми технологиями и реалиями: компьютер, офис, риелтор, дилер, имиджмейкер, электорат, инаугурация.\n\n    Слова, пришедшие из других языков при взаимодействии государств: прайс, консалтинг, маклер.\n\nВывод:\nОдни слова устаревают и выходят из активного употребления, другие — появляются и постепенно становятся привычными. Именно это доказывает, что русский язык не стоит на месте, а живёт и развивается вместе с обществом.","11":"Задание\n\nПодготовьтесь рассказать в классе о роли родного языка при общении в семье, в школе, в общественных местах, с друзьями и в других ситуациях.\nОтвет (пример рассказа)\n\nРодной язык — основа общения и культуры\n\nРодной язык играет огромную роль в жизни каждого человека. С его помощью мы выражаем мысли, чувства, желания и передаём информацию другим людям.\n\nВ семье язык — это главное средство связи между родителями и детьми. Через общение передаётся опыт, прививаются культурные ценности и традиции. Без языка невозможно полноценное воспитание и взаимопонимание.\n\nВ школе родной язык помогает понимать объяснения учителя, усваивать новый материал, развивать мышление, память и воображение. Он также формирует навыки общения в коллективе, учит вежливости и тактичности.\n\nС друзьями язык помогает налаживать доверительные отношения, выражать свои чувства и мысли, обсуждать общие интересы.\n\nВ общественных местах язык — это средство общения между незнакомыми людьми. С его помощью мы можем попросить о помощи или предложить её, сориентироваться в ситуации, понять, что происходит вокруг. Это даёт чувство безопасности и уверенности.\n\nПри общении с носителями других языков родной язык демонстрирует уникальность нашего народа и культуры. Он помогает сохранить национальную идентичность.\n\nТаким образом, родной язык — это не только средство общения, но и способ сохранения культурного наследия. Поэтому его так важно беречь и изучать.","12":"Задание: Составьте словосочетания по схемам «прил. + сущ.», «сущ. + сущ.», «глаг. + сущ.». Напишите несколько простых и сложных предложений на тему «Мой дом» или «Мой любимый уголок природы». Является ли написанное вами текстом? Докажите.\nСловосочетания\n\n«Прил. + сущ.»:\nуютная комната, старое кресло, любимый уголок, тёплый свет, родной дом.\n\n«Сущ. + сущ.»:\nуголок сада, свет в окне, стены дома, запах травы, шум листвы.\n\n«Глаг. + сущ.»:\nчитать книгу, отдыхать в кресле, смотреть в окно, слушать тишину, вспоминать детство.\nПростые предложения\n\n    Мой дом — самое любимое место на земле.\n\n    У окна стоит старое кресло.\n\n    Я люблю читать в тишине.\n\n    В саду растёт большая яблоня.\n\n    Вечером в комнате горит тёплый свет.\n\nСложные предложения\n\n    Когда наступает вечер, я сажусь в кресло и читаю книгу.\n\n    Мой любимый уголок природы — это берег реки, где мы часто отдыхаем летом.\n\n    Я люблю свой дом, потому что в нём живут самые близкие люди.\n\n    Если выглянет солнце, в саду станет светло и радостно.\n\nЯвляется ли написанное текстом?\n\nДа, это текст.\n\nДоказательство:\n\n    Тема единства — все предложения объединены общей темой («Мой дом» / «Мой любимый уголок природы»).\n\n    Смысловая связь — предложения дополняют друг друга, раскрывают тему с разных сторон.\n\n    Грамматическая связь — используются местоимения (мой, я), повторы, союзы (когда, потому что, если), единое время глаголов.\n\n    Композиция — есть начало (описание места), основная часть (детали, чувства) и концовка (вывод об отношении к дому).\n\n    Завершённость — текст передаёт законченную мысль.","13":"ересказ картины осени своими словами:\n\nОсенью листва с деревьев почти облетела, и сквозь редеющие верхушки видно синее небо. На опушке шумит ярко-жёлтая листва. Птиц не слышно. В тишине можно услышать, как треснет обломившийся сучок, а по веткам, мелькая хвостом, легко прыгает белка. Ель стала заметнее — она бережёт густую тень. Последний подосиновик сдвинул шляпу набекрень .\n\nСписанный текст с вставленными буквами:\n\nМеж редеющих верхушек\nПоказалась синева.\nЗашумела у опушек\nЯрко-жёлтая листва.\nПтиц не слышно.\nТреснет мелкий\nОбломившийся сучок,\nИ, хвостом мелькая, белка\nЛёгкий делает прыжок.\nСтала ель в лесу заметней —\nБережёт густую тень.\nПодосиновик последний\nСдвинул шляпу набекрень.\n\nСинтаксический разбор первого предложения:\n\n    Меж редеющих верхушек показалась синева.\n\n    Повествовательное, невосклицательное, простое, двусоставное, распространённое, неосложнённое, полное .\n\n    Грамматическая основа: синева показалась.\n\n    Второстепенные члены: показалась (где?) меж верхушек; верхушек (каких?) редеющих.\n\nУсловия выбора орфограмм после шипящих:\nСлово\tОрфограмма\tОбъяснение\nверхушек\tе после шипящей в суффиксе\tбезударная позиция — пишется е\nопушек\tе после шипящей в суффиксе\tбезударная позиция — пишется е\nярко-жёлтая\tё после шипящей в корне\tпод ударением, есть проверочное слово желтеть ; сложное прилагательное, обозначающее оттенок цвета, пишется через дефис\nсучок\tо после шипящей в суффиксе\tпод ударением в суффиксе существительного пишется о\nпрыжок\tо после шипящей в суффиксе\tпод ударением в суффиксе существительного пишется о\nбережёт\tё после шипящей в окончании глагола\tв окончаниях глаголов после шипящих всегда пишется ё\n\nДругие орфограммы:\n\n    показалась — проверяемая гласная в корне (покажется)\n\n    треснет — глагол 1-го спряжения (треснуть), окончание -ет\n\n    обломившийся — проверяемая гласная в корне (облом)\n\n    лёгкий — проверяемая согласная в корне (лёгок) ","14":"Заголовок: Листопад\n\nТема текста: Осенний листопад, изменения в природе с приходом осени .\n\nСписанный текст с вставленными буквами:\n\nНачался листопад. Листья падали дни и ночи. Они то косо летели по ветру, то отвесно ложились на сырую траву. Леса моросили дождём облетевшей листвы. Этот дождь шёл неделями. Только к концу сентября перелески обнажились, и сквозь чащу деревьев стала видна синяя даль сжатых полей.\n\nНераспространённое предложение:\n\nНачался листопад. (Только подлежащее и сказуемое, нет второстепенных членов.)\n\nГрамматические основы и характеристика предложений:\nПредложение\tГрамматическая основа\tХарактеристика\nНачался листопад.\tлистопад начался\tПовествовательное, невосклицательное, простое, двусоставное, полное, нераспространённое, неосложнённое\nЛистья падали дни и ночи.\tлистья падали\tПовествовательное, невосклицательное, простое, двусоставное, полное, распространённое, осложнено однородными обстоятельствами\nОни то косо летели по ветру, то отвесно ложились в сырую траву.\tони летели, ложились\tПовествовательное, невосклицательное, простое, двусоставное, полное, распространённое, осложнено однородными сказуемыми\nЛеса моросили дождём облетевшей листвы.\tлеса моросили\tПовествовательное, невосклицательное, простое, двусоставное, полное, распространённое, неосложнённое\nЭтот дождь шёл неделями.\tдождь шёл\tПовествовательное, невосклицательное, простое, двусоставное, полное, распространённое, неосложнённое\nТолько к концу сентября перелески обнажились, и сквозь чащу деревьев стала видна синяя даль сжатых полей.\t1) перелески обнажились; 2) даль стала видна\tПовествовательное, невосклицательное, сложносочинённое (союз и). 1) двусоставное, полное, распространённое, неосложнённое; 2) двусоставное, полное, распространённое, неосложнённое\n\nСхема сложносочинённого предложения: [— =], и [= —].\n\nВиды орфограмм в корнях слов:\n\n    Непроизносимые согласные: отвесно\n\n    Чередующиеся гласные в корне: ложились\n\n    Проверяемые безударные гласные: в траву, моросили, обнажились, видна\n\n    Гласные о и ё после шипящих в корне: шёл\n\n    Парные по глухости-звонкости согласные: перелески\n\n    Сочетания ча-ща: чащу\n\n    Разделительный мягкий знак: деревьев\n\n    Гласные и согласные в неизменяемых приставках: сжатых ","15":"Задание: Составьте из простых предложений, заключённых в скобки, сложные, употребляя подходящие по смыслу союзы и, а, но, что, чтобы, когда. Поставьте запятые. В составленных сложных предложениях подчеркните основы. Объясните написание выделенных букв.\n\n1. Наступил вечер. (Мы остановились на ночлег. Наша лодка причалила к берегу.)\n\nОтвет: Когда наша лодка причалила к берегу, мы остановились на ночлег.\n\n    Объяснение:\n    Наша — притяжательное местоимение, отвечает на вопрос чья? .\n    Причалила — приставка при- имеет значение приближения .\n\n2. Ветер утих. (В саду всё падали и падали листья. Шелест травы (не)прекращался.)\n\nОтвет: В саду всё падали и падали листья, и шелест травы не прекращался.\n\n    Объяснение:\n    Не с глаголами пишется раздельно .\n\n3. Взошла луна. (Всё вокруг осветилось. Ствол берёзки стал серебряным.)\n\nОтвет: Всё вокруг осветилось, а ствол берёзки стал серебряным.\n\n    Объяснение:\n    Серебряным — прилагательное-исключение: суффикс -ян- пишется с одной буквой н .\n\n4. На опушке есть малинник. (Лесник сказал. Мы взяли с собой бидоны и кружки.)\n\nОтвет: Лесник сказал, чтобы мы взяли с собой бидоны и кружки.\n\n    Объяснение:\n    Бидоны — словарное слово, написание нужно запомнить .\n\nГрамматические основы (подчеркнуть):\n\n    лодка причалила, мы остановились\n\n    листья падали, шелест не прекращался\n\n    всё осветилось, ствол стал\n\n    лесник сказал, мы взяли\n\nДополнительные разборы\n\nМорфологический разбор: Наша³\n\n    I. Наша — местоимение (чья?).\n\n    II. Н. ф. — наш. Пост. признаки: притяжательное. Непост. признаки: ед. ч., ж. р., И. п.\n\n    III. Лодка (чья?) наша — определение .\n\nМорфемный и словообразовательный разбор: малинник²\n\n    малинник ← малина + суффикс -ник- (суффиксальный способ) .","16":"Задание: Спишите, вставляя пропущенные буквы и правильно оформляя предложения с прямой речью. Укажите обращения. К какой лексической группе относятся слова под знаком *?\n\nТекст с ответами:\n\n    Могучий Олег головою поник и думает: «Что же гаданье?»\n\n    Князь тихо на череп коня наступил и молвил: «Спи, друг одинокий!» (обращение; проверочное слово — один)\n\n    Отпустил он рыбку золотую и сказал ей ласковое слово: «Твоего мне откупа не надо, ступай себе в синее море, гуляй там себе на просторе». (2-е склонение, предложный падеж)\n\n    «Где же вожатый?» — спросил я у Савельича. (проверочное слово — спросит)\n\n    «Здесь, ваше благородие», — отвечал мне голос сверху. (обращение)\n\n    «Ты мне этого не сказал», — заметил Пугачёв.\n\n    «Что ещё?» — вскричал Пугачёв, сверкнув огненными глазами. (проверочное слово — крик)\n\nОбращения:\n\n    друг одинокий\n\n    ваше благородие\n\nСлова под знаком * (лексическая группа):\n\nСлова вожатый и ваше благородие относятся к устаревшей лексике.\n\n    Вожатый — архаизм (в современном языке есть синоним — проводник) .\n\n    Ваше благородие — историзм (обращение к дворянам, которого сейчас не существует) .\n\nМорфологический разбор: Пугачёв³\n\n    Пугачёв — имя существительное (обозначает лицо, отвечает на вопрос кто?).\n\n    Начальная форма — Пугачёв.\n\n    Постоянные признаки: собственное, одушевлённое, мужской род, 2-е склонение.\n\n    Непостоянные признаки: единственное число, именительный падеж.\n\n    Синтаксическая роль: подлежащее (вскричал кто? — Пугачёв) .\n\nСинтаксический разбор: Князь тихо на череп коня наступил и молвил: «Спи, друг одинокий!»⁴\n\n    Повествовательное, невосклицательное, сложное с прямой речью, состоит из двух частей.\n\n    Слова автора: простое, двусоставное, распространённое, полное, осложнено однородными сказуемыми (наступил и молвил).\n\n    Прямая речь: простое, побудительное, восклицательное, односоставное (определённо-личное), нераспространённое, полное, осложнено обращением.\n\nСхема: А: «П!» ","17":"Задание: Диктант. Подчеркните однородные члены предложения. Устно объясните постановку знаков препинания между ними. Укажите слово, имеющее омоним.\n\nТекст:\n\n    Солнце уже выгл..нуло сзади из-за гор..да и тихо, без хлопот прин..лось за св..ю работу.\n\n    Кузнечики, сверчки, скрипачи и медведки затянули в траве свою скр..пучую, монотонную музыку.\n\n    Мальчик всматривался в знакомые места, а ненавис(?)ная бричка бежала мимо и оставляла всё позади.\n\n    Бричка бежит, а Егорушка вид..т всё одно и то же: небо, равнину, холмы.\n\n    Шесть косарей стоят рядом и взмахивают косами, а косы весело сверкают и в такт, все вместе издают звук: «Вжжи, вжжи!»\n\n    Зной и степная скука утомили его.\n\n(А. Чехов)\n\nСписанный текст с вставленными буквами:\n\n    Солнце уже выглянуло сзади из-за города и тихо, без хлопот принялось за свою работу.\n\n    Кузнечики, сверчки, скрипачи и медведки затянули в траве свою скрипучую, монотонную музыку.\n\n    Мальчик всматривался в знакомые места, а ненавистная бричка бежала мимо и оставляла всё позади.\n\n    Бричка бежит, а Егорушка видит всё одно и то же: небо, равнину, холмы.\n\n    Шесть косарей стоят рядом и взмахивают косами, а косы весело сверкают и в такт, все вместе издают звук: «Вжжи, вжжи!»\n\n    Зной и степная скука утомили его.\n\nОднородные члены и объяснение знаков препинания:\nПредложение\tОднородные члены\tОбъяснение\n1\tвыглянуло и принялось (сказуемые); тихо, без хлопот (обстоятельства)\tМежду сказуемыми одиночный союз и — запятая не ставится. Между обстоятельствами нет союзов — ставится запятая .\n2\tкузнечики, сверчки, скрипачи и медведки (подлежащие); скрипучую, монотонную (определения)\tПервые три подлежащих соединены бессоюзно — запятые. Четвёртое с и — без запятой. Между определениями нет союза — запятая .\n3\tбежала и оставляла (сказуемые)\tОдиночный союз и — запятая не ставится .\n4\tнебо, равнину, холмы (дополнения)\tОднородные дополнения без союзов — запятые. Перед ними обобщающее слово всё — двоеточие .\n5\tстоят и взмахивают (сказуемые); сверкают и издают (сказуемые)\tВ обеих частях одиночный союз и — запятые не ставятся .\n6\tзной и скука (подлежащие)\tОдиночный союз и — запятая не ставится .\n\nСлово, имеющее омоним: КОСА\n\n    Коса¹ — сельскохозяйственное орудие для срезания травы .\n\n    Коса² — причёска из переплетённых прядей волос .\n\n    Коса³ — протяжённая речная отмель, полоса земли у берега .","18":"Функциональная разновидность языка: Художественный стиль\n\nФункционально-смысловой тип речи: Описание (пейзаж)\n\nЗначения выделенных слов:\n\n    исчезал — употреблено в прямом значении («пропадал, переставал быть видимым»)\n\n        Синонимы: пропадать, испаряться, рассеиваться, уходить\n\n        Антонимы: появляться, возникать \n\n    растаяли — употреблено в переносном значении («постепенно исчезли, стали незаметными»)\n\n        Синонимы: исчезли, пропали, скрылись, улетели\n\n        Антонимы: появились, прилетели, примчались \n\nВиды орфограмм на месте скобок:\nСлово\tОрфограмма\nисчезал\tПроверяемая безударная гласная в корне (че́знуть)\nредкие\tПроверяемая согласная в корне (ре́док)\nу дороги\tБезударное падежное окончание существительного (1-е склонение, родительный падеж)\nмягким\tПроверяемая согласная в корне (мя́гок)\nрадостно\tНепроизносимая согласная в корне (ра́дость)\nВ них\tРаздельное написание предлога с местоимением\nЛасточки\tСочетание чк пишется без мягкого знака\nмутновато-голубого\tДефисное написание сложного прилагательного, обозначающего оттенок цвета\nпоявились\tПроверяемая безударная гласная в корне (я́вка)\nсверкнули\tПроверяемая безударная гласная в корне (посве́ркивать)\nрастаяли\tПроверяемая безударная гласная в корне (та́ять)\nвоспоминание\tПроверяемая безударная гласная в корне (помни́ть)\n\nПолный текст с вставленными буквами:\n\nТуман исчезал. Редкие кустики у дороги, облитые мягким солнечным светом, радостно топорщились зелёной листвой. В них пересвистывались птицы. Ласточки, должно быть, брачная пара, словно родившись из мутновато-голубого неба, появились над головами, сверкнули белыми грудками и умчались, растаяли, оставив о себе лишь воспоминание…","19":"Упражнение 19 (новое издание, 2022–2026, стр. 13)\n\nЗадание: Прочитайте. В каком значении употреблено слово вспыхнула? Спишите, вставляя пропущенные буквы, правильно оформляя предложения с прямой речью и диалог. Являются ли слова в рамке синонимами к слову налился? Можно ли их употребить в данном тексте? Почему?\n\nЗначение слова «вспыхнула»:\n\nВ переносном значении — «ярко покраснела, стала огненно-красной» (как будто загорелась).\n\nСписанный текст с вставленными буквами:\n\nВсё лето провалялся (проверочное — зава́л) в чулане (словарное слово) ящик с красками, паутиной оброс.\n\nНо когда наступила осень — вспыхнула по опушкам рябина (словарное слово), и налился медью кленовый (проверочное — клён) лист, — я этот ящик достал, закинул на плечо (проверочное — пле́чи) и побежал в лес.\n\nНа опушке остановился (словарное слово), глянул вокруг — и горячими показались (проверочное — ка́жется) гроздья (словарное слово) рябин (словарное слово). Красный цвет бил в глаза. А дрозды (проверочное — дрозд), перелетавшие (проверочное — перелёт) в рябинах (словарное слово), тоже казались (проверочное — ка́жется) тяжёлыми (от глагола тяжелеть). Так я и стал рисовать: рябины (словарное слово) и в них перелетают (проверочное — перелёт) красные тяжёлые (от глагола тяжелеть) дрозды.\n\n…Осень быстро кончилась. Ветер пообрывал (приставка *по-* неизменяемая) с деревьев листья, снег выпал.\n\nЗимним вечером пришёл (проверочное — ше́дший) ко мне дядя Зуй чаю попить…\n\nВыпил дядя Зуй стакан чаю, другой налил и снова на рисунок посмотрел (проверочное — смо́трит).\n\n— Да, — сказал он, — самый лучший лес — осенний.\n— Верно, — сказал я. — Что может быть лучше?\n— Ещё бы! Идёшь, а под ногами листья шуршат. Что же может быть лучше?\n\n«Ну что же может быть лучше? — думал я. — Что может быть лучше осеннего леса? Разве только весенний…»\n\nСлова в рамке — синонимы к слову «налился»?\n\nДа, но только в одном из значений.\n\nСлово налился в тексте употреблено в значении «наполнился, пропитался чем-либо» — налился медью (то есть лист стал медно-красным, как будто наполнился медью).\n\nСлова в рамке (например, налился, наполнился, переполнился) могут быть синонимами к налился в значении «наполнился жидкостью» (например, налился соком).\n\nНо в данном тексте их употребить нельзя, потому что здесь налился медью — это метафора, устойчивое образное выражение. Оно означает не «наполнился жидкостью», а «приобрёл медно-красный цвет». Слова в рамке этого оттенка значения не передают .\n\nОрфограммы, объяснение:\nСлово\tОрфограмма\nпровалялся\tпроверяемая безударная гласная в корне (зава́л)\nчулане\tсловарное слово\nрябина\tсловарное слово\nкленовый\tпроверяемая безударная гласная (клён)\nплечо\tпроверяемая безударная гласная (пле́чи)\nостановился\tсловарное слово\nпоказались\tпроверяемая безударная гласная (ка́жется)\nгроздья\tсловарное слово\nдрозды\tпроверяемая согласная (дрозд)\nперелетавшие\tпроверяемая безударная гласная (перелёт)\nказались\tпроверяемая безударная гласная (ка́жется)\nтяжёлыми\tот глагола тяжелеть\nпообрывал\tприставка *по-* неизменяемая\nпришёл\tпроверяемая безударная гласная (ше́дший)\nпосмотрел\tпроверяемая безударная гласная (смо́трит)","20":"Упражнение 20 (новое издание, 2022–2026, стр. 14)\n\nЗадание: Прочитайте отрывок из рассказа А. П. Чехова «Хамелеон». Как вы думаете, почему рассказ так называется? Найдите в тексте устаревшие слова. С какой целью автор использует их в речи? Спишите, расставляя пропущенные знаки препинания и вставляя пропущенные буквы.\n\nПочему рассказ называется «Хамелеон»:\n\nРассказ назван «Хамелеон» потому, что его главный герой, полицейский надзиратель Очумелов, постоянно меняет своё мнение и поведение в зависимости от обстоятельств — как хамелеон меняет цвет кожи. Сначала он готов уничтожить собаку, укусившую Хрюкина, но как только слышит, что собака, возможно, принадлежит генералу Жигалову, сразу меняет тон и обвиняет уже самого Хрюкина. Такое приспособленчество, угодничество и беспринципность и высмеивает Чехов .\n\nУстаревшие слова в тексте:\n\n    Городовой — низший чин городской полиции в дореволюционной России (историзм)\n\n    Мировой (судья) — судья, разбиравший мелкие дела (историзм)\n\n    Надзиратель — должностное лицо в полиции (историзм)\n\n    Харя — грубое просторечное слово, обозначающее лицо (архаизм)\n\n    Ежели — устаревший союз, равный современному если (архаизм)\n\n    Иуда — предатель (архаизм, библейское имя)\n\n    Чёрт — бранное слово (архаизм в данном контексте)\n\n    Цигарка — папироса, самокрутка (просторечие)\n\n    Ежели — устаревший союз\n\n    Пострадавший — в значении «потерпевший» (устаревшее употребление)\n\nЦель использования устаревших слов:\nАвтор использует их для создания исторического колорита эпохи, а также для речевой характеристики персонажей — они подчёркивают их принадлежность к определённой среде, их невежество и грубость .\n\nСписанный текст с расставленными знаками препинания и вставленными буквами:\n\nЧерез базарную площадь идёт полицейский надзиратель Очумелов в новой шинели и с узелком в руке. За ним шагает рыжий городовой с решетом, доверху наполненным конфискованным крыжовником. Кругом тишина… На площади ни души… Открытые двери лавок и кабаков глядят на свет божий уныло, как голодные пасти; около них нет даже нищих.\n\n— Так ты кусаться, окаянная? — слышит вдруг Очумелов. — Ребята, не пущай её! Нынче запрещено кусаться! Держи! А… а!\n\nСлышен собачий визг. Очумелов глядит в сторону и видит: из дровяного склада купца Пичугина, прыгая на трёх ногах и оглядываясь, бежит собака. За ней гонится человек в ситцевой крахмальной рубахе и расстёгнутой жилетке. Он бежит за ней и, подавшись туловищем вперёд, падает на землю и хватает собаку за задние лапы. Слышен вторично собачий визг и крик: «Не пущай!» Из лавок высовываются сонные физиономии, и скоро около дровяного склада, словно из земли выросши, собирается толпа.\n\n— Братцы, не оставьте! — говорит человек в ситцевой рубахе, поднимая вверх окровавленный палец. — Я шёл себе, никого не трогал… Хожу, значит, насчёт дров… вдруг эта подлая ни с того ни с сего за палец… Вы меня извините, я человек, который работающий… Работа у меня мелкая. Пущай мне заплатят, потому — я этим пальцем, может, неделю не пошевельну… Это, значит, не по закону, чтоб тварь кусалась. Ежели каждый будет кусаться, то лучше и не жить на свете…\n\n— Гм!.. Хорошо… — говорит Очумелов деловым тоном, кашляя и шевеля бровями. — Хорошо… Чья собака? Я этого так не оставлю. Я покажу вам, как собак распускать! Пора обратить внимание на подобных господ, не желающих подчиняться постановлениям! Как оштрафуют его, мерзавца, так он узнает у меня, что значит собака и прочий бродячий скот! Я ему покажу кузькину мать!..\n\n— А может быть, и генеральская… — говорит городовой. — У генерала Жигалова в последнее время таких собак не было.\n\n— Гм!.. Убери палец-то, дурак! — говорит Очумелов, оборачиваясь к Хрюкину. — Ты, болван, не туда глядишь!..\n\nЗнаки препинания при прямой речи:\nСхема\tПример\nА: «П!»\tОчумелов говорит: «Как оштрафуют его!»\n«П?» — а.\t«Так ты кусаться, окаянная?» — слышит вдруг Очумелов.\nА: «П…»\tОн говорит: «Это, значит, не по закону…»\n«П, — а. — П.»\t«Вы меня извините, — говорит человек, — я человек работающий…»","21":"Упражнение 21 (новое издание, 2022–2026, стр. 14)\n\nЗадание: Назовите по три специальных слова (термина), с которыми вы познакомились на уроках русского языка, литературы, физики, математики, биологии. Составьте два сложных предложения с любыми из названных слов.\n\nТермины по предметам:\nПредмет\tТермины\nРусский язык\tлексика, синоним, предложение\nЛитература\tповесть, жанр, олицетворение\nФизика\tмасса, тяготение, эксперимент\nМатематика\tсложение, теорема, уравнение\nБиология\tклетка, фотосинтез, млекопитающие\n\nСложные предложения:\n\n    Русский язык — живой организм, и его лексика постоянно обновляется.\n\n    Мне нравится решать уравнения, поэтому я часто выполняю дополнительные задания по математике.","22":"Задание\n\nСоставьте словарик-памятку из пяти-семи специальных слов (терминов) по любому школьному предмету. Запишите толкования этих слов. Какой словарь вы использовали как образец? Обменяйтесь словариками с товарищем. Если нужно, отредактируйте его работу.\nОтвет (пример по русскому языку)\n\nСловарик-памятка по русскому языку\n\n    Синонимы — слова одной части речи, близкие по значению, но отличающиеся в написании и произношении.\n\n    Антонимы — слова одной части речи, имеющие противоположные значения.\n\n    Омонимы — слова, которые звучат и пишутся одинаково, но имеют разное значение.\n\n    Паронимы — однокоренные слова одной части речи, которые отличаются морфемным составом (приставками или суффиксами), оттенками лексического значения и лексической сочетаемостью.\n\n    Фразеологизм — устойчивое словосочетание в переносном значении.\n\nСловарь-образец: толковый словарь.\nДополнительные варианты (для обмена с товарищем)\n\nПо литературе:\n\n    Метафора — скрытое сравнение, перенос значения по сходству.\n\n    Эпитет — образное определение, подчёркивающее свойство предмета.\n\n    Гипербола — художественное преувеличение.\n\n    Олицетворение — наделение неживых предметов свойствами живых.\n\n    Композиция — построение художественного произведения.\n\nПо математике:\n\n    Теорема — утверждение, требующее доказательства.\n\n    Аксиома — утверждение, принимаемое без доказательства.\n\n    Уравнение — равенство, содержащее неизвестную величину.\n\n    Функция — зависимость одной величины от другой.\n\n    График — множество точек, изображающих зависимость.\n\nКак редактировать работу товарища\n\nПри проверке чужого словарика обратите внимание на:\n\n    Точность толкований — соответствуют ли определения научным понятиям.\n\n    Полноту — все ли слова объяснены, нет ли пропусков.\n\n    Ясность — понятны ли формулировки для одноклассника.","23":"Фразеологизмы и их значения:\nФразеологизм\tЗначение\nв ступе воду толочь\tзаниматься бесполезным делом, попусту тратить время\nдержать в чёрном теле\tстрого обращаться с кем-либо, не давать поблажек\nне снимать узды\tне давать свободы, держать в подчинении\nдать поблажку\tпроявить снисхождение, позволить что-то\nсорвать последнюю рубашку\tразорить, лишить последнего\n\nОрфограммы в корнях слов:\nСлово\tОрфограмма\tПроверка / правило\nпозволять\tпроверяемая безударная гласная\tпозво́лит\nтолочь\tпроверяемая безударная гласная\tто́лк\nобязана\tпроверяемая безударная гласная\tобя́зан\nтрудиться\tпроверяемая безударная гласная\tтру́д\nгони\tпроверяемая безударная гласная\tго́нит\nтащи\tпроверяемая безударная гласная\tта́щит\nпо пустырю\tпроверяемая безударная гласная\tпу́стошь\nбурелому\tсоединительная гласная о\tпосле твёрдого согласного\nсугроб\tпроверяемая согласная\tсугро́бы\nухаб\tпроверяемая согласная\tуха́бы\nразрешай\tпроверяемая безударная гласная\tразре́шит\nпостели\tпроверяемая безударная гласная\tпосте́ль\nзвезды\tпроверяемая безударная гласная\tзвёзды\nлентяйку\tпроверяемая безударная гласная\tле́нь\nдать\tпроверяемая безударная гласная\tда́м\nвздумаешь\tпроверяемая безударная гласная\tвзду́мать\nосвобождая\tпроверяемая безударная гласная\tсвобо́да\nсорвёт\tпроверяемая безударная гласная\tсорва́ть\nхватай\tпроверяемая безударная гласная\tхва́тит\nдотемна\tпроверяемая безударная гласная\tтёмный\n\nОрфограммы в окончаниях слов:\nСлово\tОрфограмма\tПравило\nлениться\t-ться в неопределённой форме\tчто делать? — ться\nтрудиться\t-ться в неопределённой форме\tчто делать? — ться\nтолочь\t-чь в неопределённой форме\tчто делать? — чь\nобязана\t-а в кратком прилагательном\tженский род, единственное число\nгони\t-и в повелительном наклонении\t2-е лицо, единственное число\nтащи\t-и в повелительном наклонении\t2-е лицо, единственное число\nне разрешай\t-ай в повелительном наклонении\t2-е лицо, единственное число\nдержать\t-ать в неопределённой форме\tчто делать? — ать\nне снимай\t-ай в повелительном наклонении\t2-е лицо, единственное число\nвздумаешь\t-ешь в глаголе I спряжения\tчто сделаешь? — вздумать, I спр.\nсорвёт\t-ёт в глаголе I спряжения\tчто сделает? — сорвать, I спр.\nхватай\t-ай в повелительном наклонении\t2-е лицо, единственное число\nмучай\t-ай в повелительном наклонении\t2-е лицо, единственное число\nучись\t-ись в возвратном глаголе\tчто делай? — учись\n\nЧтение с интонацией побуждения, призыва:\n\nСтихотворение нужно читать громко, энергично, с повелительной интонацией. Каждая строфа содержит призыв, требование, наставление. Голос должен звучать уверенно, настойчиво, особенно в строках:\n\n    «Не позволяй душе лениться!»\n\n    «Гони её от дома к дому…»\n\n    «Держи лентяйку в чёрном теле…»\n\n    «А ты хватай её за плечи…»","24":"Упражнение 24 (новое издание, 2022–2026, стр. 15)\n\nЗадание: Размещённый в левом столбце фрагмент замените таким вариантом, который приемлем в официально-деловом тексте. Укажите, в каком жанре официально-делового стиля используется такая языковая конструкция.\n\nИсходный текст (левый столбец):\n\n    Я, Кира Леонова, очень хочу заниматься в театральной студии, умоляю: примите меня!\n\n    Пожалуйста, прошу вас, обязательно выключите все приборчики перед уходом из лаборатории.\n\n    Кто оставил включёнными приборы? На чьей совести перерасход электроэнергии? Разобраться! Наказать недотёпу!\n\n    Пусть Яше Иванову отдадут мой читательский билет. Семён Соколов.\n\n    Рассказ о моей жизни будет коротким. Зовут меня Люсей Петровой, я из Орла. Там я появилась на свет за час до Нового 2014 года, на радость мамочке (малышня в детском саду называет её тёткой Шурой) и папочке (его зовут Лёшей, он крутит баранку). Сейчас я учусь уже в 7 классе.\n\n    Вадик, зачем тебе нужна справка? Что, в спортшколе сомневаются, что Громов учится в 7 «А» 145-й школы?\n\nОтвет\n\nОфициально-деловые варианты (правый столбец):\nИсходный фрагмент\tОфициально-деловой вариант\tЖанр\nЯ, Кира Леонова, очень хочу заниматься в театральной студии, умоляю: примите меня!\tПрошу зачислить меня, Леонову Киру, в театральную студию.\tЗаявление\nПожалуйста, прошу вас, обязательно выключите все приборчики перед уходом из лаборатории.\tПрошу выключать все приборы перед уходом из лаборатории.\tИнструкция / объявление\nКто оставил включёнными приборы? На чьей совести перерасход электроэнергии? Разобраться! Наказать недотёпу!\tПрошу разобраться, кто оставил приборы включёнными, и принять меры по факту перерасхода электроэнергии.\tСлужебная записка / докладная\nПусть Яше Иванову отдадут мой читательский билет. Семён Соколов.\tПрошу вернуть читательский билет на имя Семёна Соколова Яше Иванову.\tЗаявление / запрос\nРассказ о моей жизни будет коротким. Зовут меня Люсей Петровой, я из Орла. Там я появилась на свет за час до Нового 2014 года, на радость мамочке (малышня в детском саду называет её тёткой Шурой) и папочке (его зовут Лёшей, он крутит баранку). Сейчас я учусь уже в 7 классе.\tМеня зовут Люся Петрова, я родилась в Орле 31 декабря 2013 года. В настоящее время я учусь в 7 классе.\tАвтобиография / резюме\nВадик, зачем тебе нужна справка? Что, в спортшколе сомневаются, что Громов учится в 7 «А» 145-й школы?\tПрошу уточнить цель получения справки о том, что Громов обучается в 7 «А» классе 145-й школы.\tЗапрос / служебное письмо\n\nОбъяснение:\n\nВ официально-деловом стиле недопустимы:\n\n    Эмоционально-экспрессивная лексика (умоляю, приборчики, недотёпа, малышня, тётка Шура, крутит баранку);\n\n    Разговорные и просторечные выражения (Вадик, зачем тебе нужна справка?, Что, сомневаются?);\n\n    Риторические вопросы и восклицания (Кто оставил? На чьей совести? Разобраться! Наказать!).\n\nВместо них используются:\n\n    Стандартные клише: прошу зачислить, прошу вернуть, прошу уточнить, прошу разобраться;\n\n    Нейтральная лексика: приборы (а не приборчики), учиться (а не крутить баранку);\n\n    Официальные наименования: читательский билет на имя…, обучается в 7 «А» классе;\n\n    Чёткая структура и однозначность формулировок.","25":"Упражнение 25 (новое издание, 2022–2026, стр. 15)\n\nЗадание: Прочитайте и озаглавьте текст. На какую тему написан текст? Отразили ли вы её в заголовке? Какую информацию вы назвали бы главной, а какую — второстепенной? Составьте назывной план и по нему перескажите текст.\n\nТекст:\n\nСоздание словарей — задача особой отрасли науки о языке — лексикографии (от греческих слов lexis — слово и grapho — пишу). Лексикография — это теория и практика составления словарей. Создание словарей — дело трудное, кропотливое, долгое. Над своим «Толковым словарём живого великорусского языка» Владимир Иванович Даль, современник Пушкина, трудился всю жизнь.\n\nОбычно целые коллективы составителей работают над созданием словаря многие годы. Например, академический словарь современного русского языка в семнадцати томах выходил с 1950 по 1965 год.\n\nВ наше время помощь лексикографам оказывают компьютеры: задействуя нужные программы, легко находить, копировать и размножать необходимый материал. Но основная творческая работа остаётся, конечно, людям.\n\nМожно использовать компьютер и для изучения языка. Например, можно узнать, какие слова в этом языке являются наиболее употребительными. Для этого в память компьютера вводятся тексты книг, газет, записей разговоров на данном языке. Компьютер подсчитывает, сколько раз встречается каждое слово, и определяет, какие слова используются наиболее часто. Их и надо изучать в первую очередь.\n\nВ настоящее время существуют компьютерные программы, которые переводят несложную устную речь на одном языке в письменный текст на другом языке. Такие программы можно загрузить в мобильный телефон и пользоваться ими.\nОтвет\n\nЗаголовок: «Лексикография. Современные технологии в составлении словарей»\n\nТема текста: Использование компьютерных технологий при составлении словарей .\n\nОтражена ли тема в заголовке: Да, тема отражена .\n\nГлавная информация:\n\n    Лексикография — теория и практика составления словарей, продолжительный и трудоёмкий процесс .\n\n    Компьютеры помогают в составлении словарей, в определении наиболее часто употребляющихся слов, в переводе текстов с одного языка на другой .\n\nВторостепенная информация:\n\n    Словарь Владимира Даля .\n\n    Время работы над академическим словарём современного русского языка .\n\nНазывной план:\n\n    Лексикография как наука.\n\n    Академический словарь современного русского языка в 17 томах.\n\n    Помощь компьютеров в поиске, копировании и размножении материалов.\n\n    Использование компьютеров в изучении языка.\n\n    Использование компьютерных технологий для перевода текстов с одного языка на другой .\n\nПересказ по плану:\n\n1. Лексикография как наука.\nЛексикография — это особая отрасль науки о языке, которая занимается теорией и практикой составления словарей. Создание словарей — дело трудное, кропотливое и долгое. Например, Владимир Иванович Даль, современник Пушкина, трудился над своим «Толковым словарём живого великорусского языка» всю жизнь .\n\n2. Академический словарь современного русского языка в 17 томах.\nОбычно над созданием словаря работают целые коллективы составителей. Академический словарь современного русского языка в семнадцати томах выходил с 1950 по 1965 год .\n\n3. Помощь компьютеров в поиске, копировании и размножении материалов.\nВ наше время лексикографам помогают компьютеры. С помощью нужных программ легко находить, копировать и размножать необходимый материал. Но основная творческая работа всё равно остаётся людям .\n\n4. Использование компьютеров в изучении языка.\nКомпьютер можно использовать и для изучения языка. Например, чтобы узнать, какие слова являются наиболее употребительными, в память компьютера вводятся тексты книг, газет, записей разговоров. Компьютер подсчитывает, сколько раз встречается каждое слово, и определяет самые частые. Их и надо изучать в первую очередь .\n\n5. Использование компьютерных технологий для перевода текстов.\nСуществуют компьютерные программы, которые переводят несложную устную речь с одного языка на письменный текст другого языка. Такие программы можно загрузить в мобильный телефон и пользоваться ими .\n\nМорфемный и словообразовательный разбор:\n\nТрудился — трудил + ся; трудиться ← труд (суффиксально-постфиксальный способ) .\n\nПунктуационный разбор:\nЛексикография — это теория и практика составления словарей.\nТире между подлежащим и сказуемым, выраженными существительными в именительном падеже .","26":"Упражнение 26 (новое издание, 2022–2026)\n\nЗадание: Вспомните изученные средства художественной выразительности (тропы), охарактеризуйте их. Познакомьтесь с ещё одним тропом. Найдите литоты в стихотворных строках.\n\nИзученные средства выразительности (тропы):\nТроп\tОпределение\nЭпитет\tОбразное, художественное определение, придающее предмету или явлению выразительность, поэтическую яркость\nМетафора\tСкрытое сравнение, слово в переносном значении, уподобление одного явления другому\nОлицетворение\tНаделение неживых предметов качествами, действиями или чувствами человека\nСравнение\tОбразное выражение, в котором одно явление уподобляется другому на основании общего признака\nГипербола\tХудожественное преувеличение\n\nНовый троп — ЛИТОТА:\n\nЛитота — это средство художественной выразительности, троп, обозначающий преуменьшение или смягчение свойств, признаков, значений изображаемых предметов или явлений .\n\nПримеры литоты:\n\n    Преуменьшение: жизнь бабочки — один миг, ткань легче пуха\n\n    Смягчение: неплохо (вместо хорошо), не возражаю (вместо соглашаюсь), небедный (вместо богатый), неглупый (вместо умный) \n\nЛитоты в стихотворных строках:\n\n1. Б. Пастернак:\n\n    Тени вечера волоса тоньше\n    За деревьями тянутся вдаль.\n\nЛитота: волоса тоньше — преуменьшение толщины теней .\n\n2. К. Аксаков:\n\n    Мой Лизочек так уж мал,\n    Так уж мал,\n    Что из листика сирени\n    Сделал зонтик он для тени\n    И гулял.\n    ...\n    Что из крыльев комаришки\n    Сделал две себе манишки\n    И — в крахмал…\n\nЛитоты: из листика сирени сделал зонтик, из крыльев комаришки сделал манишки — преуменьшение размеров героя через создание несоразмерно маленьких предметов .","27":"1. Одни и те же буквы, обозначающие разные звуки:\nБуква\tПримеры\tРазные звуки\nо\tвода́ — водно́е\t[а] — [о]\nе\tнедви́жное — в душе́\t[и] — [э]\nд\tдревний — навсегда\t[д] — [т]\nз\tзвездочёт — звёзд\t[з] — [с]\nв\tвода — в глубине\t[в] — [в’]\n\n2. Особенность русской фонетики, объясняющая рифму:\n\nРифма вид — хранит возможна благодаря оглушению парных звонких согласных на конце слова.\n\nВ слове вид конечный звук [д] оглушается и произносится как [т]. В слове хранит конечный звук [т] остаётся [т]. Таким образом, оба слова заканчиваются на одинаковый звук [т], что и создаёт рифму .\n\n3. Средства выразительности, использованные автором:\nСредство\tПримеры\nСравнения\t«щука, как стрела»; «как сон столетний, божий храм»\nЭпитеты\t«вид смиренный и родной»; «великий звездочёт»; «былых времён»\nМетафоры\t«водное стекло»; «век протечёт»\n\n4. Фонетический разбор:\n\nЗвёзд [зв’о́ст] — 1 слог.\n\n    з [з] — согласный, звонкий парный, твёрдый парный;\n\n    в [в’] — согласный, звонкий парный, мягкий парный;\n\n    ё [о́] — гласный, ударный;\n\n    с [с] — согласный, глухой парный, твёрдый парный;\n\n    д [т] — согласный, глухой парный, твёрдый парный.\n\n5 букв, 5 звуков\n\nВремён [вр’иэм’о́н] — 2 слога.\n\n    в [в] — согласный, звонкий парный, твёрдый парный;\n\n    р [р’] — согласный, звонкий непарный (сонорный), мягкий парный;\n\n    е [иэ] — гласный, безударный;\n\n    м [м’] — согласный, звонкий непарный (сонорный), мягкий парный;\n\n    ё [о́] — гласный, ударный;\n\n    н [н] — согласный, звонкий непарный (сонорный), твёрдый парный.\n\n6 букв, 6 звуков","28":"Списанный текст с вставленными буквами и знаками препинания\n\nС ДОБРЫМ УТРОМ!\n\nЗадремали звёзды золотые,\nЗадрожало зеркало затона,\nБрезжит свет на заводи речные\nИ румянит сетку небосклона.\nУлыбнулись сонные берёзки,\nРастрепали шёлковые косы.\nШелестят зелёные серёжки,\nИ горят серебряные росы.\nУ плетня заросшая крапива\nОбрядилась ярким перламутром\nИ, качаясь, шепчет шаловливо:\n«С добрым утром!»\nСлова, употреблённые в переносном значении\n\nЗадремали (звёзды) — олицетворение.\nЗолотые (звёзды) — метафорический эпитет.\nЗеркало (затона) — метафора.\nРумянит (свет) — олицетворение.\nСетку (небосклона) — метафора.\nУлыбнулись (берёзки) — олицетворение.\nРастрепали (косы) — олицетворение.\nГорят (росы) — метафора.\nОбрядилась (крапива) — олицетворение.\nШепчет (крапива) — олицетворение.\nФонетический анализ\n\nЗвёзды [зв’о́зды] — 2 слога.\n\n    з [з] — согласный, звонкий парный, твёрдый парный;\n\n    в [в’] — согласный, звонкий парный, мягкий парный;\n\n    ё [о́] — гласный, ударный;\n\n    з [з] — согласный, звонкий парный, твёрдый парный;\n\n    д [д] — согласный, звонкий парный, твёрдый парный;\n\n    ы [ы] — гласный, безударный.\n\n6 букв, 6 звуков.\n\nСерёжки [с’ир’о́шки] — 3 слога.\n\n    с [с’] — согласный, глухой парный, мягкий парный;\n\n    е [и] — гласный, безударный;\n\n    р [р’] — согласный, звонкий непарный (сонорный), мягкий парный;\n\n    ё [о́] — гласный, ударный;\n\n    ж [ш] — согласный, глухой парный, твёрдый непарный;\n\n    к [к’] — согласный, глухой парный, мягкий парный;\n\n    и [и] — гласный, безударный.\n\n7 букв, 7 звуков.\n\nЯрким [й’а́рк’им] — 2 слога.\n\n    я [й’] — согласный, звонкий непарный (сонорный), мягкий непарный;\n\n    [а́] — гласный, ударный;\n\n    р [р] — согласный, звонкий непарный (сонорный), твёрдый парный;\n\n    к [к’] — согласный, глухой парный, мягкий парный;\n\n    и [и] — гласный, безударный;\n\n    м [м] — согласный, звонкий непарный (сонорный), твёрдый парный.\n\n5 букв, 6 звуков.\nПроверочные слова для вставленных орфограмм\nСлово\tПроверочное слово\nЗадремали\tдрёма\nЗадрожало\tдрожь\nБрезжит\tсловарное слово\nСетку\tсети\nБерёзки\tберёза\nРастрепали\tтреплет\nШелестят\tшелест\nСерёжки\tсерёжечка\nЗаросшая\tзарос\nШепчет\tшёпот\nШаловливо\tшалость\nСинтаксический разбор четвёртого предложения⁴\n\n    Улыбнулись сонные берёзки, растрепали шёлковые косы.\n\nХарактеристика: Повествовательное, невосклицательное, простое, двусоставное, распространённое, осложнено однородными сказуемыми.\n\nГрамматическая основа: берёзки улыбнулись, растрепали.\n\nСхема: [ — =, = ].","29":"Упражнение 29 (новое издание, 2022–2026, стр. 18)\n\nЗадание: Спишите пословицы, выделите орфограммы. Назовите виды орфограмм на месте пропусков и скобок. Составьте схему 6-го предложения. В каких ситуациях общения вы могли бы употребить эти выражения?\nСписанные пословицы\n\n    Не разгрызёшь ореха, так и не съешь ядра.\n\n    Необъяснённое не значит необъяснимое.\n\n    Забота не съела — скука одолела.\n\n    Не за то волка бьют, что сер, а за то, что овцу съел.\n\n    На работу с радостью, а с работы с гордостью.\n\n    Работы бояться — счастья не видать.\n\nВиды орфограмм\nОрфограмма\tПримеры\nРаздельное написание не с глаголами\tне съешь, не значит, не съела\nРазделительный твёрдый знак (ъ) после приставок\tсъешь, необъяснённое, необъяснимое, съел\nБезударные гласные в личных окончаниях глаголов\tзначит (II спряжение)\nРазделительный мягкий знак (ь)\tбьют, радостью, гордостью, счастья\nСочетания -тся и -ться на конце глаголов\tбояться (что делать?)\nСхема 6-го предложения\n\n    Работы бояться — счастья не видать.\n\nГрамматическая основа: бояться — не видать.\n\nСхема: [=] — [=].\n\n(Обе части — односоставные безличные/инфинитивные предложения, соединённые тире.)\nСитуации общения\nПословица\tКогда уместна\n1. Не разгрызёшь ореха, так и не съешь ядра\tКогда нужно доказать, что для результата необходим труд\n2. Необъяснённое не значит необъяснимое\tКогда что-то непонятно сейчас, но это не значит, что объяснить нельзя в принципе\n3. Забота не съела — скука одолела\tХарактеристика человека, который скучает, но не хочет заняться делом\n4. Не за то волка бьют, что сер, а за то, что овцу съел\tОбъяснение провинившемуся: осуждают не за качества, а за поступки\n5. На работу с радостью, а с работы с гордостью\tДевиз во время субботника или коллективного труда\n6. Работы бояться — счастья не видать\tМотивация ученика выполнить трудную или неинтересную работу\nМорфологический разбор: съешь³\n\nI. Съешь — глагол (обозначает действие, отвечает на вопрос что сделаешь?).\nII. Н. ф. — съесть. Пост. признаки: совершенный вид, переходный, невозвратный, I спряжение. Непост. признаки: изъявительное наклонение, будущее время, 2-е лицо, единственное число.\nIII. Синтаксическая роль: сказуемое.","30":"Упражнение 30 (новое издание, 2022–2026, стр. 19)\n\nЗадание: Прочитайте отрывки. Определите, к какой функциональной разновидности языка они относятся. Сравните, о чём говорится в каждом из них. Сжато, в двух-трёх предложениях, передайте содержание второго текста.\nОтвет\n\n1. Функциональные разновидности языка:\nТекст\tСтиль\tДоказательства\nПервый (Л. В. Щерба)\tНаучный\tТермины (звук речи, дифференцировать), книжная лексика, цитата лингвиста, отсутствие образных средств, изложение от 3-го лица, логичность и объективность\nВторой (В. Колесов)\tНаучно-популярный\tДоступное объяснение для широкого читателя, примеры из жизни (крик петуха, «Куд-куда?»), обращения к читателю (вы говорите, вы можете ошибиться), повествование от 1-го лица\n\n2. О чём говорится в каждом тексте:\n\n    В первом тексте — о звуках речи как мельчайших единицах языка и их способности дифференцировать (различать) слова и формы .\n\n    Во втором тексте — об отличии звуков речи от других звуков окружающего мира и о том, что звуки речи служат для различения слов, то есть имеют значение .\n\nОбщее: оба текста посвящены одной теме — звукам речи .\n\nРазличие: первый текст даёт научное определение, второй — объясняет доступно, с примерами.\n\n3. Сжатый пересказ второго текста (2–3 предложения):\n\n    Для человека мир состоит из множества звуков, но только звуки речи имеют значение. Они отличаются от крика петуха или шума машины тем, что их понимают и используют для различения слов. Если произнести звук неправильно, значение слова изменится, и вас могут понять неправильно .\n\n4. Лексический разбор слова «лингвист» (из сноски):\n\n    Лингвист — специалист по лингвистике, языковед .\n\n    Однозначное.\n\n    Прямое значение.\n\n    Синоним — языковед.\n\n    Заимствовано из французского языка.\n\n    Нейтральное .","31":"Упражнение 31 (новое издание, 2022–2026, стр. 20)\n\nЗадание: О или ё? Спишите, обозначьте орфограммы на месте пропусков. Составьте с любыми словами три-четыре словосочетания: «существительное + существительное», «прилагательное + существительное», «глагол + существительное».\n\nСлова: Ж..лтый, ч..рный, роднич..к, камыш..м, крюч..чек, мыш..нок, ш..пот, шапч..нка, влеч..т, печ..т, парч..вый, ш..л, щ..тка, ш..рох, крыж..вник, холщ..вый, кумач..вый, еж..вый, бумаж..нка, зайч..нок, в больш..м (доме), врач..м, капюш..н, свеч..й, прич..ска, за рубеж..м, с плащ..м, в чуж..м (саду).\nОтвет\n\nСписанные слова с обозначением орфограмм:\nСлово\tБуква\tОрфограмма\nжёлтый\tё\tВ корне под ударением, есть проверочное слово — желтеть\nчёрный\tё\tВ корне под ударением, есть проверочное слово — чернеть\nродничок\tо\tВ суффиксе существительного под ударением — о\nкамышом\tо\tВ окончании существительного под ударением — о\nкрючочек\tо\tВ суффиксе существительного под ударением — о\nмышонок\tо\tВ суффиксе существительного под ударением — о\nшёпот\tё\tВ корне под ударением, есть проверочное слово — шепчет\nшапчонка\tо\tВ суффиксе существительного под ударением — о\nвлечёт\tё\tВ окончании глагола (влечь, I спр.) — ё\nпечёт\tё\tВ окончании глагола (печь, I спр.) — ё\nпарчовый\tо\tВ суффиксе прилагательного под ударением — о\nшёл\tё\tВ корне под ударением, есть проверочное слово — шедший\nщётка\tё\tВ корне под ударением, есть проверочное слово — щетина\nшорох\tо\tСловарное слово (исключение), нет проверки с е\nкрыжовник\tо\tСловарное слово (исключение), нет проверки с е\nхолщовый\tо\tВ суффиксе прилагательного под ударением — о\nкумачовый\tо\tВ суффиксе прилагательного под ударением — о\nежовый\tо\tВ суффиксе прилагательного под ударением — о\nбумажонка\tо\tВ суффиксе существительного под ударением — о\nзайчонок\tо\tВ суффиксе существительного под ударением — о\nв большом (доме)\tо\tВ окончании прилагательного под ударением — о\nврачом\tо\tВ окончании существительного под ударением — о\nкапюшон\tо\tСловарное слово (исключение), нет проверки с е\nсвечой\tо\tВ окончании существительного под ударением — о\nпричёска\tё\tВ корне под ударением, есть проверочное слово — чесать\nза рубежом\tо\tВ окончании существительного под ударением — о\nс плащом\tо\tВ окончании существительного под ударением — о\nв чужом (саду)\tо\tВ окончании прилагательного под ударением — о\n\nСловосочетания:\n\n«Существительное + существительное»:\n\n    крючочек на леске\n\n    родничок у реки\n\n    с плащом на плече\n\n«Прилагательное + существительное»:\n\n    жёлтый круг\n\n    спелый крыжовник\n\n    парчовый узор\n\n«Глагол + существительное»:\n\n    шёл по улице\n\n    печёт пироги\n\n    влечёт к музыке\n\nПравило:\n\nО пишется под ударением в суффиксах и окончаниях существительных, прилагательных и наречий после шипящих (родничок, камышом, парчовый).\n\nЁ пишется под ударением в корнях слов, если можно подобрать проверочное слово с е (жёлтый — желтеть, шёпот — шепчет), а также в окончаниях глаголов (влечёт, печёт).\n\nИсключения: шорох, крыжовник, капюшон — пишутся с о без проверки.","32":"Ответ\n\nФонетические приёмы в отрывке:\n\n    Звукопись (аллитерация и ассонанс):\n        Аллитерация (повторение согласных звуков): поэт повторяет шипящий звук [ш] (в сочетаниях «наших», «ушки», «макушке», «пушки», «верхушки»), а также твёрдые и чёткие звуки [т], [к], [р], [д] («тут как тут», «забил заряд в пушку туго»).\n        Ассонанс (повторение гласных звуков): многократный повтор гласного звука [у] («у», «ушки», «макушке», «чуть», «утро», «пушки», «верхушки», «французы», «тут», «туго», «думал», «угощу», «друга»).\n\n    С какой целью используются эти звуки:\n        Повтор шипящего звука [ш] передаёт шёпот, шорох, напряжённую тишину раннего утра и предельную настороженность солдат, которые чутко вслушиваются в предрассветную тишину.\n        Повтор гласного звука [у] усиливает ощущение тревоги, скрытого нарастающего гула перед сражением.\n        Чёткие согласные [т], [к], [р] передают быстроту, решительность движений и звуки подготовки орудий к выстрелу.\n\nФонетический разбор слова (цифра 1):\n\nугощу́¹ — 3 слога (у-го-щу), ударение падает на 3-й слог.\n\n    у — [у] — гласный, безударный.\n    г — [г] — согласный, звонкий парный, твёрдый парный.\n    о — [а] — гласный, безударный.\n    щ — [щ’] — согласный, глухой непарный, мягкий непарный (долгий).\n    у — [у́] — гласный, ударный.\n\n6 букв, 6 звуков.\nОбъяснение\n\n    Аллитерация — это литературный приём, при котором повторяются одинаковые или похожие согласные звуки для создания звукового образа (например, шуршания, грохота, звона).\n    Ассонанс — это повторение гласных звуков в поэтической речи для придания тексту особой напевности и эмоциональной окраски.\n    Фразеологизм «ушки на макушке» благодаря звуковому строю (у-а-и, у-и, а-а-у-э) звучит легко, живо и разговорно, отражая готовность и бодрость духа русских воинов.\n\n","33":"Ответ к упражнению 33\n1. Заглавие текста\n\n    «Заполярный мёд» (авторское название) или «Чудо северного мёда», «Человек и природа».\n\n2. Вопросный план\n\n    Откуда на столе автора появилось это душистое и целебное вещество?\n    Каковы заслуги человека в получении заполярного мёда?\n    Почему обильно цветущей тундре так не хватало пчёл?\n    В чём заключается польза и привлекательность открытия северного мёда?\n    Что соединяет человека и природу древним союзом?\n\n3. Основные мысли текста\n\n    Человек может вмешиваться в жизнь природы созидательно и во благо: привезя пчёл за полярный круг, люди помогли растениям тундры опыляться, получив взамен богатый урожай мёда без ущерба для природы.\n    Мёд на столе — это результат совместного гармоничного труда природы (солнца, цветов, пчёл) и человека.\n    В мире существуют первозданные ценности (хлеб, мёд), которые неразрывно соединяют человека с солнцем и родной природой.\n\n4. Как автор описывает мёд?\n\nАвтор описывает мёд как «душистое, сладкое, ароматное и целебное вещество», которое «играет отсветами» в хрустальных вазочках и «светится... на столе». Для автора мёд — это овеществлённый солнечный свет и символ природного изобилия.\n5. О каком древнем союзе говорит автор?\n\nАвтор говорит о гармоничном, вечном союзе природы и человека, в основе которого лежит общее созидательное добро и взаимосвязь: солнце даёт жизнь и тепло, земля и растения — нектар и плоды, животные и люди — труд и заботу.\nДополнительно: фонетический разбор слов с цифрой ¹\n\n    мёд¹ — [м’от], 1 слог:\n        м — [м’] — согласный, звонкий непарный (сонорный), мягкий парный;\n        ё — [о] — гласный, ударный;\n        д — [т] — согласный, глухой парный, твёрдый парный.\n        (3 буквы, 3 звука)\n\n    цве-ты́¹ — [цв’иты́], 2 слога:\n        ц — [ц] — согласный, глухой непарный, твёрдый непарный;\n        в — [в’] — согласный, звонкий парный, мягкий парный;\n        е — [и] — гласный, безударный;\n        т — [т] — согласный, глухой парный, твёрдый парный;\n        ы — [ы] — гласный, ударный.\n        (5 букв, 5 звуков)\n\n    пчё-лы¹ — [пч’о́лы], 2 слога:\n        п — [п] — согласный, глухой парный, твёрдый парный;\n        ч — [ч’] — согласный, глухой непарный, мягкий непарный;\n        ё — [о] — гласный, ударный;\n        л — [л] — согласный, звонкий непарный (сонорный), твёрдый парный;\n        ы — [ы] — гласный, безударный.\n        (5 букв, 5 звуков)\n\n    всем¹ — [фс’эм], 1 слог:\n        в — [ф] — согласный, глухой парный, твёрдый парный;\n        с — [с’] — согласный, глухой парный, мягкий парный;\n        е — [э] — гласный, ударный;\n        м — [м] — согласный, звонкий непарный (сонорный), твёрдый парный.\n        (4 буквы, 4 звука)\n\nПояснение к выполнению\n\n    Вопросный план строится путём постановки ключевого вопроса к каждому смысловому фрагменту (микротеме) текста.\n    Анализ содержания: Михаил Пришвин — мастер описания природы. Он показывает, что природа и человек не противостоят друг другу, а дополняют один другого, если человек действует с любовью и уважением к окружающему миру.\n\n","34":"Итоговый ответ\n1. Списывание слов с вставленными буквами и морфемный разбор\n\nМорфемы с пропущенными буквами выделены отдельно в описании разбора.\n\n    Обраста́ют\n        Разбор по составу: приставка об-, корень -раст- (пропущена буква а), суффикс -а-, окончание -ют.\n        Основа слова: обраста-.\n\n    Приложи́ли\n        Разбор по составу: приставка при-, корень -лож-, суффикс -и-, суффикс прошедшего времени -л-, окончание -и.\n        Основа слова: приложи- (формообразующий суффикс -л- в основу не входит).\n\n    Безо́блачным\n        Разбор по составу: приставка без-, корень -облач-, суффикс -н-, окончание -ым.\n        Основа слова: безоблачн-.\n\n    Прикоснётся\n        Разбор по составу: приставка при-, корень -кос-, суффикс -н-, окончание -ёт, постфикс -ся.\n        Основа слова: прикосн...ся.\n\n    Нагора́ет\n        Разбор по составу: приставка на-, корень -гор- (пропущена буква о), суффикс -а-, окончание -ет.\n        Основа слова: нагора-.\n\n    Тростнико́вые\n        Разбор по составу: корень -трост- (пропущена буква т), суффикс -ник-, суффикс -ов-, окончание -ые.\n        Основа слова: тростников-.\n\n    Поглоща́ет\n        Разбор по составу: приставка по-, корень -глощ- (пропущена буква о), суффикс -а-, окончание -ет.\n        Основа слова: поглоща-.\n\n2. Сложные предложения со словами из упражнения\n\n    Мы с удивлением заметили, как старые пни на лесной поляне постепенно обрастают мягким бархатным мхом. (Сложноподчинённое предложение)\n    Когда первый утренний луч прикоснётся к верхушкам сосен, весь лес наполнится звонкими птичьими голосами. (Сложноподчинённое предложение)\n    Около озера шумели густые тростниковые заросли, и лёгкий вечерний ветерок гнал по воде мелкую рябь. (Сложносочинённое предложение)\n\nОбъяснение орфограмм\n\n    Обрастают — орфограмма в корне -раст-/-ращ-/-рос-. Буква а пишется перед сочетанием согласных ст (исключения: росток, ростовщик, Ростов, Ростислав, отрасль).\n    Нагорает — орфограмма в корне с чередованием -гар-/-гор-. В безударном положении пишется буква о (под ударением — а: нага́р, зага́р).\n    Тростниковые — орфограмма в корне (непроизносимая согласная т). Проверочное слово — трость.\n    Поглощает — безударная гласная в корне слова, проверяемая ударением. Проверочные слова: гло́тка, погло́тит.\n","35":"Заголовок\n\n«Торжественная тишина природы»\nСлова, образованные приставочным способом\n\n    запахло ← пахнуть\n\n    заскрипит ← скрипеть\n\n    переходит ← ходить\n\n    замелькали ← мелькать \n\nСлова, образованные суффиксальным способом\n\n    сыростью ← сырой\n\n    темнее ← тёмный\n\n    сгруппировались ← сгруппировать\n\n    каких-то ← какой\n\n    чудовищ ← чудо\n\n    страшно ← страшный\n\n    кто-то ← кто\n\n    сучок ← сук\n\n    сверкнула ← сверкать\n\n    живой ← жить\n\n    звёздочка ← звезда\n\n    огоньки ← огонь\n\n    торжественной ← торжество\n\n    тишины ← тихий \n\nСписанный текст с вставленными буквами и раскрытыми скобками\n\nЗапахло сыростью. Становилось всё темнее и темнее. Деревья сгруппировались в каких-то чудовищ, в лесу стало страшно: там кто-то вдруг заскрипит, точно одно из чудовищ переходит со своего места на другое, и сухой сучок, кажется, хрустит под его ногой.\n\nНа небе ярко сверкнула, как живой глаз, первая звёздочка, и в окнах домов замелькали огоньки.\n\nНастали минуты всеобщей торжественной тишины природы.\n\n(И. Гончаров. «Обломов»)\nОбъяснение орфограмм\nСлово\tОбъяснение\nстановилось\tсловарное слово\nдеревья\tразделительный ь перед я\nсгруппировались\tсловарное слово (группа)\nкаких-то / кто-то\tчастица -то с местоимениями пишется через дефис\nчудовищ\tсущ. 2 скл., м. р., на конце после шипящей ь не пишется\nзаскрипит\tпроверочное — скрип\nпереходит\tглагол 2 спр.\nсо своего\tпредлог с местоимением пишется раздельно\nсучок\tв суффиксе сущ. под ударением о\nкажется\tчто делает? — без ь\nнебе\tсущ. 2 скл., ср. р., ед. ч., П. п.\nсверкнула\tпроверочное — посвёркивать\nзвёздочка\tсочетание чк без ь\nминуты\tсловарное слово\nторжественной\tсловарное слово; суффикс -енн-\nприроды\tсловарное слово\nФонетический разбор: всё¹\n\nВсё [фс’о́] — 1 слог.\n\n    в [ф] — согласный, глухой парный, твёрдый парный;\n\n    с [с’] — согласный, глухой парный, мягкий парный;\n\n    ё [о́] — гласный, ударный.\n\n3 буквы, 3 звука\nСинтаксический разбор: Настали минуты всеобщей, торжественной тишины природы.⁴\n\nХарактеристика: Повествовательное, невосклицательное, простое, двусоставное, полное, распространённое, осложнено однородными определениями (всеобщей, торжественной).\n\nГрамматическая основа: минуты настали.\n\nСхема: [ = — О, О … ]. ","36":"Задание\n\nСпишите, обозначая условия выбора орфограмм в корне слова на месте пропусков. Какими по цели высказывания являются простые предложения?\nОтвет\n\nСписанный текст с вставленными буквами и объяснением орфограмм:\n\n    Ложился день на тёмный дол.\n\n        Чередование -лаг-/-лож-: перед ж пишется о .\n\n    Горит восток зарёю новой.\n\n        Горит — чередование -гор-/-гар-, без ударения пишется о .\n\n        Восток — словарное слово .\n\n        Зарёю — чередование -зор-/-зар-, без ударения пишется а .\n\n    Уж небо осенью дышало, уж реже солнышко блистало.\n\n        Блистало — чередование -блист-/-блест-, после корня стоит суффикс -а- .\n\n    Дни лета клонились к осени.\n\n        Клонились — чередование -клон-/-клан-, без ударения пишется о .\n\n    Вся комната янтарным блеском озарена.\n\n        Озарена — чередование -зар-/-зор-, без ударения пишется а .\n\n    Сквозь волнистые туманы пробирается луна.\n\n        Волнистые — проверочное слово волны .\n\n        Пробирается — чередование -бир-/-бер-, после корня стоит суффикс -а- .\n\n    Под голубыми небесами великолепными коврами, блестя на солнце, снег лежит.\n\n        Голубыми — проверочное слово голубь .\n\n        Небесами — проверочное слово небесный .\n\n        Великолепными — словарное слово .\n\n        Коврами — словарное слово .\n\n        Блестя — чередование -блист-/-блест-, после корня нет суффикса -а- .\n\n        Лежит — проверочное слово лёг .\n\n    Щиты, как зарево, блистают.\n\n        Блистают — чередование -блист-/-блест-, после корня стоит суффикс -а- .\n\n    Уж на равнине по холмам грохочут пушки.\n\n        Равнине — исключение (корень -равн-) .\n\n        Холмам — проверочное слово холм .\n\n        Грохочут — проверочное слово грохот .\n\n    Имел он счастливый талант без принужденья в разговоре коснуться до всего слегка.\n\n        Талант — словарное слово .\n\n        Разговоре — проверочное слово говор .\n\n        Коснуться — чередование -кос-/-кас-, после корня нет суффикса -а- .\n\nКакими по цели высказывания являются простые предложения?\n\nВсе простые предложения в данном упражнении являются повествовательными .\n\nМорфемный и словообразовательный разбор:\n\n    Счастливый ← счастье (суффиксальный способ) .\n\n    Грохочут ← грохотать ← грохот (суффиксальный способ) .","37":"Задание\n\nСпишите, раскрывая скобки и обозначая условия выбора слитного, раздельного и дефисного написания слов. На какие группы в зависимости от видов орфограмм их можно разделить?\nСписанные слова с раскрытыми скобками\n\nСлитное написание:\n\n    древнерусский (Древняя Русь)\n\n    железобетонный (железный бетон)\n\n    вагоноремонтный (ремонт вагонов)\n\n    сельскохозяйственный (сельское хозяйство) \n\nДефисное написание:\n\n    юго-запад (сторона света)\n\n    кое-что (приставка кое-)\n\n    северо-западный (от юго-запад)\n\n    светло-синий (оттенок цвета)\n\n    кто-нибудь (суффикс -нибудь)\n\n    сине-зелёный (оттенок цвета)\n\n    почтово-телеграфный (почтовый и телеграфный)\n\n    изжелта-зелёный (оттенок цвета) \n\nРаздельное написание:\n\n    кое с чем (неопределённое местоимение с предлогом)\n\n    ни о чём (отрицательное местоимение с предлогом) \n\nГруппы по видам орфограмм\n\n    Сложные существительные, обозначающие стороны света — юго-запад\n\n    Сложные прилагательные, образованные от сложных существительных с дефисом — северо-западный\n\n    Местоимения с приставкой кое- и суффиксами -то, -либо, -нибудь — кое-что, кто-нибудь\n\n    Отрицательные и неопределённые местоимения с предлогами — кое с чем, ни о чём\n\n    Сложные прилагательные, образованные от словосочетаний с подчинительной связью — древнерусский, железобетонный, вагоноремонтный, сельскохозяйственный\n\n    Сложные прилагательные, образованные от сочетания слов с сочинительной связью — почтово-телеграфный\n\n    Сложные прилагательные, обозначающие оттенки цвета — светло-синий, сине-зелёный, изжелта-зелёный \n\nЕсли у вас рабочая тетрадь (часть 2), упражнение 37 — это составление словосочетаний с предлогами (бежать вдоль дороги, достать из ящика и т. д.) .","38":"Ответ на задание\n1. Характеристика личности М. В. Ломоносова и его вклада в науку А. С. Пушкиным\n\nАлександр Сергеевич Пушкин называет Ломоносова великим человеком и «первым нашим университетом», подчёркивая, что учёный один сделал для отечественного образования столько же, сколько целое научное учреждение.\n\nПушкин характеризует личность Ломоносова через сочетание «необыкновенной силы воли с необыкновенною силой понятия» (ума) и отмечает, что главной страстью его души была «жажда науки». Поэт восхищается универсальностью и широтой интересов Ломоносова: он проявил себя во множестве областей («историк, ритор, механик, химик, минералог, художник и стихотворец»), «всё испытал и всё проник».\n2. Сложный план текста\n\nI. Вступление. А. С. Пушкин о М. В. Ломоносове.\n(Ломоносов — великий просветитель и «первый наш университет»).\n\nII. Научные достижения М. В. Ломоносова в области языка:\n\n    «Российская грамматика» (1757 г.) — первое научное описание системы русского языка.\n    Создание первых школьных учебников на базе трудов учёного.\n    «Краткое руководство к красноречию» — первое пособие по риторике на русском языке.\n\nIII. Заключение. Универсальность гения Ломоносова в оценке Пушкина.\n(Многогранность учёного, охватившего все отрасли науки и искусства).\n3. Значение открытий М. В. Ломоносова в лингвистике\n\nВклад М. В. Ломоносова в развитие науки о языке имеет фундаментальное значение:\n\n    Первое научное описание языка: в 1757 году он опубликовал «Российскую грамматику», где впервые подробно исследовал морфологию, синтаксис, словообразование, а также систематизировал правила правописания (орфографии) и произношения (орфоэпии).\n    Создание школьной базы: именно на основе грамматики Ломоносова в 1770-е годы были написаны самые первые школьные учебники русского языка.\n    Развитие русской риторики: учёный создал «Краткое руководство к красноречию» — первое практическое пособие по риторике, написанное на живом русском языке (до этого подобные книги создавались исключительно на латыни или церковнославянском языке).\n\nОбъяснение структуры сложного плана\n\nСложный план отличается от простого тем, что его основные пункты (обозначаемые римскими цифрами: I, II, III) делятся на подпункты (арабские цифры: 1, 2, 3), раскрывающие содержание смысловых частей текста. Такая структура помогает логично передать развитие мысли автора от вступления через главные аргументы к выводу.\n","39":"Ответ\n\nОсновная мысль текста:\n\nГрамматика — это основа всех наук. Без неё невозможно полноценное существование ни одной дисциплины: ни ораторского искусства, ни поэзии, ни философии, ни истории, ни юриспруденции . Грамматика не просто набор правил — это то, что позволяет целостно формулировать мысли, а не просто перечислять факты .\n\nМоё мнение:\n\nЯ полностью согласен(на) с утверждением М. В. Ломоносова. В любой науке для описания теорий, открытий и идей используется язык. Чтобы точно и правильно донести свою мысль до других, необходимо владеть грамматикой родного языка. Даже небольшая ошибка может сделать сообщение двусмысленным или труднопонимаемым . Безграмотно написанные научные труды и учебники приведут к искажению содержания и утрате точности. Соблюдение грамматических норм во всех сферах — залог сохранения богатства, красоты и силы русского языка .","40":"Задание\n\nОзнакомьтесь с учением М. Ломоносова о трёх стилях русского языка. Передайте современным языком суть этого учения. Приведите примеры языковых единиц и текстов каждого стиля .\nСуть учения о «трёх штилях» современным языком\n\nЛомоносов разделил все слова русского языка на три группы и, в зависимости от их использования, выделил три стиля :\n\n    Высокий стиль — использует общеупотребительные слова вместе с церковнославянской (высокой) лексикой. Жанры: ода, героическая поэма, торжественная речь.\n\n    Средний стиль — использует общеупотребительные слова, допуская отдельные элементы высокой и разговорной лексики. Жанры: элегия, дружеское письмо, сатира, эклога.\n\n    Низкий стиль — использует общеупотребительные и разговорные (просторечные) слова. Жанры: комедия, эпиграмма, песня, бытовое письмо.\n\nПримеры языковых единиц и текстов каждого стиля\n\n1. Высокий стиль\n\nЛексика: очи, зело, длань, уповаю, отрада, блаженство .\n\nПример текста (ода М. Ломоносова):\n\n    Царей и царств земных отрада,\n    Возлюбленная тишина,\n    Блаженство сел, градов ограда,\n    Коль ты полезна и красна! \n\n2. Средний стиль\n\nЛексика: общеупотребительные слова с отдельными элементами высокой или разговорной лексики.\n\nПример текста (элегия Н. Некрасова):\n\n    Пускай нам говорит изменчивая мода,\n    Что тема старая «страдания народа»\n    И что поэзия забыть ее должна.\n    Не верьте, юноши! не стареет она… \n\n3. Низкий стиль\n\nЛексика: клянчить, вопеть, дрыхнуть — разговорные и просторечные слова .\n\nПример текста (басня И. Крылова):\n\n    «Соседка, слышала ль ты добрую молву? —\n    Вбежавши, Крысе Мышь сказала. —\n    Ведь кошка, говорят, попалась в когти льву?\n    Вот рот-то, говорят, какой огромный!»","41":"Задание\n\nПрочитайте выразительно текст. К какому типу речи он относится? Озаглавьте текст. Выпишите сначала относящиеся к самостоятельным частям речи слова, имеющие пропуски и скобки, затем относящиеся к служебным частям речи слова, заключённые в скобки, вместе с самостоятельными словами. Назовите виды орфограмм на месте скобок.\n\nТекст:\nЧ..рная туча совсем надвинулась, и стали видны уже не з..рницы, а молнии, осв..щавшие весь двор и разрушающийся дом с отломанными крыльцами, и гром послышался уже над головой. Все птицы притихли, но зато зашелестели листья...\nДолетела одна капля, другая, забарабанило по лопухам, железу крыши, и ярко вспыхнул весь воздух; всё затихло, и (не)успел Нехлюдов сосчитать три, как страшно треснуло что-то (над)самой головой и раскатилось (по)небу...\nДождик шёл уже ливнем и стекал с крыш(?), журча, в кадушку; молния реже освещала двор и дом.\n(Л. Толстой. «Воскресение»)\nОтвет\n\nТип речи: Описание (в тексте описано начало грозы, состояние природы) .\n\nЗаголовок: «Гроза» .\nСамостоятельные части речи (с пропусками и скобками)\nСлово\tОрфограмма\nЧёрная\tВ корне под ударением после шипящей пишется ё, проверочное слово — чернеть\nЗарницы\tКорень с чередованием -зор-/-зар-, без ударения пишется а\nОсвещавшие\tПроверяемая безударная гласная, проверочное слово — свет\nЗашелестели\tПроверяемая безударная гласная, проверочное слово — шелест\nКрыш\tСуществительное во множественном числе, родительный падеж — ь не пишется\nСлужебные части речи (в скобках)\nСочетание\tОрфограмма\n(не) успел\tЧастица не с глаголами пишется раздельно\n(над) самой\tПредлог над с местоимением пишется раздельно\n(по) небу\tПредлог по с существительным пишется раздельно\nВиды орфограмм на месте скобок\n\n    Раздельное написание частицы не с глаголами (не успел)\n\n    Раздельное написание предлогов с самостоятельными частями речи (над самой, по небу)\n\n    Отсутствие мягкого знака после шипящей на конце существительных (с крыш) ","42":"Списанные слова с обозначением орфограмм\n\n1. При переходе — существительное 2-го склонения, предложный падеж.\n(у) меня — предлог с местоимением пишется раздельно.\nчавкнул — после шипящих ч, ш, щ, ж пишутся гласные и, а, у.\nслетела — проверочное слово полёт.\n\n2. следил — проверочное слово след.\nщиплет — глагол 1-го спряжения (щипать).\nпроглатывает — суффикс -ыва- сохраняется (проглатываю).\n\n3. На ночь — существительное 3-го склонения, на конце после шипящей пишется ь.\nптицы — после ц в окончаниях существительных пишется ы.\nподнялись — проверочное слово подняться.\nполакомиться — что сделать? (неопределённая форма).\n\n4. жёлтой — в корне под ударением после шипящей пишется ё, проверочное слово желтеть.\nузенькое — мягкий знак указывает на мягкость согласного н перед твёрдым к.\nзакроется — что сделает?\nоткроется — что сделает?\n\n5. Вставало — проверочное слово встать.\nсветлело — проверочное слово свет.\nМорфологический разбор\n\nГлухарка³\n\n    Глухарка — имя существительное (обозначает предмет, отвечает на вопрос кто?).\n\n    Начальная форма — глухарка.\n\n    Постоянные признаки: нарицательное, одушевлённое, женский род, 1-е склонение.\n\n    Непостоянные признаки: единственное число, именительный падеж.\n\n    Синтаксическая роль: подлежащее (слетела кто? — глухарка).\n\nГлухарём³\n\n    Глухарём — имя существительное (обозначает предмет, отвечает на вопрос за кем?).\n\n    Начальная форма — глухарь.\n\n    Постоянные признаки: нарицательное, одушевлённое, мужской род, 2-е склонение.\n\n    Непостоянные признаки: единственное число, творительный падеж.\n\n    Синтаксическая роль: дополнение (следил за кем? — за глухарём).\n\nПроглатывает³\n\n    Проглатывает — глагол (обозначает действие, отвечает на вопрос что делает?).\n\n    Начальная форма — проглатывать.\n\n    Постоянные признаки: несовершенный вид, переходный, невозвратный, 1-е спряжение.\n\n    Непостоянные признаки: изъявительное наклонение, настоящее время, единственное число, 3-е лицо.\n\n    Синтаксическая роль: сказуемое (он что делает? — проглатывает).\n\nЖёлтой³\n\n    Жёлтой — имя прилагательное (обозначает признак предмета, отвечает на вопрос какой?).\n\n    Начальная форма — жёлтый.\n\n    Постоянные признаки: качественное.\n\n    Непостоянные признаки: полная форма, единственное число, женский род, предложный падеж.\n\n    Синтаксическая роль: определение (в кроне какой? — жёлтой).","43":"Таблица: Правописание буквы Ь на конце слов после шипящих\nЧасть речи \tБуква Ь пишется \tБуква Ь НЕ пишется\nИмя существительное \tВ именах существительных 3-го склонения (женский род, ед. ч., И. п. / В. п.):• ночь (3-е скл., ж. р.)• рожь (3-е скл., ж. р.)• мышь (3-е скл., ж. р.)• вещь (3-е скл., ж. р.) \t1. В именах существительных 2-го склонения (мужской род, ед. ч.):• луч (2-е скл., м. р.)• нож (2-е скл., м. р.)• шалаш (2-е скл., м. р.)• *товарищ (2-е скл., м. р.)*2. В форме родительного падежа множественного числа существительных 1-го и 2-го склонения:• (много) туч (Р. п., мн. ч.)• (из-за) туч (Р. п., мн. ч.)• (с) крыш (Р. п., мн. ч.)• (из) училищ (Р. п., мн. ч.)\nКраткое прилагательное \t— (никогда не пишется) \tНа конце кратких прилагательных:• горяч (кратк. прил.)• свеж (кратк. прил.)• хорош (кратк. прил.)• могуч (кратк. прил.)\nГлагол \tВо всех глагольных формах:1. Неопределённая форма (инфинитив):• *печь, беречься*2. Форма 2-го лица ед. ч. настоящего/будущего времени:• пишешь, читаешься3. Повелительное наклонение:• режь, спрячьте \t— (никогда не бывает форм без Ь)\nНаречие \tНа конце наречий:• настежь (нареч.)• сплошь (нареч.)• вскачь (нареч.)• прочь (нареч.) \tВ словах-исключениях:• уж• замуж• невтерпёж\nЧастица \tНа конце частиц:• лишь• бишь• ишь• вишь \t—\nОбъяснение правила\n\nЧтобы правильно определить, нужен ли мягкий знак после шипящих (ж, ч, ш, щ) на конце слова, действуйте по алгоритму:\n\n    Определите часть речи:\n        Глагол: мягкий знак пишется всегда (беречь, учишь, отрежь).\n        Краткое прилагательное: мягкий знак не пишется никогда (дремуч, пахуч).\n        Наречие: мягкий знак пишется всегда, кроме трёх исключений (уж, замуж, невтерпёж).\n\n    Если это имя существительное, определите род, склонение и число:\n        3-е склонение (женский род): Ь пишется (тишь, дочь).\n        2-е склонение (мужской род): Ь не пишется (меч, борщ).\n        Множественное число в родительном падеже: Ь не пишется (дач, рощ, плеч).\n","44":"Списанные пословицы\n\n    Кто умеет веселиться, того горе боится.\n\n    С умным разговориться — что мёду напиться.\n\n    Кто хочет от жизни толку доб
